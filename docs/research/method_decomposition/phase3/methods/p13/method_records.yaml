schema_version: phase3-method-records-1.0
method_id: P13
variant: convergent_mixed_methods_policy_evaluation
defaults:
  move:
    level: analytical_move
    operation_kind: analytic
    source_authority_or_inferential_role: nih_and_fetters_mixed_methods_guidance_plus_strand_specific_sources
    applicability_boundary: frozen_convergent_evaluation_design_and_declared_population_context
    refusal_or_qualification: preserve_strand_result_and_withhold_or_bound_meta_inference
    performer: strand_or_integration_team
