  verdict: different_capability
  justification: '''Test'' here covers at least five unrelated operations: re-estimation under alternative assumptions (p02/p03
    sensitivity), pre-period diagnostics that are explicitly ''not identification proofs'' (p03 pretrend), asymmetric subset-relation
    necessity analysis with consistency and coverage (p04 necessity), instrument pretesting and intercoder reliability that
    loop back to design (p06 pretest, p07 pilot), out-of-sample scoring with proper scores (p08 score), and code-versus-specification
    verification that ''asks whether code matches specification not whether model is true'' (p09 verify). Permitted conclusions
    differ in kind: ''named_condition_is_or_is_not_consistent_with_necessity'' is a substantive configurational claim, ''this
    codebook version can be applied reliably'' is a measurement-instrument claim, ''tested_build_behaves_as_specified'' is
    a software claim, and ''candidates_compare_out_of_sample'' is a predictive comparison. Inputs and outputs also differ
    (finding vs appraisal vs evidence_item). Only the two sensitivity steps share a signature, and they are adjudicated separately
    in sig:b12726ae63.'
  what_breaks_if_merged: 'A merged test capability would have to pick one notion of pass/fail: a hypothesis-test p-value would
    misread p03''s low-power non-rejection as evidence of parallel trends (which its qualification forbids), would treat p04
    necessity as symmetric correlation instead of a subset relation, would score p07 reliability against an accuracy metric
    instead of a frozen agreement threshold on fresh pilot documents, and would let p09 verification be read as model validation.
    The return-to-design loops in p06 and p07 would also be lost, because a single-pass test has no successor-version output.'
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
