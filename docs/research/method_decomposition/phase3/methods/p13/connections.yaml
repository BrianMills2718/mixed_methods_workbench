topology_assertions:
- qualitative_and_quantitative_strands_are_independently_warranted
- integration_readiness_can_return_only_the_affected_strand
- joint_display_preserves_both_strand_lineages_and_explicit_nonalignment
- divergence_may_return_to_alignment_or_either_strand_and_may_remain_unresolved
- meta_inference_requires_both_strands_joint_display_and_divergence_disposition
- meta_infer_is_entered_only_through_p13.c18_from_fit_with_both_strand_slots_required_so_strand_context_p13.c19_and_p13.c20_is_never_a_bypass
topology:
  shape: adaptive
  required_cycles: []
  optional_cycles:
  - cycle: p13.move.fit -> p13.move.align -> p13.move.joint_display -> p13.move.fit
    edges:
    - p13.c15
    - p13.c10
    - p13.c14
    condition: apparent discordance may be alignment error
    termination: divergence explained by realignment, retained as unresolved, or the
      evidence budget is spent
    termination_authority: human (mixed_methods_lead)
  - cycle: p13.move.fit -> p13.move.qual_warrant -> p13.move.check_readiness -> p13.move.align
      -> p13.move.joint_display -> p13.move.fit
    edges:
    - p13.c16
    - p13.c03
    - p13.c05
    - p13.c10
    - p13.c14
    condition: qualitative reanalysis or evidence is justified
    termination: divergence explained, retained as unresolved, or the evidence budget
      is spent
    termination_authority: human (mixed_methods_lead)
  - cycle: p13.move.fit -> p13.move.quant_warrant -> p13.move.check_readiness -> p13.move.align
      -> p13.move.joint_display -> p13.move.fit
    edges:
    - p13.c17
    - p13.c04
    - p13.c05
    - p13.c10
    - p13.c14
    condition: quantitative reanalysis or evidence is justified
    termination: divergence explained, retained as unresolved, or the evidence budget
      is spent
    termination_authority: human (mixed_methods_lead)
  - cycle: p13.move.meta_infer -> p13.action.trace_meta -> p13.move.meta_infer
    edges:
    - p13.c29
    - p13.c22
    condition: a draft meta-inference is traced to both strand records before it is finalized
    termination: trace receipt shows every link complete, or the meta-inference is narrowed
      to what the trace supports
    termination_authority: human (mixed_methods_reviewer)
  prohibited_cycles:
  - cycle: p13.move.fit -> p13.move.design
    reason: observed fit cannot rewrite frozen convergent design in place
  prohibited_edges:
  - p13.c23
  - p13.c24
  - p13.c25
  entry_points:
  - p13.move.design
  terminal_points:
  - step: p13.move.meta_infer
    state: bounded_meta_inference
  - step: p13.move.fit
    state: honest_stop_unresolved_divergence_or_noncommensurability
  - step: p13.move.check_readiness
    state: honest_stop_one_or_both_strands_invalid
