  connection_type: prohibited_transition
  from_output: bounded_appraisal_advice
  to_input: off_choices_ratings_rationales_and_longlist
  slot_compatibility: not_artifact_transfer
topology_assertions:
- off_is_standard_route_and_mcda_is_conditional_longlist_branch
- shortlist_cba_or_cea_is_mandatory_after_either_longlist_route
- monetized_unmonetized_distributional_and_uncertainty_evidence_join_before_advice
- advice_assurance_decision_and_successor_feedback_remain_separate
- shortlist_appraisal_may_return_to_shortlist_or_longlist_before_advice
- assurance_rejection_returns_to_a_named_rework_stage_before_decision
topology:
  shape: adaptive
  required_cycles:
  - cycle: p11.move.shortlist -> p11.move.appraise_cba_cea -> p11.move.qualify_impacts
      -> p11.move.compare_advise -> p11.move.shortlist
    edges:
    - p11.c09
    - p11.c12
    - p11.c14
    - p11.c22
    condition: shortlist appraisal shows an option unlikely to meet objectives or
      CSFs
    termination: a revised shortlist yields comparable evidence, or no viable option
      beyond BAU remains
    termination_authority: human
  - cycle: p11.move.generate_off -> p11.move.choose_longlist_route -> p11.move.shortlist
      -> p11.move.appraise_cba_cea -> p11.move.qualify_impacts -> p11.move.compare_advise
      -> p11.move.generate_off
    edges:
    - p11.c04
    - p11.c06
    - p11.c09
    - p11.c12
    - p11.c14
    - p11.c23
    condition: no remaining longlist option meets objectives or the longlist is inadequate
    termination: a successor longlist yields a viable shortlist, or the SRO records
      no viable option beyond BAU
    termination_authority: human
  - cycle: p11.move.compare_advise -> p11.move.assure -> p11.move.compare_advise
    edges:
    - p11.c21
    - p11.c24
    condition: assurance rejects the advice's balance, presentation or preferred-option
      reasoning
    termination: assurance accepts the advice or a no-preference finding
    termination_authority: human
  - cycle: p11.move.appraise_cba_cea -> p11.move.compare_advise -> p11.move.assure
      -> p11.move.appraise_cba_cea
    edges:
    - p11.c13
    - p11.c21
    - p11.c25
    condition: assurance rejects valuation, risk or sensitivity evidence
    termination: assurance accepts the reworked appraisal evidence
    termination_authority: human
  optional_cycles:
  - cycle: p11.move.rationale -> p11.move.objectives -> p11.move.generate_off -> p11.move.choose_longlist_route
      -> p11.move.shortlist -> p11.move.appraise_cba_cea -> p11.move.compare_advise
      -> p11.move.assure -> p11.move.decide_feedback -> p11.move.rationale
    edges:
    - p11.c01
    - p11.c02
    - p11.c04
    - p11.c06
    - p11.c09
    - p11.c13
    - p11.c21
    - p11.c15
    - p11.c17
    condition: monitoring evaluation or material change opens successor appraisal
    termination: no material change or evaluation finding requires reappraisal
    termination_authority: human
  prohibited_cycles:
  - cycle: p11.move.choose_longlist_route -> p11.move.shortlist -> p11.move.appraise_cba_cea
      -> p11.move.compare_advise -> p11.move.choose_longlist_route
    reason: switching the same longlist to MCDA after seeing shortlist results lets
      results choose the appraisal route
  prohibited_edges:
  - p11.c18
  - p11.c19
  - p11.c27
  entry_points:
  - p11.move.rationale
  terminal_points:
  - step: p11.move.decide_feedback
    state: accountable_decision_and_learning_trigger
  - step: p11.move.compare_advise
    state: honest_stop_no_robust_preference
  - step: p11.move.shortlist
    state: honest_stop_no_viable_option_beyond_bau
