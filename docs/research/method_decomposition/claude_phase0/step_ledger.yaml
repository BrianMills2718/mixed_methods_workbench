# =========================================================================
# METHOD 2 — pt_core_rival_explanation  (11 distinct ideal ops; 11 rows)
# =========================================================================

- method_id: pt_core_rival_explanation
  step_id: pt_core_rival_explanation.01
  verb: extract
  label: "extract actors/events/evidence/mechanisms/edges from source text"
  workflow_role: acquire
  operation_kind: analytic
  actor_chain: [llm_engine, deterministic_validator, llm_engine]
  inputs:
    - {slot: source_documents, type: source_document, role: subject, cardinality: many, optional: false}
  outputs:
    - {slot: evidence_base, type: evidence_item, role: result, cardinality: many, optional: false}
  parameters: [chunk size, extraction model]
  preconditions: [admitted source corpus exists]
  conclusion_supported: "evidence item E is grounded to an exact source span in document D"
  failure_output: "precondition unmet — quote-anchor unresolvable after repair attempt"
  method_owned_semantics: "which extracted items are analytically significant is a PT-analyst judgment; software enforces grounding, not significance"
  evidence_basis: "Bennett & Checkel 2015 ch.1 (evidence extraction as the first analytic task); Fairfield & Charman 2017 sec. 2"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "pt/pass_extract.py (chunked LLM extraction; resolve_source_quote_span_id:70, repair_source_quote_anchors:185 — a second, deterministic-failure-gated LLM repair call)"
  optional: false
  repeatable: true

- method_id: pt_core_rival_explanation
  step_id: pt_core_rival_explanation.02
  verb: identify
  label: "identify hypothesis and rival explanations"
  workflow_role: frame
  operation_kind: analytic
  actor_chain: [llm_engine, deterministic_engine]
  inputs:
