  record_id: p10.move.frame
  parent_phase: p10.phase.frame
  label: frame decisions uncertainties outcomes relationships and values
  information_origin:
  - reported
  - elicited
  - interpreted
  method_owned_rule: frame_separates_actions_exogenous_uncertainties_relations_outcomes_and_value_thresholds_and_composes_the_first_batch_of_candidate_strategies_from_the_declared_levers
  permitted_conclusion: exploratory_experiment_has_declared_scope
  source_basis: lempert_2003_chs_1_3
  exact_anchors:
  - lempert_2003_ch1
  - lempert_2003_ch2
  - groves_2019_step1
  verb: define
  inputs:
  - slot: decision_problem
    type: claim
    role: subject
    cardinality: one
    optional: false
  - slot: candidate_actions
    type: option
    role: context
    cardinality: one
    optional: false
  - slot: stakeholder_values
    type: value_judgment
    role: context
    cardinality: many
    optional: false
  - slot: models_and_evidence
    type: evidence_item
    role: context
    cardinality: one
    optional: false
  outputs:
  - slot: frozen_xlrpm_frame
    type: configuration
    role: result
    cardinality: one
    optional: false
  - slot: initial_candidate_strategies
    type: option
    role: result
    cardinality: many
    optional: false
  slot_note: initial_candidate_strategies are the first-batch strategies composed from the
    declared candidate_actions (the levers of the frame); later batches come only from
    revise_strategy through p10.c12, so the first evaluate pass has a typed source (p10.c19)
