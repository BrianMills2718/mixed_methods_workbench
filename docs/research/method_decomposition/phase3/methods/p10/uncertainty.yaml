schema_version: phase3-method-uncertainty-1.0
method_id: P10
items:
  - {id: p10.u01, status: known, subject: deep_uncertainty, statement: "Models, probabilities, and values are disputed or unknown.", downstream_effect: "Conclusions are conditional robustness and vulnerability statements, not forecasts."}
  - {id: p10.u02, status: contested, subject: plausible_future_boundary, statement: "No model ensemble can establish exhaustive plausibility.", downstream_effect: "Record inclusion rationales and residual blind spots."}
  - {id: p10.u03, status: known, subject: robustness_metric, statement: "Satisficing thresholds and trade-offs are value choices.", downstream_effect: "Value authority remains human and sensitivity is reported."}
  - {id: p10.u04, status: known, subject: adaptivity, statement: "Signposts and contingent actions depend on monitoring and institutional feasibility.", downstream_effect: "Strategy advice remains conditional and versioned."}
  - {id: p10.u05, status: unknown, subject: unmodeled_futures, statement: "The effect of futures outside the declared ensemble is unknown.", downstream_effect: "No robustness claim extends beyond the explored ensemble and residual blind spots."}
  - {id: p10.u06, status: source_limited, subject: implementation_detail, statement: "The frozen sources define the RDM logic but do not mandate one universal scenario-discovery algorithm or robustness metric.", downstream_effect: "Algorithm and metric choices remain explicit study parameters rather than method invariants."}
  - {id: p10.u07, status: known, subject: successor_strategy_typing, statement: "Successor strategies are candidates for retest, so they are typed option; signposts and triggers are typed criterion and successor future requests configuration, each in its own slot.", downstream_effect: "Only p10.move.advise emits a recommendation; the adaptive loop feeds options back to evaluation (p10.c12) and future requests back to ensemble generation (p10.c17)."}
  - {id: p10.u08, status: known, subject: frame_operation_kind, statement: "XLRM framing sets the outcome measures and satisficing thresholds that later robustness and vulnerability claims depend on.", downstream_effect: "p10.move.frame and p10.phase.frame are classified analytic, not methodological_support."}
  - {id: p10.u09, status: known, subject: first_batch_strategies, statement: "The first experiment batch's candidate strategies are composed in frame from the declared levers (candidate_actions) and reach evaluate and run_ensemble through p10.c19 and p10.c20; successor batches arrive only by p10.c12 and p10.c21 from revise_strategy.", downstream_effect: "evaluate.candidate_strategies stays required and always has a typed source; an engine runs exactly one strategy source per batch (initial or successor), and the first batch's strategies are part of the frozen frame's version."}
