  - {record_id: p11.phase.longlist, level: method_phase, label: generate and filter longlist, operation_kinds: [analytic, methodological_support], collision_participation: none}
  - {record_id: p11.phase.shortlist, level: method_phase, label: appraise shortlist and advise decision, operation_kinds: [analytic, runtime_delivery, methodological_support], collision_participation: none}
moves:
  - {<<: *m, record_id: p11.move.rationale, parent_phase: p11.phase.frame, label: establish case for change theory of change and business as usual, inputs: [policy_problem_evidence, existing_arrangements, stakeholder_evidence], output: rationale_theory_and_bau_record, information_origin: [observed, reported, interpreted], method_owned_rule: sponsored_solution_is_not_problem_evidence_and_bau_is_explicit, permitted_conclusion: intervention_case_and_counterfactual_are_bounded, source_basis: green_book_2026_ch4, exact_anchors: [green_book_2026_sections_4_1_4_28]}
  - {<<: *m, record_id: p11.move.objectives, parent_phase: p11.phase.frame, label: set SMART objectives critical success factors and authority, inputs: [rationale_theory_and_bau_record, stakeholder_goals, constraints], output: objective_csf_and_authority_record, information_origin: [elicited, interpreted], method_owned_rule: objectives_and_csfs_do_not_encode_a_favored_option, permitted_conclusion: option_generation_and_screening_have_declared_criteria, source_basis: green_book_2026_chs4_5, exact_anchors: [green_book_2026_ch4_objectives, green_book_2026_ch5_csfs], operation_kind: methodological_support}
  - {<<: *m, record_id: p11.move.generate_off, parent_phase: p11.phase.longlist, label: generate materially distinct options using the Options Framework Filter, inputs: [objective_csf_and_authority_record, rationale_theory_and_bau_record], output: off_choices_ratings_rationales_and_longlist, information_origin: [elicited, interpreted, reported], method_owned_rule: scope_solution_delivery_implementation_funding_choices_include_bau_do_minimum_and_genuine_variation, permitted_conclusion: broad_option_space_and_ratings_are_documented, source_basis: green_book_2026_ch5, exact_anchors: [green_book_2026_sections_5_13_5_35]}
  - {<<: *m, record_id: p11.move.choose_longlist_route, parent_phase: p11.phase.longlist, label: decide whether OFF resolves trade-offs or expert-facilitated MCDA is needed, inputs: [off_choices_ratings_rationales_and_longlist, objective_csf_and_authority_record], output: longlist_route_decision, information_origin: [interpreted], method_owned_rule: mcda_only_for_unresolved_complex_technical_tradeoffs_with_expert_facilitation, permitted_conclusion: continue_with_off_or_activate_bounded_mcda, source_basis: green_book_2026_sections_5_13_5_16_and_mcda_2024, exact_anchors: [green_book_2026_5_13_5_16, mcda_2024_scope], operation_kind: methodological_support}
  - {<<: *m, record_id: p11.move.mcda, parent_phase: p11.phase.longlist, label: conduct bounded swing-weighted MCDA when activated, inputs: [off_choices_ratings_rationales_and_longlist, objective_csf_and_authority_record, longlist_route_decision], output: facilitated_mcda_results_and_dissent, information_origin: [elicited, derived, interpreted], method_owned_rule: expert_facilitation_swing_weighting_rationales_and_sensitivity_not_simple_mca, permitted_conclusion: technical_longlist_tradeoffs_are_structured_for_shortlisting, source_basis: green_book_mcda_2024, exact_anchors: [mcda_2024_steps_1_6], value_goal_authority: authorized_stakeholders}
  - {<<: *m, record_id: p11.move.shortlist, parent_phase: p11.phase.longlist, label: form viable shortlist and rejection log, inputs: [off_choices_ratings_rationales_and_longlist, longlist_route_decision, facilitated_mcda_results_and_dissent], output: shortlist_rejection_log_and_preferred_way_forward, information_origin: [interpreted, elicited], method_owned_rule: bau_always_continues_and_viability_rationales_remain_visible, permitted_conclusion: shortlisted_options_merit_detailed_appraisal, source_basis: green_book_2026_ch5, exact_anchors: [green_book_2026_shortlist_selection]}
  - {<<: *m, record_id: p11.move.appraise_cba_cea, parent_phase: p11.phase.shortlist, label: appraise shortlist using social CBA or CEA, inputs: [shortlist_rejection_log_and_preferred_way_forward, rationale_theory_and_bau_record], output: comparable_incremental_social_value_or_cost_effectiveness_results, information_origin: [observed, reported, derived], method_owned_rule: cba_when_benefits_can_be_monetized_cea_when_benefits_are_unmonetizable_with_consistent_social_perspective, permitted_conclusion: shortlist_has_comparable_primary_economic_results, source_basis: green_book_2026_ch6, exact_anchors: [green_book_2026_ch6_cba_cea]}
  - {<<: *m, record_id: p11.move.qualify_impacts, parent_phase: p11.phase.shortlist, label: preserve unmonetized distributional risk and uncertainty evidence, inputs: [shortlist_rejection_log_and_preferred_way_forward, comparable_incremental_social_value_or_cost_effectiveness_results], output: unmonetized_distributional_and_uncertainty_results, information_origin: [observed, reported, derived, interpreted], method_owned_rule: aggregate_metrics_cannot_erase_material_unmonetized_impacts_group_harms_or_fragility, permitted_conclusion: material_nonaggregate_tradeoffs_and_switching_conditions_are_visible, source_basis: green_book_2026_chs6_9, exact_anchors: [green_book_2026_ch6_unmonetized, green_book_2026_ch7, green_book_2026_ch8]}
  - {<<: *m, record_id: p11.move.compare_advise, parent_phase: p11.phase.shortlist, label: form balanced comparative judgment and recommendation or no preference, inputs: [comparable_incremental_social_value_or_cost_effectiveness_results, unmonetized_distributional_and_uncertainty_results, shortlist_rejection_log_and_preferred_way_forward], output: assured_bounded_appraisal_advice, information_origin: [interpreted, derived], method_owned_rule: value_for_money_is_balanced_judgment_and_fragility_may_withhold_preference, permitted_conclusion: conditional_recommendation_or_no_robust_preference, source_basis: green_book_2026_ch9, exact_anchors: [green_book_2026_ch9_presentation]}
  - {<<: *m, record_id: p11.move.decide_feedback, parent_phase: p11.phase.shortlist, label: record accountable decision and successor monitoring evaluation feedback, inputs: [assured_bounded_appraisal_advice], output: decision_record_and_successor_learning_trigger, information_origin: [elicited], method_owned_rule: recommendation_is_not_decision_and_feedback_opens_a_successor_version, permitted_conclusion: accountable_choice_and_future_review_trigger_are_recorded, source_basis: green_book_2026_roamref, exact_anchors: [green_book_2026_roamref], performer: decision_secretariat, judgment_owner: senior_responsible_owner_for_appraisal, acceptance_authority: appraisal_assurance_reviewer, recommender: senior_responsible_owner_for_appraisal, decision_authority: accountable_decision_maker, operation_kind: methodological_support}
actions:
  - {<<: *a, record_id: p11.action.calculate, parent_move: p11.move.appraise_cba_cea, label: calculate discounted CBA or CEA metrics from frozen assumptions, operation_kind: analytic, inputs: [shortlist_rejection_log_and_preferred_way_forward], output: calculation_receipt, method_owned_rule: economic_method_and_assumptions_are_reviewed, permitted_conclusion: numerical_metrics_only, source_basis: green_book_2026_ch6, exact_anchors: [green_book_2026_ch6]}
  - {<<: *a, record_id: p11.action.publish_ast, parent_move: p11.move.compare_advise, label: render balanced appraisal summary table, inputs: [assured_bounded_appraisal_advice], output: appraisal_summary_artifact, method_owned_rule: none, permitted_conclusion: no_additional_analytic_conclusion, source_basis: green_book_2026_ch9, exact_anchors: [green_book_2026_ch9_ast]}
