schema_version: phase3-method-uncertainty-1.0
method_id: P12
items:
  - {id: p12.u01, status: known, subject: panel_composition, statement: "Purposive expertise does not create population representativeness.", downstream_effect: "Report eligibility, recruitment, composition, nonresponse, and attrition."}
  - {id: p12.u02, status: contested, subject: consensus_threshold, statement: "No universal statistical definition of Delphi consensus exists.", downstream_effect: "Prespecify measures and thresholds; report distributions and dissensus."}
  - {id: p12.u03, status: known, subject: feedback_effect, statement: "Controlled feedback may inform revision but can also pressure convergence.", downstream_effect: "Preserve round histories, rationales, and stable minority views."}
  - {id: p12.u04, status: known, subject: truth_status, statement: "Consensus is expert judgment evidence, not verification of the underlying proposition.", downstream_effect: "Prohibit truth or decision claims from consensus alone."}
  - {id: p12.u05, status: unknown, subject: round_three_retention, statement: "Panel retention and the direction of final judgment revision are unknown before the rounds occur.", downstream_effect: "Report attrition and missingness and permit an insufficient-panel-evidence terminal."}
  - {id: p12.u06, status: source_limited, subject: exact_round_count, statement: "RAND says two or three rounds are generally sufficient but does not make exactly three universal; three is the portfolio-frozen policy-Delphi variant.", downstream_effect: "Do not generalize this topology to every Delphi design."}
  - {id: p12.u07, status: source_limited, subject: policy_delphi_variant_anchor, statement: "Turoff 1970 is frozen as the policy-Delphi variant locator (DOI confirmed), but its text and the Linstone and Turoff chapter could not be re-read on 2026-10-08; the options, pro/con argument, and desirability/feasibility/importance/confidence rules rest on article-level anchoring and secondary descriptions.", downstream_effect: "Policy-Delphi move rules carry article-level anchors only; an independent review must not infer page wording, and a re-read may refine round content without changing the three-round topology."}
  - {id: p12.u08, status: known, subject: authority_split, statement: "Panel ratings are owned by individual anonymous panelists; feedback neutrality and consensus/dissensus interpretation are owned by the convener.", downstream_effect: "judgment_owner is individual_anonymous_panelists only on round1-3 and delphi_method_lead on design, panel, feedback1, feedback2, interpret and report."}
