schema_version: phase1-revision-candidate-0.2
status: exploratory_not_adopted
note: >-
  YAML anchors reduce repetition only; after YAML resolution every record has
  every proposed field. Information-origin and role values are observations,
  not adopted enums.

move_defaults: &move
  level: analytical_move
  operation_kind: analytic
  information_origin: [interpreted]
  source_authority_or_inferential_role: frozen_methodology_source_and_declared_method_input
  applicability_boundary: named_method_variant_and_declared_study_scope
  refusal_or_qualification: bounded_incomplete_result
  performer: human_analyst
  judgment_owner: method_lead
  acceptance_authority: method_reviewer
  recommender: none
  value_goal_authority: none
  decision_authority: none
  implementation_evidence: methodology_reference_only
  collision_participation: level_2_only
  connections_ref: connections.yaml
  guards: {temporal: no_additional_barrier, access: declared_source_scope_only, run_version: immutable_input_and_successor_output_versions}

action_defaults: &action
  level: execution_action
  information_origin: [derived]
  source_authority_or_inferential_role: parent_move_execution_receipt
  applicability_boundary: parent_move_and_bound_input_versions
  refusal_or_qualification: action_failure_blocks_parent_move
  performer: deterministic_engine
  judgment_owner: none
  acceptance_authority: method_reviewer
  recommender: none
  value_goal_authority: none
  decision_authority: none
  implementation_evidence: design_only
  collision_participation: level_3_only
  connections_ref: connections.yaml
  guards: {temporal: parent_move_order, access: parent_move_inputs_only, run_version: action_receipt_binds_input_and_output_versions}

methods:
  - method_id: grounded_theory
    variant: constructivist grounded theory
    phases:
      - {phase_id: gt.phase.inquiry, level: method_phase, label: orient and gather, operation_kinds: [analytic], collision_participation: none}
      - {phase_id: gt.phase.analysis, level: method_phase, label: code compare and memo, operation_kinds: [analytic, runtime_delivery], collision_participation: none}
      - {phase_id: gt.phase.development, level: method_phase, label: develop sample and integrate, operation_kinds: [analytic, methodological_support], collision_participation: none}
    moves:
      - {<<: *move, record_id: gt.move.gather, parent_phase: gt.phase.inquiry, label: gather rich initial data, inputs: [open_inquiry], output: source_material, method_owned_rule: richness_and_relevance, permitted_conclusion: corpus_can_support_initial_analysis, source_basis: 'Charmaz 3e chs.2-4', exact_anchors: [compact:gt.02, rerun:GT01]}
      - {<<: *move, record_id: gt.move.segment, parent_phase: gt.phase.analysis, label: segment material into incidents, inputs: [source_material], output: anchored_incidents, information_origin: [observed, reported], method_owned_rule: analytically_meaningful_incident_boundary, permitted_conclusion: incidents_are_available_for_close_coding, source_basis: 'Charmaz 3e ch.5', exact_anchors: ['gap:gt.02->gt.03', rerun:GT02]}
      - {<<: *move, record_id: gt.move.initial_code, parent_phase: gt.phase.analysis, label: conduct initial coding, inputs: [anchored_incidents], output: initial_codes, information_origin: [interpreted], method_owned_rule: provisional_action_oriented_coding, permitted_conclusion: provisional_codes_characterize_incidents, source_basis: 'Charmaz 3e ch.5', exact_anchors: [compact:gt.03, rerun:GT02]}
      - {<<: *move, record_id: gt.move.compare, parent_phase: gt.phase.analysis, label: compare incidents codes and cases, inputs: [anchored_incidents, initial_codes], output: comparison_record, method_owned_rule: generative_constant_comparison, permitted_conclusion: variation_refines_emerging_analysis, source_basis: 'Charmaz 3e chs.5-6', exact_anchors: [compact:gt.04, rerun:GT03]}
      - {<<: *move, record_id: gt.move.memo, parent_phase: gt.phase.analysis, label: write analytic and reflexive memos, inputs: [initial_codes, comparison_record], output: versioned_memos, method_owned_rule: memo_advances_analysis_and_reflexivity, permitted_conclusion: rationale_questions_and_position_are_explicit, source_basis: 'Charmaz 3e ch.7; Charmaz 2020', exact_anchors: [compact:gt.06, rerun:GT04]}
      - {<<: *move, record_id: gt.move.focus, parent_phase: gt.phase.development, label: focus codes and construct categories, inputs: [initial_codes, comparison_record, versioned_memos], output: provisional_categories, method_owned_rule: conceptual_significance_not_frequency, permitted_conclusion: categories_have_named_properties_and_gaps, source_basis: 'Charmaz 3e chs.6-7', exact_anchors: [compact:gt.05, compact:gt.07, rerun:GT05, rerun:GT06]}
      - {<<: *move, record_id: gt.move.sample, parent_phase: gt.phase.development, label: design and conduct theoretical sampling, inputs: [provisional_categories], output: targeted_source_increment, method_owned_rule: sampling_follows_category_need, permitted_conclusion: new_data_targets_named_category_gaps, source_basis: 'Charmaz 3e ch.8; Charmaz 2020', exact_anchors: [compact:gt.08, compact:gt.09, rerun:GT07, rerun:GT08, rerun:GT09], guards: {temporal: categories_precede_sampling, access: access_limits_are_recorded, run_version: each_increment_creates_successor_corpus_version}}
      - {<<: *move, record_id: gt.move.refine, parent_phase: gt.phase.development, label: refine codes categories and memos, inputs: [targeted_source_increment, provisional_categories, versioned_memos], output: revised_analysis_bundle, method_owned_rule: new_data_may_split_relate_qualify_or_reject, permitted_conclusion: analysis_records_disconfirming_and_supporting_variation, source_basis: 'Charmaz 3e chs.5-8', exact_anchors: [rerun:GT10]}
      - {<<: *move, record_id: gt.move.adequacy, parent_phase: gt.phase.development, label: argue category adequacy, inputs: [revised_analysis_bundle, comparison_record], output: adequacy_appraisal, method_owned_rule: adequacy_is_reasoned_not_counted, permitted_conclusion: integrate_or_return_or_stop_partial, source_basis: 'Charmaz 3e ch.8', exact_anchors: [compact:gt.10, rerun:GT11]}
      - {<<: *move, record_id: gt.move.integrate, parent_phase: gt.phase.development, label: integrate and reflexively bound theory, inputs: [revised_analysis_bundle, adequacy_appraisal], output: bounded_interpretive_theory, method_owned_rule: interpretive_integration_preserves_position_and_limits, permitted_conclusion: bounded_theory_or_descriptive_partial_account, source_basis: 'Charmaz 3e chs.8-9; Charmaz 2020', exact_anchors: [compact:gt.11, compact:gt.12, rerun:GT12, rerun:GT13, rerun:GT14]}
    actions:
      - {<<: *action, record_id: gt.action.anchor_segments, parent_move: gt.move.segment, label: persist exact segment anchors, operation_kind: runtime_delivery, inputs: [source_material], output: anchored_segment_artifact, method_owned_rule: none, permitted_conclusion: no_analytic_conclusion, source_basis: no_methodology_counterpart, exact_anchors: [capability:segment-source-material-into-incidents]}
      - {<<: *action, record_id: gt.action.audit_sampling, parent_move: gt.move.sample, label: record sampling rationale and access, operation_kind: methodological_support, performer: human_analyst, inputs: [provisional_categories], output: sampling_audit_record, method_owned_rule: rationale_matches_category_need, permitted_conclusion: sampling_basis_is_auditable, source_basis: 'Charmaz 3e ch.8', exact_anchors: [rerun:GT08]}

  - method_id: causal_effect_estimation_rct
    variant: individually randomized two-arm parallel superiority trial with prespecified ITT estimand
    phases:
      - {phase_id: rct.phase.design, level: method_phase, label: define and prespecify, operation_kinds: [analytic, methodological_support], collision_participation: none}
      - {phase_id: rct.phase.conduct, level: method_phase, label: assign conduct and measure, operation_kinds: [analytic, methodological_support, runtime_delivery], collision_participation: none}
      - {phase_id: rct.phase.infer, level: method_phase, label: estimate stress conclude report, operation_kinds: [analytic], collision_participation: none}
    moves:
      - {<<: *move, record_id: rct.move.estimand, parent_phase: rct.phase.design, label: define objective and estimand, inputs: [causal_policy_question], output: frozen_estimand, method_owned_rule: five_estimand_attributes_align_question_and_effect, permitted_conclusion: trial_targets_this_causal_contrast, source_basis: 'ICH E9(R1) A.3', exact_anchors: [compact:rct.01, rerun:RCT-01, rerun:RCT-02], guards: {temporal: freeze_before_assignment_and_outcome_access, access: no_outcome_data, run_version: estimand_version_is_immutable_for_confirmatory_run}}
      - {<<: *move, record_id: rct.move.prespecify, parent_phase: rct.phase.design, label: prespecify design and analysis, operation_kind: methodological_support, inputs: [frozen_estimand], output: frozen_protocol_and_sap, method_owned_rule: confirmatory_choices_predate_outcomes, permitted_conclusion: analysis_was_prespecified, source_basis: 'ICH E9 §§5.1-5.8; CONSORT 2025 items 2-4,24', exact_anchors: [compact:rct.02, compact:rct.04, rerun:RCT-03], guards: {temporal: freeze_before_assignment_and_outcome_access, access: no_unblinded_outcomes, run_version: amendments_create_dated_successor_and_deviation_record}}
      - {<<: *move, record_id: rct.move.allocate, parent_phase: rct.phase.conduct, label: construct concealed allocation and assign, inputs: [eligible_enrolled_units, frozen_protocol_and_sap], output: randomized_cohort, information_origin: [derived, observed], method_owned_rule: unpredictable_concealed_assignment, permitted_conclusion: assignment_has_known_random_probability, source_basis: 'ICH E9 §2.3; CONSORT 2025 items 12-13', exact_anchors: [compact:rct.03, compact:rct.05, rerun:RCT-04, rerun:RCT-05], guards: {temporal: eligibility_precedes_assignment, access: recruiter_cannot_access_future_allocation, run_version: allocation_receipt_binds_protocol_and_cohort}}
      - {<<: *move, record_id: rct.move.conduct, parent_phase: rct.phase.conduct, label: deliver conditions and track departures, operation_kind: methodological_support, inputs: [randomized_cohort], output: conduct_ledger, information_origin: [observed, reported], method_owned_rule: adherence_does_not_redefine_assignment, permitted_conclusion: conduct_and_intercurrent_events_are_accounted_for, source_basis: 'ICH E9 §§5.2,5.3; CONSORT 2025 items 14-17', exact_anchors: [compact:rct.06, rerun:RCT-06]}
      - {<<: *move, record_id: rct.move.ascertain, parent_phase: rct.phase.conduct, label: ascertain primary outcome, inputs: [randomized_cohort, frozen_protocol_and_sap], output: governed_outcome_dataset, information_origin: [observed], method_owned_rule: same_prespecified_definition_and_clock_across_arms, permitted_conclusion: primary_outcomes_are_available_under_declared_measurement, source_basis: 'ICH E9 §2.2; CONSORT 2025 items 11,19', exact_anchors: [capability:ascertain-the-primary-outcome-as-a-distinct-governed-operation, rerun:RCT-07]}
      - {<<: *move, record_id: rct.move.lock_audit, parent_phase: rct.phase.conduct, label: lock data and audit conduct, operation_kind: methodological_support, inputs: [governed_outcome_dataset, conduct_ledger], output: locked_analysis_dataset_and_audit, method_owned_rule: no_undocumented_reassignment_deletion_or_outcome_redesign, permitted_conclusion: prespecified_analysis_may_run_or_warrant_is_downgraded, source_basis: 'ICH E9 §§5.7,7; CONSORT 2025 flow', exact_anchors: [compact:rct.07, rerun:RCT-08, rerun:RCT-09], guards: {temporal: lock_precedes_unblinded_confirmatory_analysis, access: blind_review_cannot_access_arm_outcomes, run_version: lock_digest_binds_all_analysis_inputs}}
      - {<<: *move, record_id: rct.move.estimate, parent_phase: rct.phase.infer, label: estimate primary ITT effect, inputs: [locked_analysis_dataset_and_audit, frozen_estimand], output: primary_effect_estimate, information_origin: [derived], performer: deterministic_engine, method_owned_rule: estimator_targets_frozen_estimand_and_assignment, permitted_conclusion: trial_population_assignment_effect_with_uncertainty, source_basis: 'ICH E9/E9(R1); CONSORT 2025 item 23', exact_anchors: [compact:rct.08, rerun:RCT-10]}
      - {<<: *move, record_id: rct.move.sensitivity, parent_phase: rct.phase.infer, label: evaluate prespecified sensitivity, inputs: [primary_effect_estimate, locked_analysis_dataset_and_audit], output: sensitivity_results, information_origin: [derived], method_owned_rule: stress_assumptions_without_replacing_primary, permitted_conclusion: robustness_or_fragility_is_bounded, source_basis: 'ICH E9(R1) A.5', exact_anchors: [compact:rct.09, rerun:RCT-11]}
      - {<<: *move, record_id: rct.move.auxiliary, parent_phase: rct.phase.infer, label: control auxiliary inference and deviations, inputs: [conduct_ledger, sensitivity_results], output: qualification_record, method_owned_rule: exploratory_analyses_cannot_replace_primary, permitted_conclusion: deviations_and_auxiliary_claims_are_labeled, source_basis: 'ICH E9 §5.7; CONSORT 2025 item 25', exact_anchors: [compact:rct.10, compact:rct.12, rerun:RCT-12]}
      - {<<: *move, record_id: rct.move.conclude, parent_phase: rct.phase.infer, label: judge superiority within scope, inputs: [primary_effect_estimate, sensitivity_results, qualification_record], output: bounded_trial_conclusion, method_owned_rule: no_superiority_is_not_equivalence_or_transport, permitted_conclusion: supports_or_does_not_support_or_indeterminate, source_basis: 'ICH E9 §8; E9(R1)', exact_anchors: [compact:rct.11, rerun:RCT-13]}
      - {<<: *move, record_id: rct.move.report, parent_phase: rct.phase.infer, label: report trial transparently, operation_kind: methodological_support, inputs: [bounded_trial_conclusion, conduct_ledger], output: auditable_trial_report, method_owned_rule: reporting_does_not_repair_invalid_design, permitted_conclusion: conduct_flow_results_and_limits_are_visible, source_basis: 'CONSORT 2025', exact_anchors: [capability:report-the-trial-transparently-as-a-distinct-operation, rerun:RCT-14]}
    actions:
      - {<<: *action, record_id: rct.action.compute_itt, parent_move: rct.move.estimate, label: execute frozen estimator, operation_kind: analytic, inputs: [locked_analysis_dataset_and_audit, frozen_estimand], output: estimate_receipt, method_owned_rule: estimator_defined_by_sap, permitted_conclusion: numerical_estimate_only, source_basis: 'ICH E9 §5.2', exact_anchors: [compact:rct.08]}
      - {<<: *action, record_id: rct.action.persist_lock, parent_move: rct.move.lock_audit, label: persist lock digest and access log, operation_kind: runtime_delivery, inputs: [governed_outcome_dataset], output: immutable_lock_receipt, method_owned_rule: none, permitted_conclusion: no_analytic_conclusion, source_basis: no_methodology_counterpart, exact_anchors: [rerun:RCT-08]}

  - method_id: policy_option_appraisal
    variant: Green Book 2026 option appraisal with bounded MCDA support
    phases:
      - {phase_id: pa.phase.frame, level: method_phase, label: diagnose bound and direct, operation_kinds: [analytic], collision_participation: none}
      - {phase_id: pa.phase.options, level: method_phase, label: generate screen and characterize, operation_kinds: [analytic, runtime_delivery], collision_participation: none}
      - {phase_id: pa.phase.appraise, level: method_phase, label: appraise compare advise and learn, operation_kinds: [analytic, methodological_support], collision_participation: none}
    moves:
      - {<<: *move, record_id: pa.move.rationale, parent_phase: pa.phase.frame, label: establish intervention rationale, inputs: [policy_problem_evidence], output: problem_and_action_case, information_origin: [observed, reported, interpreted], method_owned_rule: sponsored_solution_is_not_problem_evidence, permitted_conclusion: intervention_case_is_bounded, source_basis: 'Green Book 2026 ch.2', exact_anchors: [compact:pa.01, rerun:PA01]}
      - {<<: *move, record_id: pa.move.scope, parent_phase: pa.phase.frame, label: define counterfactual and scope, inputs: [problem_and_action_case], output: scoped_counterfactual, method_owned_rule: social_value_is_incremental_to_explicit_baseline, permitted_conclusion: option_impacts_have_declared_comparator_and_scope, source_basis: 'Green Book 2026 chs.2-3', exact_anchors: [capability:preserve-the-counterfactual-separately-from-intervention-rationale, rerun:PA02]}
      - {<<: *move, record_id: pa.move.objectives, parent_phase: pa.phase.frame, label: set objectives constraints and success, inputs: [scoped_counterfactual, stakeholder_goals], output: objective_authority_record, information_origin: [elicited, interpreted], method_owned_rule: objectives_do_not_encode_favored_option, permitted_conclusion: criteria_and_authority_are_declared, source_basis: 'Green Book 2026 ch.3', exact_anchors: [compact:pa.02, rerun:PA03], value_goal_authority: policy_sponsor_and_affected_stakeholders}
      - {<<: *move, record_id: pa.move.longlist, parent_phase: pa.phase.options, label: construct materially distinct longlist, inputs: [objective_authority_record, scoped_counterfactual], output: option_longlist, method_owned_rule: include_bau_and_do_minimum_and_avoid_sponsor_lock_in, permitted_conclusion: material_option_space_was_considered, source_basis: 'Green Book 2026 ch.4', exact_anchors: [compact:pa.04, rerun:PA04]}
      - {<<: *move, record_id: pa.move.shortlist, parent_phase: pa.phase.options, label: shortlist transparently, inputs: [option_longlist, objective_authority_record], output: shortlist_and_rejection_log, method_owned_rule: explicit_consistent_criteria_with_redesign_path, permitted_conclusion: shortlisted_options_merit_detailed_appraisal, source_basis: 'Green Book 2026 ch.4', exact_anchors: [compact:pa.05, rerun:PA05]}
      - {<<: *move, record_id: pa.move.characterize, parent_phase: pa.phase.options, label: characterize options and impacts, inputs: [shortlist_and_rejection_log], output: comparable_option_impact_models, information_origin: [observed, reported, derived], method_owned_rule: comparable_maturity_dependencies_and_affected_parties, permitted_conclusion: option_consequences_can_be_appraised, source_basis: 'Green Book 2026 chs.5-6', exact_anchors: [compact:pa.03, compact:pa.06, rerun:PA06, rerun:PA07]}
      - {<<: *move, record_id: pa.move.social_value, parent_phase: pa.phase.appraise, label: quantify value and aggregate defensible impacts, inputs: [comparable_option_impact_models], output: social_value_results, information_origin: [derived], method_owned_rule: consistent_basis_no_double_counting_or_false_precision, permitted_conclusion: monetizable_incremental_social_value_is_estimated, source_basis: 'Green Book 2026 chs.5-6', exact_anchors: [compact:pa.07, capability:aggregate-social-value-separately-from-impact-measurement, rerun:PA08, rerun:PA09]}
      - {<<: *move, record_id: pa.move.nonmonetized, parent_phase: pa.phase.appraise, label: structure non-monetized effects, inputs: [comparable_option_impact_models, objective_authority_record], output: criteria_scores_weights_and_rationale, information_origin: [elicited, interpreted, derived], method_owned_rule: weights_are_visible_value_judgments_not_facts, permitted_conclusion: nonmonetized_tradeoffs_are_explicit, source_basis: 'MCDA Manual 2009 chs.4-6', exact_anchors: [compact:pa.10, rerun:PA10], value_goal_authority: authorized_stakeholders}
      - {<<: *move, record_id: pa.move.distribution, parent_phase: pa.phase.appraise, label: analyze distributional effects, inputs: [comparable_option_impact_models], output: distributional_results, information_origin: [derived], method_owned_rule: aggregate_benefit_cannot_erase_material_group_harm, permitted_conclusion: gains_losses_and_access_differences_are_visible, source_basis: 'Green Book 2026 ch.7', exact_anchors: [compact:pa.08, rerun:PA11]}
      - {<<: *move, record_id: pa.move.uncertainty, parent_phase: pa.phase.appraise, label: analyze risk and uncertainty, inputs: [comparable_option_impact_models], output: scenarios_sensitivities_and_switching_values, information_origin: [derived, simulated], method_owned_rule: single_forecast_is_not_certainty, permitted_conclusion: ranking_robustness_and_fragility_are_visible, source_basis: 'Green Book 2026 ch.8', exact_anchors: [compact:pa.09, rerun:PA12]}
      - {<<: *move, record_id: pa.move.compare, parent_phase: pa.phase.appraise, label: form comparative appraisal judgment, inputs: [social_value_results, criteria_scores_weights_and_rationale, distributional_results, scenarios_sensitivities_and_switching_values], output: comparative_appraisal, method_owned_rule: conflicts_not_collapsed_into_opaque_score, permitted_conclusion: tradeoffs_and_robustness_are_explicit, source_basis: 'Green Book 2026 ch.9; MCDA Manual 2009', exact_anchors: [compact:pa.10, rerun:PA13]}
      - {<<: *move, record_id: pa.move.advise, parent_phase: pa.phase.appraise, label: recommend conditionally or withhold preference, inputs: [comparative_appraisal], output: bounded_analyst_advice, method_owned_rule: fragile_ranking_permits_no_preference, permitted_conclusion: advice_under_declared_values_and_assumptions, source_basis: 'Green Book 2026 ch.9', exact_anchors: [compact:pa.11, rerun:PA14], recommender: appraisal_senior_responsible_owner, acceptance_authority: appraisal_assurance_reviewer}
      - {<<: *move, record_id: pa.move.decide_learn, parent_phase: pa.phase.appraise, label: record decision and future feedback, operation_kind: methodological_support, inputs: [bounded_analyst_advice], output: decision_record_and_future_evaluation_plan, information_origin: [elicited], method_owned_rule: advice_is_not_decision_and_feedback_creates_new_version, permitted_conclusion: accountable_choice_and_learning_trigger_are_recorded, source_basis: 'Green Book 2026 ch.10 and ROAMEF', exact_anchors: [compact:pa.12, capability:preserve-the-analyst-advice-accountable-decision-and-feedback-boundaries, rerun:PA15], performer: decision_secretariat, judgment_owner: appraisal_senior_responsible_owner, acceptance_authority: appraisal_assurance_reviewer, recommender: appraisal_senior_responsible_owner, value_goal_authority: policy_sponsor_and_affected_stakeholders, decision_authority: accountable_decision_maker, guards: {temporal: decision_follows_advice_and_monitoring_follows_decision, access: decision_maker_receives_evidence_limits_and_dissent, run_version: evaluation_opens_successor_appraisal_not_history_rewrite}}
    actions:
      - {<<: *action, record_id: pa.action.render_option_table, parent_move: pa.move.compare, label: render comparable option table, operation_kind: runtime_delivery, inputs: [comparative_appraisal], output: review_projection, method_owned_rule: none, permitted_conclusion: no_analytic_conclusion, source_basis: no_methodology_counterpart, exact_anchors: [compact:pa.10]}
