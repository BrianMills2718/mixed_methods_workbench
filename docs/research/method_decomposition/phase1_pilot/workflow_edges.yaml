  - {method_id: agent_based_policy_simulation, shape: cyclic, required_cycles: [implementation verification and repair], optional_cycles: [structural revision after sensitivity], prohibited_cycles: [using calibration targets as independent validation without disclosure], prohibited_edges: [], entry_points: [sim.01], terminal_points: [sim.10]}
