- group_id: verb:screen
  members:
  - p01:p01.move.screen_initial
  - p01:p01.move.screen_full
  - p11:p11.move.shortlist
  verdict: shared_shell
  justification: 'All three apply declared criteria to a set of candidates and keep a visible record of each decision with
    its reason: ''screen titles and abstracts'' and ''decide full-text eligibility'' against the prespecified review protocol,
    and ''form viable shortlist and rejection log'' against Green Book viability. The licensed conclusions are of one kind,
    ''advance to the next stage'' (''candidate_studies_require_full_text_review'', ''included_studies_meet_prespecified_criteria'',
    ''shortlisted_options_merit_detailed_appraisal''). Two things stop a full merge. First, the method-owned rules are asymmetric
    in different ways: in p01 ''uncertainty advances to full text'', while in p11 ''bau always continues''. Second, the topological
    roles differ: p11.move.shortlist is in a required cycle with rework, while p01''s screens are single passes. Only two
    methods appear, so this is below the three-method promotion threshold and should be recorded as a shell candidate, not
    promoted.'
  shell_does: For each candidate item, record an include, exclude or uncertain decision with a reason code and the criteria
    version applied. Keep a durable rejection or exclusion log, never delete excluded items, and emit counts per stage for
    a flow diagram (PRISMA-style for p01, a long-list to shortlist trail for p11). Support re-entry on a later pass by keeping
    prior decisions versioned.
  delegated: Each method keeps its criteria and their source (the frozen PICO review protocol vs the Options Framework and
    viability appraisals). It also keeps its asymmetry rules (uncertain studies advance; business-as-usual is always retained),
    any dual-reviewer or conflict-resolution procedure (p01), and the cycle-return trigger and rework semantics ('return_for_rework_or_no_robust_preference',
    p11).
  hostile_method: p05 constructivist grounded theory
  hostile_argument: Theoretical sampling in grounded theory selects material by emerging category needs, not against prespecified
    criteria. It has no fixed include/exclude rule, and decisions change as the theory develops. It could use the logging
