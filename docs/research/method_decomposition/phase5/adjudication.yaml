- group_id: sig:9f10f6d0dc
  members:
  - p07:p07.move.refuse
  - p09:p09.move.refuse
  verdict: shared_shell
  justification: 'Both are refusal terminals (''this_record_is_the_refusal_terminal'') with the same signature appraisal +
    uncertainty_note + claim -> finding and the same conclusion form (''the named claim is not licensed for this measurement
    version / by this model version, for the named reasons''), so control flow and output shape match. The licensing conditions
    are method-owned and substantive, not parameters: p07 refuses when the construct cannot be reliably coded, the holdout
    is contaminated or prevalence error cannot be bounded, and bars causal or out-of-domain claims; p09 refuses when verification,
    empirical fitness, experiment provenance, replication precision or decisive sensitivity evidence is absent, and bars policy-world
    effects or predictions.'
  shell_does: Accept a requested claim with the governing appraisal and uncertainty notes, record a terminal refusal finding
    naming the claim, the artifact version (measurement or model) and the reasons, and prevent the claim from being emitted
    downstream.
  delegated: The set of conditions that make a claim unlicensed and the evaluation of those conditions against the method's
    appraisals (p07 coding reliability, holdout contamination, prevalence-error bounds, causal/out-of-domain scope; p09 verification,
    empirical fitness, provenance, replication precision, sensitivity).
  hostile_method: p02 RCT
  hostile_argument: p02 blocks estimand claims on estimator mismatch and qualifies on sensitivity instability; it could emit
    a refusal through this shell with the same signature, but only by supplying its own estimand-specific licensing conditions,
    which confirms the conditions are a method-owned interior.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: sig:a8c2d06be0
  members:
  - p03:p03.move.pretrend
  - p04:p04.move.necessity
  verdict: different_capability
  justification: 'The canonical signatures match exactly (test: dataset -> finding), but the operations and licensed conclusions
    do not. ''diagnose pre-intervention trends'' estimates event-time leads and placebos as diagnostics that are ''not identification
    proofs'', with the conclusion ''observed_preperiod_incompatibilities_or_precision_limits_are_visible''. ''analyze necessary
    conditions'' computes asymmetric subset consistency, coverage and relevance of necessity, with the conclusion ''named_condition_is_or_is_not_consistent_with_necessity_in_population''.
    Under §10, a large divergence in what conclusions are licensed rules out a merge even when the signature matches. These
    rest on incompatible logics: correlational symmetric contrasts versus set-theoretic asymmetry.'
  what_breaks_if_merged: 'A shared ''test dataset -> finding'' would have no common statistic to compute: a regression lead
    coefficient with a confidence interval in p03, and a fuzzy-set inclusion score with relevance-of-necessity in p04. Each
    method''s refusal guard would be lost: ''low_power_nonrejection_is_not_evidence_of_parallelism'' and ''high_consistency_low_relevance_is_not_substantive_necessity''
    have no counterpart in each other''s frame.'
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: sig:b12726ae63
  members:
  - p02:p02.move.sensitivity
  - p03:p03.move.sensitivity
  verdict: shared_shell
  justification: 'The two steps share an exact signature (estimate + dataset -> finding), the same single-pass topological
    role (neither is in a required cycle), and closely matching conclusions: p02 ''test estimand sensitivity'' licenses ''robustness_to_key_assumptions_is_characterized''
    and p03 ''challenge result with sensitivity'' licenses ''result_fragility_is_characterized'', each with a qualification
    that instability downgrades the primary conclusion. Both hold the target fixed while perturbing assumptions (p02: ''probe
    assumptions under same estimand not switch target''; p03: ''without data mining''). However the perturbation families
    are method-owned and not parameters of one routine: p02 varies missing-data and intercurrent-event assumptions under an
    estimand framework, p03 varies trend specifications, windows, covariates, placebos and inference choices. Hostile test
    with p04 fsQCA: its robustness checks vary calibration anchors and consistency thresholds and yield alternative solution
    sets, not estimates, so it cannot use this signature without changing the input type, which confirms the shell must stay
    estimate-specific and not be promoted to same_capability.'
  shell_does: Takes a primary estimate, its frozen estimand and a prespecified list of alternative specifications; reruns
    the method's estimator for each specification on the same dataset; refuses any specification that changes the estimand
    or was added after seeing results; tabulates alternative estimates and intervals against the primary; and emits a finding
    with an instability flag that forces the qualified-primary-conclusion wording.
  delegated: 'Each method keeps the content of the perturbation set and its validity rules: p02 supplies missing-data mechanisms,
    intercurrent-event strategies and multiplicity choices tied to the ICH E9(R1) estimand; p03 supplies alternative parallel-trends
    forms, event windows, covariate sets, placebo outcomes or groups and inference methods. Each also owns the estimator itself
    and the threshold for what counts as ''materially unstable''.'
  hostile_method: p04
  hostile_argument: fsQCA robustness varies calibration anchors, frequency cutoffs and consistency thresholds and compares
    resulting Boolean solution sets, not numeric estimates; it would need a solution_set input/output instead of estimate/finding
    and a set-theoretic comparison instead of an interval comparison, so it cannot use this signature unchanged.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: sig:cc4bdfb3b0
  members:
  - p02:p02.action.compute_itt
  - p03:p03.action.compute_did
  verdict: shared_shell
  justification: 'Both are execution actions with the identical signature dataset + parameter_set -> model_run/trace and the
    same posture: they run a prespecified estimator and own no inference (''execution_does_not_choose_estimand_or_accept_assumptions'';
    ''execution_does_not_accept_identifying_assumptions''), licensing only ''prespecified_estimator_was_computed'' / ''prespecified_comparative_change_was_computed''.
    They differ in the estimator (STATO mean difference vs difference in differences) and, more than a parameter, in failure
    semantics: p03 blocks on ''failed_inference_or_support_check'', which includes estimator-specific inference checks (assignment-structure-aware
    errors, the two-group clustered-SE refusal owned by p03.move.estimate). That validation is method-owned, so this is a
    shell, not one capability.'
  shell_does: Load the frozen dataset and parameter_set, dispatch to the declared estimator, capture the full model_run trace
    (inputs hash, software version, output), and block the parent estimate on any execution failure.
  delegated: The estimator itself and its estimator-specific inference and support checks (p02 ITT mean difference under the
    frozen estimand; p03 DiD with assignment-structure-respecting inference and support checks), plus any acceptance of assumptions,
    which stays in each method's parent move.
  hostile_method: p06 probability survey
  hostile_argument: p06 action.compute_variance also executes a frozen estimator, but it takes design_parameters (strata,
    clusters, weights) and outputs an estimate rather than a model_run, so it could only use this shell with a changed signature;
    its design-metadata validation is again method-owned, supporting shell rather than same_capability.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: stato:OBI:0200184
  members:
  - p03:p03.action.balance_table
  - p12:p12.move.feedback1
  - p12:p12.action.compute_summary
  verdict: different_capability
  justification: The shared OBI term 'descriptive statistical calculation' is the only link; the verbs (compare, synthesize,
    aggregate) and purposes differ. p03 'tabulate pre-treatment covariate balance' compares treated and comparison groups
    so that 'pre_treatment_differences_between_groups_are_visible' for identification, and refuses post-treatment covariates;
    p12 'create controlled anonymous quantitative and qualitative feedback' is a round-feedback product that must preserve
    opposing arguments and anonymized reasoning 'without persuasion' so panelists can reconsider; p12 'compute prespecified
    distributions stability and attrition' yields 'numeric_panel_summary_only'. Descriptive arithmetic is a library-level
    dependency, not a method capability.
  what_breaks_if_merged: Merging would turn p12's feedback step into a numeric table and drop its qualitative-argument and
    anonymization requirements, or would force p03's balance table to carry Delphi round semantics; p03's guard rejecting
    post-treatment covariate values has no analogue in Delphi summaries and would be either lost or misapplied.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: stato:STATO:0000039
  members:
  - p08:p08.move.score
  - p08:p08.move.monitor
  - p09:p09.move.sensitivity
  verdict: different_capability
  justification: 'The shared STATO term is the top-level ''statistic'', an ancestor-like generic tag that by Plan #6 rule
    2 does not establish a match. The verbs differ (test, monitor, perturb) and so do the operations: ''score point and predictive
    distributions by horizon'' applies proper scoring rules to compare candidates out of sample; ''join realized outcomes
    and monitor performance'' scores issued forecasts against later outcomes under the rule that outcomes ''never rewrite
    historical forecasts''; and ''separate parameter input and structural sensitivity'' perturbs ABM assumptions so that ''structural_uncertainty_cannot_be_collapsed_into_random_seed_or_parameter_noise''.
    The conclusions are of different kinds: candidate comparison, observed drift, and influential assumptions or robust regions.
    p08.move.monitor is also methodological_support while the others are analytic.'
  what_breaks_if_merged: A single 'compute statistic' capability would let a sensitivity analysis report a convenient score
    as robustness. It would let monitoring re-score and overwrite historical forecasts, and it would lose p08's ban on 'selection
    from one convenient metric'. p09's three-way split of sensitivity (parameter, input, structural) has no counterpart in
    forecast scoring and would collapse into a single number.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: stato:STATO:0000218
  members:
  - p07:p07.move.fit
  - p07:p07.action.fit_models
  - p08:p08.move.fit
  - p08:p08.move.issue
  - p08:p08.action.run_backtest
  verdict: different_capability
  justification: The shared STATO term 'model fitting' hides different data-splitting regimes and different claims. p07 'fit
    baselines and candidate supervised models' fits classifiers to human labels inside development data ('candidates_encode_reproducible_label_predictions',
    'no_model_claim_from_training_fit'), whereas p08 'fit candidates on rolling training folds' requires that 'no candidate
    trains on its test origin' and outputs fold forecasts, and p08 'refit selected procedure and issue forecast' licenses
    an actual 'predictive_distribution_for_named_future_target' with mandatory uncertainty. The group also mixes verbs (fit
    vs project), levels (moves vs actions) and conclusion strength (numerical_predictions_only vs an issued forecast). The
    two execution actions (p07.action.fit_models, p08.action.run_backtest) are closer and might form a narrower execution-shell
    candidate, but the group as a whole does not.
  what_breaks_if_merged: 'A single fitting capability would need one split policy: p07''s random or stratified holdout applied
    to p08 would let models train on observations after the forecast origin (temporal leakage), while p08''s rolling-origin
    folds applied to p07 would be meaningless for exchangeable documents. Merging p08.move.issue with fold fitting would also
    erase the distinction between evaluation fits that license nothing and the issued forecast that must carry a predictive
    distribution and refuse unsupported horizons.'
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: stato:STATO:0000412
  members:
  - p06:p06.move.estimate
  - p06:p06.action.compute_variance
  - p07:p07.move.quantify
  verdict: different_capability
  justification: Both methods report 'prevalence' with uncertainty, but the uncertainty comes from different sources and needs
    different estimators. p06 'estimate prevalence and design-based uncertainty' derives variance from the complex sample
    design (strata, clusters, weights) and keeps nonsampling limits separate ('bounded_population_prevalence_with_design_based_uncertainty');
    p07 'estimate construct prevalence with classification uncertainty' corrects for classifier misclassification and labelled-sample-to-corpus
    shift and refuses plain 'classify_and_count'. The conclusions name different populations (survey target population vs
    a document corpus) and the p06 action is a numerical-only support step. The shared shape (estimate plus uncertainty_note)
    is too thin to define a shell with real shared control flow.
  what_breaks_if_merged: A single prevalence estimator would either apply survey design variance to a near-census corpus,
    where sampling variance is close to zero and misclassification dominates, producing falsely tight intervals; or treat
    survey responses as error-free and ignore weights, or treat classifier outputs as error-free measurements, which is exactly
    the classify-and-count shortcut p07 refuses.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: stato:STATO:0000471
  members:
  - p02:p02.move.sensitivity
  - p06:p06.move.adjust
  verdict: different_capability
  justification: The shared STATO term 'estimate' is a generic ancestor-level tag, not a shared operation. p02 sensitivity
    probes assumptions under the same estimand and outputs a finding ('robustness_to_key_assumptions_is_characterized'), while
    p06 adjust assesses nonresponse and derives final survey weights, outputting a dataset ('respondents represent the covered
    population under stated adjustment assumptions'). Inputs, outputs and permitted conclusions differ in kind (robustness
    characterization vs representativeness licence).
  what_breaks_if_merged: 'A merged step would make weight derivation look like a sensitivity analysis (or vice versa): p06''s
    final weights, which every downstream p06 estimate consumes, would be treated as an exploratory side analysis, and p02''s
    rule ''probe_assumptions_under_same_estimand_not_switch_target'' would have no counterpart in weighting, which legitimately
    changes the data the estimate is computed on.'
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: types:3d0005be2f
  members:
  - p03:p03.move.pretrend
  - p04:p04.move.necessity
  - p10:p10.action.cluster_cases
  verdict: different_capability
  justification: 'The three members share only a dataset -> finding type pair. ''diagnose pre-intervention trends'' is an
    event-time and placebo diagnostic (STATO difference in differences, statistical hypothesis test) whose conclusion is limited
    to ''observed_preperiod_incompatibilities_or_precision_limits_are_visible'', and it warns that ''low_power_nonrejection_is_not_evidence_of_parallelism''.
    ''analyze necessary conditions'' is a set-theoretic subset-consistency analysis with coverage and trivialness review;
    it concludes about necessity in a population and is not a hypothesis test. ''derive candidate vulnerability clusters''
    is a classify action (scenario discovery, STATO binary classification) whose output is ''candidate_conditions_only'',
    pending analyst validation. These are three different inferential logics: frequentist diagnostics, Boolean or fuzzy-set
    relations, and supervised or unsupervised partitioning.'
  what_breaks_if_merged: A merged dataset->finding step would apply the asymmetric necessity logic of p04 where p03 needs
    symmetric trend contrasts, or would let a non-rejection of pre-trends read as proof of parallel trends. That is the exact
    error p03 refuses. p10's clusters require analyst validation before they mean anything, and a merged step would publish
    them as findings with the same standing as a test result.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:acquire
  members:
  - p05:p05.move.gather
  - p05:p05.move.theoretical_sample
  - p06:p06.move.collect
  - p12:p12.move.round1
  verdict: different_capability
  justification: 'The sampling logics are opposed: p05 theoretical_sample is directed by category gaps (''emerging_category_need_not_demographic_representativeness_directs_sampling'')
    inside the grounded-theory cycle, p05 gather generates rich open material, p06 collect executes a frozen probability protocol
    and records response dispositions (''protocol departures ... recorded rather than silently imputed''), and p12 round1
    elicits independent anonymous expert ratings on desirability, feasibility, importance and confidence. Outputs differ (source_document
    vs dataset) and conclusions differ (''new_material_targets_named_theoretical_gaps'' vs ''responses ... available for governed
    processing'' vs ''initial_judgment_distribution'').'
  what_breaks_if_merged: A shared acquisition step would either impose p06's frozen-protocol, representativeness-oriented
    controls on p05 (blocking adaptive theoretical sampling, which must change targets each pass) or let p06 collection adapt
    to emerging content, destroying the design-based inference p06 depends on; p12's anonymity and pre-feedback independence
    guarantees would be absent from the shared contract.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:aggregate
  members:
  - p11:p11.action.calculate
  - p12:p12.action.compute_summary
  - p13:p13.move.joint_display
  verdict: different_capability
  justification: p11 calculate computes discounted cost-benefit or cost-effectiveness metrics from frozen economic assumptions
    ('numerical_metrics_only'), p12 compute_summary computes prespecified rating distributions, stability and attrition ('numeric_panel_summary_only'),
    and p13 joint_display is an analytic move that juxtaposes qualitative and quantitative findings without numerical combination
    ('display_places_related_findings_together_and_retains_each_strand_warrant'). The two actions share a 'numeric-only, block
    on failure' posture but compute unrelated quantities over unrelated inputs (option vs panel dataset), and p13 outputs
    a finding, not an estimate.
  what_breaks_if_merged: Merging p13 with the numeric actions would imply joint display is a numerical aggregation, inviting
    averaging of strand results that p13 forbids; merging p11 and p12 into one calculator would mix discounting assumptions
    with panel descriptive statistics, so neither the Green Book discount rules nor the Delphi frozen-protocol analysis rules
    would have a clear owner.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:anchor
  members:
  - p05:p05.action.persist_anchors
  - p07:p07.action.persist_errors
  - p08:p08.action.persist_issue
  - p14:p14.action.persist_anchor
  verdict: shared_shell
  justification: 'All four are no-rule persistence actions (method_owned_rule ''none'') that fail closed (''action_failure_blocks_parent_move'',
    ''missing_anchors_blocks_error_review'', ''persistence_failure_blocks_release'', ''anchor_mismatch_blocks_item'') and
    license no analytic conclusion, so they share control flow: write an immutable, hashed record and block the parent on
    failure. But what is persisted and its output type differ: p05 persists passage anchors to source text (passage_anchor/result),
    p07 renders item-level classification errors against a gold dataset (evidence_item/trace), p08 persists a forecast distribution
    with a cutoff receipt proving issue time (forecast/trace), and p14 persists evidence locations and hashes (review_event/trace).
    The p08 cutoff receipt is a time-of-issue guarantee, not a location anchor, so semantics are not identical.'
  shell_does: Content-addressed, append-only persistence of a record with hash, source reference and timestamp; verification
    that the stored record matches the input; fail-closed signalling that blocks the parent move or release.
  delegated: 'What constitutes the anchored object and its validity check: p05 exact source/incident spans, p07 item-level
    error rendering against labels, p08 forecast distribution plus pre-outcome cutoff receipt, p14 evidence location and hash
    match against a supplied passage_anchor; and each method''s output type.'
  hostile_method: p01 systematic review
  hostile_argument: p01 extraction needs to persist the exact location of each extracted result in a study report; it could
    use the shell's hash-and-block persistence, but its anchor semantics (duplicate extraction, study/result/outcome identity)
    would be a method-owned interior, confirming shell rather than one capability.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:annotate
  members:
  - p05:p05.action.version_memos
  - p07:p07.move.annotate
  verdict: different_capability
  justification: p05 'version memos and comparison lineage' is a methodological-support action that versions a researcher's
    reflexive memos so that 'lineage_is_auditable', with the researcher confirming content; p07 'sample annotate and adjudicate
    target labels' is an analytic move that produces a labelled dataset from coders, retaining disagreement and adjudication,
    so that 'labels_can_train_and_test_protocol_reproduction'. Inputs, outputs (review_event vs dataset+evidence_item), actors
    (one researcher vs independent coders plus adjudicator) and conclusions differ in kind.
  what_breaks_if_merged: Merging would either impose p07's multi-coder agreement and adjudication workflow on p05's single-researcher
    reflexive memos, which constructivist grounded theory does not treat as labels to be agreed, or reduce p07's labelling
    to version control, losing the retained disagreement and the block on model claims when labels are insufficient or unstable.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:calibrate
  members:
  - p04:p04.move.calibrate
  - p06:p06.move.adjust
  - p09:p09.move.ground
  verdict: different_capability
  justification: '''Calibrate'' names three distinct operations in three traditions. p04 ''assign fuzzy-set memberships''
    maps raw evidence to degrees of set membership against substantive anchors with borderline review (''cases_have_auditable_memberships'');
    p06 ''assess nonresponse and derive final weights'' produces survey weights so that ''respondents represent the covered
    population under stated adjustment assumptions''; p09 ''parameterize calibrate and assess empirical fitness'' tunes simulation
    parameters to match target patterns and warns that ''calibration_fit_does_not_validate_every_mechanism''. Outputs differ
    (dataset+memo, dataset+appraisal, parameter_set+appraisal) and the conclusions concern set membership, population representativeness
    and pattern fit respectively.'
  what_breaks_if_merged: 'A merged capability would conflate calibrating measurements (p04), calibrating sample weights to
    population totals (p06) and calibrating model parameters (p09): p04''s refusal to impute unresolved memberships via software
    defaults, p06''s disclosure that weighting cannot prove absent nonresponse bias, and p09''s rule that reused targets are
    not independent validation would have no common representation, and an optimizer built for p09 would happily produce sample-relative
    fuzzy scores that p04 rejects.'
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:code
  members:
  - p05:p05.move.initial_code
  - p06:p06.move.process
  verdict: different_capability
  justification: '''segment and initially code incidents'' is interpretive grounded-theory coding inside a required cycle:
    codes are ''close action oriented'', provisional and anchored, and may be recoded on later passes. The conclusion is ''incidents_have_interpretive_labels_for_comparison''.
    ''edit code and evaluate response quality'' is survey data processing: editing, coding of response categories and missingness
    handling that must ''not invent undocumented respondent information''. Its conclusion is ''response data and material
    quality limitations are explicit''. The inputs (source_document plus passage anchors vs datasets plus design parameters),
    the topology (cyclic vs single pass) and the kind of claim (interpretive label vs data-quality statement) all differ.'
  what_breaks_if_merged: A merged coder would either lock grounded-theory codes into a fixed codebook-style edit, which ends
    recoding and the carry-forward across cycle passes, or let survey processing invent interpretive labels for respondents,
    which breaks p06's no-invention rule and the visibility of missingness.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:compare
  members:
  - p01:p01.move.compatibility
  - p03:p03.action.balance_table
  - p05:p05.move.compare_memo
  - p10:p10.move.compare_robustness
  - p13:p13.move.align
  - p13:p13.move.fit
  - p14:p14.move.update
  verdict: different_capability
  justification: '''compare'' is the known trap: p01 compatibility decides whether results may be pooled (outputs a case_set
    and state marker), p03 balance_table tabulates pre-treatment covariate differences (''pre_treatment_differences_between_groups_are_visible''),
    p05 compare_memo is constant comparison producing memos inside a required cycle, p10 compare_robustness ranks strategies
    under declared metrics inside its RDM cycle, p13 align maps constructs across strands into relations, p13 fit classifies
    confirmation/expansion/discordance, and p14 update performs Bayesian updating of rivals (''relative_support_for_frozen_rivals_is_transparently_updated'').
    Inputs, outputs (case_set, finding, memo, appraisal, relation) and conclusion kinds all differ, and two members (p05,
    p10) are in required cycles while the rest are single passes.'
  what_breaks_if_merged: 'A shared ''compare'' would erase the difference between a pooling-eligibility gate, a descriptive
    table, an interpretive coding operation and a probabilistic update: p13 fit''s rule that discordance is ''never_averaged_away''
    would conflict with p14''s quantitative update, p05''s successor-version carry-forward across cycle passes would have
    no home in single-pass members, and p10''s value-laden satisficing thresholds would be hidden as generic comparison parameters.'
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
- group_id: verb:conceptualize
  members:
  - p05:p05.move.focus_categories
  - p07:p07.move.operationalize
  - p09:p09.move.specify
  verdict: different_capability
  justification: '''select focused codes and construct provisional categories'' is interpretive category building inside a
    required cycle: categories are chosen by ''conceptual_significance and explanatory reach not frequency'', and prior category
    versions are carried forward and challenged on later passes. ''operationalize construct and annotation protocol'' turns
    a concept into observable coding rules, with a reliability threshold declared before pilot coding, and concludes ''humans_can_apply_a_declared_target_to_text''.
    ''specify entities states scales processes schedule ...'' writes an ABM conceptual model (ODD-style) complete enough to
    reimplement. Their outputs (concept, construct_definition plus design_parameters, model), their topology (p05 cyclic,
    the others single-pass) and their conclusions (provisional categories that direct inquiry, an applicable annotation target,
    an inspectable model) all differ.'
  what_breaks_if_merged: Merging would make grounded-theory categories carry a pre-declared reliability threshold, which contradicts
    their provisional, iterative status and the version carry-forward across cycle passes. It would also let a p07 construct
    definition skip its declared observability and reliability gate, and it would give p09's process and schedule specification
    a text-coding interface it cannot use.
  adjudicator: 'claude-code adjudication agent (read-only), 2026-10-08, against rev 5.1 section 10 and Plan #6 rules'
