  - {id: p06.c30, from: p06.move.collect, to: p06.move.process, connection_type: artifact_flow, carries: paradata_and_dispositions, preservation: preserving, from_output: paradata_and_dispositions, to_input: paradata_and_dispositions}
  - {id: p06.c31, from: p06.move.adjust, to: p06.move.report, connection_type: retained_context, carries: nonresponse_bias_assessment, from_output: nonresponse_bias_assessment, to_input: nonresponse_bias_assessment}
  - {id: p06.c32, from: p06.move.frame, to: p06.move.report, connection_type: retained_context, carries: frame_coverage_assessment, from_output: frame_coverage_assessment, to_input: frame_coverage_assessment}
  - {id: p06.c33, from: p06.move.estimate, to: p06.move.report, connection_type: artifact_flow, carries: error_account, preservation: preserving, from_output: error_account, to_input: error_account}
  - {id: p06.c34, from: p06.move.frame, to: p06.move.refuse, connection_type: artifact_flow, carries: frame_coverage_assessment, preservation: preserving, condition: material_undercoverage_cannot_be_bounded, from_output: frame_coverage_assessment, to_input: failed_appraisal}
  - {id: p06.c35, from: p06.move.adjust, to: p06.move.refuse, connection_type: artifact_flow, carries: nonresponse_bias_assessment, preservation: preserving, condition: material_nonresponse_bias_is_unbounded, from_output: nonresponse_bias_assessment, to_input: failed_appraisal}
  - {id: p06.c36, from: p06.move.estimate, to: p06.move.refuse, connection_type: artifact_flow, carries: error_account, preservation: preserving, condition: design_or_variance_cannot_be_reconstructed, from_output: error_account, to_input: error_account}
  - {id: p06.c38, from: p06.move.define, to: p06.move.design, connection_type: retained_context, carries: frozen_survey_estimand, from_output: frozen_survey_estimand, to_input: frozen_survey_estimand}
  - {id: p06.c37, from: p06.move.pretest, to: p06.move.refuse, connection_type: artifact_flow, carries: pretest_appraisal, preservation: preserving, condition: instrument_cannot_be_made_to_function_within_the_design_budget, from_output: pretest_appraisal, to_input: failed_appraisal}
topology:
  shape: cyclic
  entry_points: [p06.move.define]
  terminal_points: [p06.move.report, p06.move.refuse]
  required_cycles:
    - id: p06.cycle.pretest_revision
      edges: [p06.c16, p06.c17]
      description: design is pretested and revised until the instrument and procedures function as intended
      loop_termination: pretest_appraisal accepts the design version (it is then frozen and p06.c03 opens), or the defects cannot be removed and p06.c37 routes to refusal
      termination_authority: human
      source: [OMB:1.4, Groves:8.5]
  optional_cycles:
    - id: p06.cycle.nonresponse_followup
      edges: [p06.c29]
      description: follow-up of nonrespondents within the frozen response protocol
      loop_termination: collection window closes or the frozen follow-up protocol is exhausted
      termination_authority: human
      source: [OMB:1.3, Groves:6.6]
    - id: p06.cycle.successor_wave
      edges: [p06.c13, p06.c16, p06.c17, p06.c03, p06.c04, p06.c06, p06.c07, p06.c09, p06.c11]
      description: a later wave reuses documented error to revise the design; each wave is a dated successor version
      why_optional: the frozen variant is cross-sectional and its frame excludes longitudinal change, so one release completes the method
      loop_termination: the sponsor does not commission a further wave
      termination_authority: human
      source: [OMB:7.3]
  prohibited_cycles:
    - id: p06.cycle.redefine_after_responses
      edges: [p06.c14, p06.c01, p06.c02, p06.c16, p06.c03, p06.c04]
      reason: redefining the construct or population after seeing responses breaks prespecification and the measurement warrant
      if_taken: disclosed_deviation; the release is downgraded to an exploratory measure and loses its population-prevalence claim
  prohibited_edges:
    - connection: p06.c14
      from: p06.move.collect
      to: p06.move.define
      reason: observed responses cannot be used to redefine the construct, population, or reference period of the same survey version
      if_taken: disclosed_deviation; a new survey version with a new estimand is required before any population prevalence is released
  parent_action_delegations:
    note: within-move invocation and receipt return; not method cycles
    edges: [p06.c22, p06.c23, p06.c25, p06.c15]
