method_id: p07
revision_notes:
  - date: 2026-10-08
    review: lane_receipts/reviews/2026-10-08-P3-RESEARCH-B.json
    changes: >-
      Every connection now names from_output and to_input slots (a control gate or invocation uses to_input
      none_gate_only). p07.c07 (validation failure) is an optional cycle. Added the required pilot-coding cycle,
      split->fit and validate->quantify artifact flows beside their gates, bindings for bounded_corpus,
      heldout_human_labels and the selected model, parent-to-action invocations, and refusal branches.
      p07.c12 had the same from/to as the required flow p07.c08; the causal-use prohibition is an exit from
      the method, so it now lives in topology.prohibited_edges as p07.c12 with an explicit out-of-method
      target, and p07.c40 routes any such request to p07.move.refuse.
