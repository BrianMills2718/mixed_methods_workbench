y at all", "kind": "decision", "explain": "whether the durable-documents check can report this repository at all"}, {"id": "Q3", "label": "Q3: Wiki over cap and unreachable", "kind": "question_agent", "explain": "md_file_cap counts 126 Markdown files against a cap of 100, and 112 are not reachable from wiki/index.md, whose generated stub says there is no roadmap: which documents does a reader need linked, and which are history?"}, {"id": "d_Q3", "label": "wiki compliance for this repository", "kind": "decision", "explain": "wiki compliance for this repository"}, {"id": "method_decomposition", "label": "Method decomposition", "kind": "concept", "explain": "One of the 14 frozen Phase 3 records of a method's phases, moves and actions, checked by the validator."}, {"id": "Q4", "label": "Q4: Architecture document is the old scaffold", "kind": "question_agent", "explain": "docs/ARCHITECTURE.md describes the 2026-07 scaffold, not the shipped modules: mark it as design history and link docs/planning/SYSTEM_MODEL.md as the current system model?"}, {"id": "d_Q4", "label": "which document an agent reads as the architecture entry point", "kind": "decision", "explain": "which document an agent reads as the architecture entry point"}, {"id": "producer_export", "label": "Method export", "kind": "concept", "explain": "The synthetic mirror of producer export shapes used by the DEMO-C1 fixtures, not any producer's own schema. The real exports Plan #8 reads are separate concepts: Qualitative Coding's grounded-theory export and Process Tracing's pt_export_v2."}, {"id": "workbench_view", "label": "Workbench consumer view", "kind": "concept", "explain": "The workbench's permissive, compatible reading of a producer export; it fails on an unsupported major version. The cited class reads only the synthetic DEMO-C1 shape; Plan #8 S1 adds the reader for Qualitative Coding's real grounded-theory export."}, {"id": "Q5", "label": "Q5: Deploy the synced review page", "kind": "question_agent_resol er", "kind": "question_agent_resolved", "explain": "How does the committed public page stay in step with the renderer once the test stops writing into deploy/?"}, {"id": "d_Q9", "label": "whether Plan 007 keeps the public page current or only makes it current", "kind": "decision", "explain": "whether Plan 007 keeps the public page current or only makes it current once"}, {"id": "Q10", "label": "Q10: NYC findings labelled human-approved", "kind": "question_agent", "explain": "The renderer labels the NYC qualitative findings 'Human-approved' and 'human approved', but Brian's 2026-10-04 review says to treat that result as unreviewed: relabel them?"}, {"id": "d_Q10", "label": "whether the page source (copied into deploy/ by pull request #57) misstates", "kind": "decision", "explain": "whether the page source (copied into deploy/ by pull request #57) misstates the NYC result's review status"}, {"id": "Q11", "label": "Q11: Where Brian opens the study page", "kind": "question_brian", "explain": "The study page each slice builds is committed in git but served nowhere Brian can open from his phone. Serve it, and this package's review page, from hive.brianmills.dev (add this public repository to personal-vps plan-repos.conf), from the existing PsychosisBank Worker under a new path, or keep both local?"}, {"id": "d_Q11", "label": "whether Brian can open each slice's result himself, or only through", "kind": "decision", "explain": "whether Brian can open each slice's result himself, or only through screenshots in replies"}, {"id": "study_corpus", "label": "Study corpus", "kind": "concept", "explain": "A set of source documents frozen for one study: each file's hash checked against its published source, with its licence, consent and retrieval date."}, {"id": "Q12", "label": "Q12: What 1.0 promises: outside researcher, theory operationalization", "kind": "question_brian", "explain": "Three narrowings of the roadmap's 1.0 that only Brian can accept. (a) Should the 1.0 benchmark include an hour of review by an outside qualitative or mixed-methods researcher, or is agreement with the corpus authors' own published coding enough for the 1.0 claim? (b) The roadmap's 1.0 includes theory operationalization (ROADMAP.md:65); Plan #8 keeps within-case causal reasoning (Process Tracing) and moves theory operationalization (Theory Forge, which has no consumer export) to after 1.0. Is that acceptable? (c) The roadmap's G4 1.0 condition names \"contradiction disposition\" (ROADMAP.md:83). In Plan #8 only one of the author's 39 codes qualifies as a measure of a QC category, and a prevalence cannot confirm or contradict a when-then proposition, so every 1.0 joint-display row says \"complements\" or \"silent: not measured\": 1.0 never shows the two strands agreeing or disagreeing, and contradiction disposition is built and exercised only by planted failures. Is a complements-only 1.0 acceptable, or must one row be able to agree or disagree? A row that agrees or disagrees tests the proposition, so under your decision 0017 and Qualitative Coding's rule it must be measured on interviews the proposition was not built from, not on the interviews that produced it."}, {"id": "d_Q12", "label": "the 1.0 claim's wording, whether S6 waits on a person, and whether S4 must", "kind": "decision", "explain": "the 1.0 claim's wording, whether S6 waits on a person, and whether S4 must also bring in Theory Forge"}, {"id": "measurement_instrument", "label": "Measurement instrument", "kind": "concept", "explain": "One of the corpus author's codes turned into a definition applied to every interviewee turn, with included and excluded examples drafted from her tuning-interview passages, so its prevalence can be counted and checked against her coding of the same code."}, {"id": "Q13", "label": "Q13: Second corpus for the benchmark", "kind": "question_agent", "explain": "Which second rights-clear corpus, with its authors' own coding published, does S6 use?"}, {"id": "d_Q13", "label": "S6 (the benchmark's held-out corpus)", "kind": "decision", "explain": "S6 (the benchmark's held-out corpus)"}, {"id": "Q14", "label": "Q14: QC segment offsets against the Zenodo text", "kind": "question_agent_resolved", "explain": "Do the character offsets of QC's segments (and of the author's coded passages) point at the same text in the files downloaded from Zenodo, or did QC normalise the text on import?"}, {"id": "d_Q14", "label": "whether S1 can anchor every cited passage to the frozen source without a", "kind": "decision", "explain": "whether S1 can anchor every cited passage to the frozen source without a mapping step"}, {"id": "source_segment", "label": "Source segment", "kind": "concept", "explain": "An exact span of a source document that evidence points to."}, {"id": "evidence_anchor", "label": "Evidence anchor", "kind": "concept", "explain": "A pointer from a finding to the evidence and source it rests on, by id (evidence_id, source_id); it stores no text span. Anchoring a passage to an exact span of the frozen text is new work in Plan #8 slice S1."}, {"id": "Q15", "label": "Q15: Which coded theme S2 measures (the construct)", "kind": "question_brian", "explain": "Which theme becomes S2's measurement construct? The quantitative-strand brief leaves the exact construct to Brian (brief :101, ROADMAP.md:349). On the theory S1 pins (run e131eb55, Q26) the written rule picks no code, so the construct is Brian's call: he picks one row of the rule's table, a code for one QC category, and S3 maps the propositions naming that category; if the pin moves, S2's first test recomputes the table first."}, {"id": "d_Q15", "label": "S2's construct (S2 can start on the default)", "kind": "decision", "explain": "S2's construct (S2 can start on the default)"}, {"id": "qualitative_strand", "label": "Qualitative strand", "kind": "concept", "explain": "A producer's qualitative result (QC's grounded-theory categories and propositions) read into the study, every claim tied to i d": "decision", "explain": "S5 and acceptance A7"}, {"id": "review_decision", "label": "Review decision", "kind": "concept", "explain": "A person's accept, reject or annotation of one meta-inference, saved with time and reviewer, appended to the review log. Plan #8 S5."}, {"id": "reflexivity_memo", "label": "Reflexivity memo", "kind": "concept", "explain": "The researcher's positioning memo for one study: who did the analysis, what they brought to it and what that may have shaped, kept with the review log and in the bundle. Plan #8 S5."}, {"id": "Q21", "label": "Q21: Who runs Qualitative Coding on the second corpus", "kind": "question_agent", "explain": "S1 reads Qualitative Coding's existing grounded-theory export, which exists only for Open Science. For S6, does QC run its pipeline on the second corpus in its own repository first, or does S6 pick a corpus QC has already analysed?"}, {"id": "d_Q21", "label": "S6, acceptance A10, and the claim that a study needs only a definition file", "kind": "decision", "explain": "S6, acceptance A10, and the claim that a study needs only a definition file and the producers' exports"}, {"id": "qc_theory_export", "label": "Qualitative Coding theory export", "kind": "concept", "explain": "Qualitative Coding's grounded-theory result (schema major 3: categories, propositions, the segment ids each rests on) with its segment records, pinned by commit and sha256. The export itself already exists in qualitative_coding; only the workbench's reader of it is planned, in Plan #8 S1."}, {"id": "Q22", "label": "Q22: Which propositions the measure speaks to (the S3 join)", "kind": "question_agent_resolved", "explain": "QC's six propositions are conditional statements (\"when X, then Y\") that each name two or three categories, and S2 measures one theme's prevalence. Which proposition does the measured number speak to, and what verdict may such a row carry?"}, {"id": "d_Q22", "label": "S3's joint display and acceptance A5", "kind": "decision", "explain": "S3's joint display and acceptance A5"}, {"id": "joint_display", "label": "Joint display", "kind": "concept", "explain": "One row per proposition placing the qualitative claim beside the measured numbers, with a \"complements\" or \"silent: not measured\" verdict in 1.0 (a prevalence cannot confirm or contradict a when-then claim; open question Q22)."}, {"id": "integration_check", "label": "Number and passage check", "kind": "concept", "explain": "The deterministic check on every S3 draft: each number it cites equals the measured result, each passage id resolves, and a verdict the map refuses (converges or diverges on a prevalence-only row) is refused; a failing draft is shown in orange, never silently corrected. Plan #8 S3."}, {"id": "proposition_measure_map", "label": "Proposition-to-measure map", "kind": "concept", "explain": "For each of QC's propositions, written before any verdict is drafted: mapped to the measure (it names a QC category the measured code qualified for), or \"silent: not measured\" with the reason; a mapped row matched by prevalence alone may only say \"complements\". Plan #8 S3."}, {"id": "Q23", "label": "Q23: Which Process Tracing route S4 reads (the causal export)", "kind": "question_agent_resolved", "explain": "Process Tracing's answer path is now its draft-audit prototype (its ADR 0004, approved by Brian 2026-11-05, confirmed 2026-11-06), which writes no pt_export_v2; its pipeline, which accepts a QC handoff and writes the gated export, is frozen (Brian, 2026-09-30) and stopped without an answer on its last two hard cases. Which route gives S4 its causal result?"}, {"id": "d_Q23", "label": "S4's build and cost, acceptance A6, investigation finding F13", "kind": "decision", "explain": "S4's build and cost, acceptance A6, investigation finding F13"}, {"id": "pt_export", "label": "Process Tracing export (pt_export_v2)", "kind": "concept", "explain": "Process Tracing's versioned export, written by its frozen pipeline and read here b <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('page-data').textContent);
function renderMd(id, item) {
  const host = document.getElementById(id); if (!host || !window.marked) return;
  host.innerHTML = marked.parse(item.text);
  if (item.base) host.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (!/^([a-z]+:|#|\/)/i.test(h)) a.href = new URL(h, item.base).href;
  });
  host.querySelectorAll('code.language-mermaid').forEach(c => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;
    c.parentElement.replaceWith(div);
  });
}
// Size a frame from its drawing so its words read at their real size when the width allows; when even
// that leaves them small, say so under the drawing and point at its full page.
function sized(el) {
  return ({width, height}) => {
    if (!width || !height) return;
    const wz = Math.min(1, (el.clientWidth * 0.84) / width);
    el.style.height = Math.round(Math.max(320, Math.min(window.innerHeight * 0.88, height * wz / 0.84))) + 'px';
    const zoom = Math.min(1, (el.clientWidth * 0.84) / width, (el.clientHeight * 0.84) / height);
    if (zoom < 0.7 && !el.nextElementSibling?.classList.contains('smallnote')) {
      const note = document.createElement('p'); note.className = 'note smallnote';
      const own = el.dataset.page ? ` or <a href="${el.dataset.page}">open it on its own page</a>` : '';
      note.innerHTML = `Shown whole at ${Math.round(zoom * 100)}% of full size, so the words are small here. Press <b>Full page</b> (top-left of the drawing)${own} to read it.`;
      el.after(note);
    }
  };
}
for (const [id, item] of Object.entries(D.md || {})) renderMd(id, item);
for (const [id, g] of Object.entries(D.graphs || {})) {
  const el = document.getElementById(id); if (!el || !window.GraphViewer) continue;
  const v = GraphViewer.mount(el, {graph: g, onLayout: D.full ? undefined : sized(el)});
  if (D.full && v && v.fullPage) setTimeout(() => v.fullPage(true), 300);
}
if (window.mermaid) {
  mermaid.initialize({startOnLoad: false, theme: 'neutral', securityLevel: 'strict'});
  const run = () => mermaid.run({querySelector: '.mermaid:not([data-processed])'});
  document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { if (d.open) run(); }));
  run();
} else {
  document.querySelectorAll('.mermaid').forEach(el => { el.style.whiteSpace = 'pre'; el.style.fontFamily = 'monospace'; });
}
</script></body></html>
