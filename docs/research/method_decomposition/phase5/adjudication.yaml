    p07 coding reliability, holdout contamination and the bar on causal or out-of-domain claims; p08 leakage, horizon, baseline,
    calibration and regime checks; p09 verification, empirical fitness, provenance, replication precision and sensitivity.
    Each also keeps its own wording of what the refused claim was.'
