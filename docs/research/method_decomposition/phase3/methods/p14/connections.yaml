- id: p14.c17
  from: p14.move.conclude
  to: p14.move.mechanisms
  connection_type: feedback
  carries: successor_observable_request
  condition: residual_rivals_or_gaps_are_discriminable_with_more_evidence
  creates_successor_version: true
- id: p14.c18
  from: p14.move.search
  to: p14.move.anchor_evidence
  connection_type: control_gate
  carries: absence_admission_gate
  condition: an_absence_item_is_admitted_only_for_an_opportunity_whose_search_receipt_says_searched; inaccessible_or_not_searched_receipts_admit_only_unknown
- id: p14.c19
  from: p14.move.mechanisms
  to: p14.move.anchor_evidence
  connection_type: prohibited_transition
  carries: expected_absence_recorded_as_observed_absence_without_search_receipt
  reason: an observable implication that predicts no trace may enter the evidence ledger as absence only after p14.move.search records the opportunity as searched and gate p14.c18 admits it; a direct route bypasses the search
  if_taken: absence item invalid; recorded as unknown
  consequence: absence_item_is_invalid
- id: p14.c20
  from: p14.move.anchor_evidence
  to: p14.move.update
  connection_type: prohibited_transition
  carries: evidence_items_combined_without_dependency_appraisal
  reason: updating directly from the evidence ledger bypasses p14.move.dependencies, so dependent items would be multiplied as if independent
  if_taken: diagnostic update overstated; update invalid until dependence is appraised
  consequence: diagnostic_update_is_overstated_and_invalid
- id: p14.c21
  from: p14.move.anchor_evidence
  to: p14.move.rivals
  connection_type: prohibited_transition
  carries: evidence_informed_rival_rewrite_without_successor_version
  consequence: theory_testing_status_is_lost
- id: p14.c16a
  from: p14.move.case_scope
  to: p14.move.conclude
  connection_type: retained_context
  carries: frozen_case_frame
  from_output: frozen_case_frame
  to_input: frozen_case_frame
