    acceptance_authority: strand_reviewers_and_mixed_methods_reviewer
    recommender: evaluation_lead_if_advice_is_in_scope
    value_goal_authority: evaluation_sponsor_and_affected_stakeholder_governance
    decision_authority: accountable_policy_or_program_decision_maker
    implementation_evidence: methodology_reference_only
    collision_participation: level_2_only
    guards: &id001
      temporal: freeze_design_then_independent_strands_then_merge
      access: strand_specific_permissions_and_minimized_linkage
      run_version: immutable_strand_outputs_joint_display_and_successor_integration_versions
  action:
    level: execution_action
    operation_kind: runtime_delivery
    information_origin: &id002
    - derived
    source_authority_or_inferential_role: parent_move_execution_support
    applicability_boundary: parent_move_only
    refusal_or_qualification: execution_failure_blocks_parent_move
    performer: integration_support_system
    judgment_owner: none
    acceptance_authority: mixed_methods_lead
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: design_only
    collision_participation: level_3_only
    guards: &id003
      temporal: no_merge_before_frozen_strand_findings
      access: approved_minimum_linkage_keys_and_outputs
      run_version: receipt_binds_both_strand_and_display_versions
phases:
- record_id: p13.phase.design
  level: method_phase
  label: design convergent evaluation and strand warrants
  operation_kinds:
  - methodological_support
  collision_participation: none
- record_id: p13.phase.strands
  level: method_phase
  label: conduct and warrant independent strands
  operation_kinds:
  - analytic
  collision_participation: none
- record_id: p13.phase.integrate
  level: method_phase
  label: align merge reconcile and infer
  operation_kinds:
