topology:
  shape: cyclic
  entry_points: [p09.move.purpose]
  terminal_points: [p09.move.conclude, p09.move.refuse]
  required_cycles:
    - id: p09.cycle.replication_adequacy
      edges: [p09.c31, p09.c10]
      description: compare returns to execute, adding replications until the Monte Carlo precision frozen in the experiment plan is met for every declared estimand
      loop_termination: the frozen precision target is met, or the declared replication budget is exhausted and p09.c45 routes to refusal
      termination_authority: engine
      termination_rule_owner: the frozen experiment plan (p09.move.design); the engine applies it and may not change it
      source: [Kleijnen2015:ch3, RG2019:8.3]
    - id: p09.cycle.sensitivity_runs
      edges: [p09.c33, p09.c34]
      description: sensitivity requests ensembles for each declared parameter, input and structural variant; execute generates them with full run provenance and returns them
      loop_termination: every variant in declared_uncertainty_space and structural_variants has been run and analysed
      termination_authority: either
      termination_note: the engine judges coverage of the declared space; the simulation method lead judges robustness and whether a decisive assumption is unexplored
      source: [RG2019:23.2, RG2019:23.3, RG2019:23.4, JRC2020:ch3, JRC2020:ch4]
  optional_cycles:
    - id: p09.cycle.implementation_defect
      edges: [p09.c04, p09.c03]
      loop_termination: verification passes, or the defect cannot be removed and p09.c48 routes to refusal
      termination_authority: human
      source: [RG2019:ch6]
    - id: p09.cycle.specification_defect
      edges: [p09.c05, p09.c02, p09.c03]
      loop_termination: a successor specification passes verification, or p09.c48 routes to refusal
      termination_authority: human
      source: [RG2019:ch6, Sargent2013:computerized_model_verification]
    - id: p09.cycle.structural_successor
      edges: [p09.c12, p09.c02, p09.c03, p09.c21, p09.c07, p09.c26, p09.c10, p09.c11]
      loop_termination: a successor model version is verified, grounded and re-run, or the method lead routes to refusal (p09.c46)
      termination_authority: human
      source: [RG2019:23.4, JRC2020:ch4]
  prohibited_cycles:
    - id: p09.cycle.calibration_reused_as_validation
      edges: [p09.c17]
      reason: calibration targets reused as validation targets are not independent corroboration
      if_taken: disclosed_deviation; empirical_fitness_appraisal must say the targets were reused and may not claim independent validation
    - id: p09.cycle.post_result_scenario_selection
      edges: [p09.c49, p09.c26, p09.c10]
      reason: choosing or reshaping scenarios after seeing their contrasts lets results define the experiment
      if_taken: disclosed_deviation; the experiment is downgraded to exploratory and a new frozen plan is required for confirmatory contrasts
  prohibited_edges:
    - connection: p09.c16
      from: p09.move.execute
      to: p09.move.conclude
      reason: simulated trajectories cannot be relabelled as observed policy outcomes
      if_taken: refuse; the finding is withdrawn and restated as model-conditional
    - connection: p09.c17
      from: p09.move.ground
      to: p09.move.ground
      reason: reused calibration targets cannot count as independent validation
      if_taken: disclosed_deviation; validation claim removed from empirical_fitness_appraisal
    - connection: p09.c49
      from: p09.move.compare
      to: p09.move.design
      reason: the experiment plan is frozen before execution
      if_taken: disclosed_deviation; contrasts downgraded to exploratory
  parent_action_delegations:
    note: within-move invocation and receipt return; not method cycles
    edges: [p09.c37, p09.c40, p09.c41, p09.c43]
