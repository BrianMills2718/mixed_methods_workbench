schema_version: phase3-connections-0.1
method_id: p06
revision_notes:
  - date: 2026-10-08
    review: lane_receipts/reviews/2026-10-08-P3-RESEARCH-B.json
    changes: >-
      Every connection now names from_output and to_input slots (a control gate or invocation binds the judgment
      or request it carries and uses to_input none_gate_only). p06.c03 now gates selection on pretest
      acceptance instead of on the design move. p06.c13 (successor wave) is an optional cycle, not a required
      one. Added the required OMB 1.4 pretest cycle, an optional OMB 1.3 nonresponse follow-up cycle, bindings
      for survey_design, frame_snapshot and the child-action receipts, parent-to-action invocations, and refusal
      branches into p06.move.refuse. Topology uses the spec 5.8 fields.
connections:
  - {id: p06.c01, from: p06.move.define, to: p06.move.frame, connection_type: artifact_flow, carries: frozen_survey_estimand, preservation: preserving, from_output: frozen_survey_estimand, to_input: frozen_survey_estimand}
  - {id: p06.c02, from: p06.move.frame, to: p06.move.design, connection_type: artifact_flow, carries: frame_coverage_assessment, preservation: preserving, from_output: frame_coverage_assessment, to_input: frame_coverage_assessment}
  - {id: p06.c03, from: p06.move.pretest, to: p06.move.select, connection_type: control_gate, carries: design_freeze_permission, condition: pretest_accepted_and_design_version_frozen, from_output: pretest_appraisal, to_input: none_gate_only}
  - {id: p06.c04, from: p06.move.select, to: p06.move.collect, connection_type: artifact_flow, carries: selected_sample_with_base_weights, preservation: preserving, from_output: selected_sample_with_base_weights, to_input: selected_sample_with_base_weights}
  - {id: p06.c05, from: p06.move.design, to: p06.move.collect, connection_type: retained_context, carries: survey_design, from_output: survey_design, to_input: survey_design}
  - {id: p06.c06, from: p06.move.collect, to: p06.move.process, connection_type: artifact_flow, carries: raw_response_set, preservation: transforming, transformation_owner: p06, change: standardized_edits_coding_and_dispositions, from_output: raw_response_set, to_input: raw_response_set}
  - {id: p06.c07, from: p06.move.process, to: p06.move.adjust, connection_type: artifact_flow, carries: processed_response_set, preservation: preserving, from_output: processed_response_set, to_input: processed_response_set}
  - {id: p06.c08, from: p06.move.select, to: p06.move.adjust, connection_type: retained_context, carries: selected_sample_with_base_weights, from_output: selected_sample_with_base_weights, to_input: selected_sample_with_base_weights}
  - {id: p06.c09, from: p06.move.adjust, to: p06.move.estimate, connection_type: artifact_flow, carries: weighted_analysis_dataset, preservation: preserving, from_output: weighted_analysis_dataset, to_input: weighted_analysis_dataset}
  - {id: p06.c10, from: p06.move.define, to: p06.move.estimate, connection_type: retained_context, carries: frozen_survey_estimand, from_output: frozen_survey_estimand, to_input: frozen_survey_estimand}
  - {id: p06.c11, from: p06.move.estimate, to: p06.move.report, connection_type: artifact_flow, carries: prevalence_estimate, preservation: preserving, from_output: prevalence_estimate, to_input: prevalence_estimate}
  - {id: p06.c12, from: p06.move.process, to: p06.move.report, connection_type: retained_context, carries: processing_quality_report, from_output: processing_quality_report, to_input: processing_quality_report}
  - {id: p06.c13, from: p06.move.report, to: p06.move.design, connection_type: feedback, carries: documented_revision_need, condition: sponsor_commissions_a_successor_survey_wave, creates_successor_version: true, from_output: documented_revision_need, to_input: prior_wave_revision_need}
  - {id: p06.c14, from: p06.move.collect, to: p06.move.define, connection_type: prohibited_transition, carries: observed_responses, condition: redefine_construct_to_improve_observed_prevalence, invalidates: prespecification_and_measurement_warrant, from_output: raw_response_set, to_input: none_blocked}
