method_id: p08
revision_notes:
  - date: 2026-10-08
    review: lane_receipts/reviews/2026-10-08-P3-RESEARCH-B.json
    changes: >-
      Every connection now names from_output and to_input slots (a control gate or invocation uses to_input
      none_gate_only). The former fit_score target of p08.c04, p08.c05 and p08.c06 is now p08.move.fit or
      p08.move.score after the split. p08.c04 is an artifact flow (fit consumes the baselines directly).
      p08.c05 and p08.c07 stay as gates beside new artifact flows. p08.c10 (drift) is an optional cycle. Added
      the required issue-cadence cycle, an optional respecification loop distinct from the prohibited
      p08.c11, bindings for current_as_of_data, candidate_procedures and fold forecasts, parent-to-action
      invocations, and refusal branches. p08.c13 now binds to an input slot on monitor.
