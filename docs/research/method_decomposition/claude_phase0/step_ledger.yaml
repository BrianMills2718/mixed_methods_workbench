  method_owned_semantics: "coherence and explanatory adequacy of the framework is a GT-analyst judgment"
  evidence_basis: "Corbin & Strauss 2015 ch.11; Charmaz 2014 ch.8"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "qc_clean/core/pipeline/stages/gt_theory_integration.py:27-108 (LLM call producing TheoreticalModel; deterministic adapters wrap it into domain objects)"
  optional: false
  repeatable: false

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.09
