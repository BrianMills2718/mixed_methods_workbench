topology:

- method_id: qc_grounded_theory
  shape: cyclic
  required_cycles:
    - "constant comparison against the evolving codebook (.03 -> .02) — Corbin & Strauss's defining iterative act"
  optional_cycles:
    - "negative-case-driven revision of relations (.09 -> .05)"
    - "theoretical-sampling loop over remaining fixed-corpus documents (.12 -> .02)"
  prohibited_cycles: []
  prohibited_edges: []
  entry_points: [qc_grounded_theory.01]
  terminal_points: [qc_grounded_theory.08, qc_grounded_theory.11]
  note: >-
    .12's loop_back is bounded by the fixed corpus (cannot fetch new data),
    which is itself the central gap this workflow exposes relative to
    classic theoretical sampling.

- method_id: pt_core_rival_explanation
  shape: cyclic
  required_cycles:
    - "partition-gate repair loop (.03 -> .02) when discriminator coverage is inadequate"
  optional_cycles:
    - "critic-triggered re-elicitation (.08 -> .05)"
  prohibited_cycles: []
  prohibited_edges: []
  entry_points: [pt_core_rival_explanation.01]
  terminal_points: [pt_core_rival_explanation.10, pt_core_rival_explanation.11]
  note: >-
    .04's repeatable:true has no dedicated loop_back edge of its own (it
    is a one-pass classification per evidence item within a single Pass 3
    run) — recorded here as an inconsistency per §5.8's own instruction to
    report where repeatable:true lacks a matching loop_back edge.

- method_id: pt_source_acquisition
  shape: cyclic
  required_cycles:
    - "admit -> reassess -> new-gap -> retrieve loop (.05 -> .01), the 'targeted source evaluation' loop described in PT's own methodology docs"
  optional_cycles: []
  prohibited_cycles: []
  prohibited_edges: []
  entry_points: [pt_source_acquisition.01]
  terminal_points: [pt_source_acquisition.05]
  note: >-
    step .06 (reconcile) has no inbound required edge on this path because
    it is not_implemented for the single-case companion; its edge above is
    marked optional_return specifically to record that absence rather than
    inventing a required transition that does not exist in code.

- method_id: theory_forge_compile_apply
  shape: cyclic
  required_cycles: []
  optional_cycles:
    - "compile-failure retry loop (.05 -> .04), bounded by the classifier's retry=False signal"
  prohibited_cycles: []
  prohibited_edges: []
  entry_points: [theory_forge_compile_apply.01]
  terminal_points: [theory_forge_compile_apply.07, theory_forge_compile_apply.08]
  note: >-
    Partial compilation is an explicitly PERMITTED terminal state (Plan #9):
    a module can reach .08 with some stages verified and others not, and
    .07 (run) will skip unverified stages rather than blocking. This is
    not a prohibited_edge case; it is a designed, valid terminal shape.

- method_id: theory_forge_cpt_choices13k
  shape: dag
  required_cycles: []
  optional_cycles: []
  prohibited_cycles: []
  prohibited_edges: []
  entry_points: [theory_forge_cpt_choices13k.06]
  terminal_points: [theory_forge_cpt_choices13k.08]
  note: >-
    Purely acyclic — the only workflow in this Phase-0 set with no loop of
    any kind, consistent with its purely deterministic, non-iterative,
    non-fitting design (Plan #109's own acceptance criteria).

- method_id: mist_trail_policy_appraisal
  shape: cyclic
  required_cycles:
    - "referential-integrity repair loop (.07 -> .03) when the packet fails structural validation"
  optional_cycles: []
  prohibited_cycles: []
  prohibited_edges: []
  entry_points: [mist_trail_policy_appraisal.01]
  terminal_points: [mist_trail_policy_appraisal.06, mist_trail_policy_appraisal.09]
  note: >-
    The current implementation is a single static fixture, so in practice
    the .07->.03 loop has never actually been exercised (there is only one
    committed, already-valid decision_packet.json) — recorded as a
    theoretically-required cycle per the schema, not an observed one.
