[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-methods-workbench"
version = "0.1.0"
description = "Typed integration contracts for a text-centered mixed-methods workbench."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
mmw-demo = "mixed_methods_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mixed_methods_workbench"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

