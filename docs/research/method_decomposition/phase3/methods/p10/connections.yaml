topology_assertions:
- adaptive_strategy_feedback_to_evaluation_is_required
- every_compared_strategy_uses_the_same_declared_future_ensemble_per_batch
- advice_is_conditional_and_does_not_execute_the_decision
topology:
  shape: adaptive
  required_cycles:
  - cycle: p10.move.evaluate -> p10.move.discover_vulnerability -> p10.move.compare_robustness
      -> p10.move.revise_strategy -> p10.move.evaluate
    termination: no approved successor strategy or analysis budget reached
    termination_authority: human
    edges:
    - p10.c05
    - p10.c08
    - p10.c10
    - p10.c12
  optional_cycles:
  - cycle: p10.move.generate_futures -> p10.move.evaluate -> p10.move.discover_vulnerability
      -> p10.move.compare_robustness -> p10.move.revise_strategy -> p10.move.generate_futures
    edges:
    - p10.c02
    - p10.c05
    - p10.c08
    - p10.c10
    - p10.c17
    condition: approved successor future request
    termination: no approved successor future request or analysis budget reached
    termination_authority: human
  prohibited_cycles:
  - cycle: p10.move.advise -> p10.move.frame
    reason: advice cannot rewrite the frozen frame in place
  prohibited_edges:
  - p10.c15
  - p10.c16
  entry_points:
  - p10.move.frame
  terminal_points:
  - step: p10.move.advise
    state: conditional_advice_with_residual_uncertainty
  - step: p10.move.compare_robustness
    state: honest_stop_no_strategy_is_robust_under_declared_values
