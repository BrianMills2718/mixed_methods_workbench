  - p10:p10.move.generate_futures
  - p10:p10.move.evaluate
  - p10:p10.action.run_ensemble
  verdict: different_capability
  justification: 'p09''s members run a replicated stochastic ABM ensemble (''execute and retain replicated stochastic ensemble'',
    STATO sampling from a probability distribution), and its conclusion is ''model_generated_these_trajectories_under_these_conditions''.
    p10''s ''generate a diverse ensemble of plausible futures'' does not run a model at all: it designs exploratory scenarios
    (configuration -> scenario) under a rule that forbids ''assigning one predictive probability''. p10''s ''evaluate candidate
    strategies across the same futures'' sits in a required cycle and concludes ''conditional_performance_is_available_not_predicted''.
    So the members differ in operation (scenario design vs model execution vs strategy-by-future evaluation), in topology
    (p10.move.evaluate is in a cycle, the rest are single passes), and in uncertainty semantics (p09 samples seeds and replications
    to hit a Monte Carlo precision target, p10 deliberately avoids a probability measure over futures). The two runtime actions,
    p09.action.run_model and p10.action.run_ensemble, are a plausible narrower candidate for a shared execution harness (schedule
    runs, retain seeds, traces and failures, block the parent on an incomplete receipt), but that is a different, smaller
    group.'
  what_breaks_if_merged: A merged 'simulate' would either attach probabilities to RDM futures, which defeats p10's deep-uncertainty
    premise, or drop p09's replication-count and seed discipline, which defeats 'missing_seed_configuration_or_failure_state_blocks_use'.
    Treating generate_futures as model execution would also make scenario design depend on a model it does not have. Folding
    p10.move.evaluate's cycle state (re-evaluation as strategies are revised) into a single-pass executor would lose the iteration
    across passes.
