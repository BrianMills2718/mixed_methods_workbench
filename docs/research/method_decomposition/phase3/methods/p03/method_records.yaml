  - {<<: *move, record_id: p03.move.interpret, parent_phase: p03.phase.interpret, verb: synthesize, label: issue bounded causal conclusion, inputs: [{slot: did_effect_estimate, type: estimate, role: subject, cardinality: one, optional: false}, {slot: identification_appraisal, type: appraisal, role: context, cardinality: one, optional: false}, {slot: pretrend_diagnostics, type: finding, role: context, cardinality: many, optional: false}, {slot: sensitivity_findings, type: finding, role: context, cardinality: many, optional: false}], outputs: [{slot: bounded_did_conclusion, type: claim, role: result, cardinality: one, optional: false}], method_owned_rule: effect_claim_is_conditional_on_untestable_parallel_trends_and_declared_scope, permitted_conclusion: bounded_policy_effect_for_treated_group_and_period, refusal_or_qualification: descriptive_comparative_change_when_identification_is_not_defensible, source_basis: Baker_2026_and_Magenta_A2_7, exact_anchors: [source:p03.baker.conclusions, source:p03.magenta.A2.7]}

