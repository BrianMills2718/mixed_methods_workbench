  outputs:
    - {slot: memos, type: memo, role: byproduct, cardinality: many, optional: false}
  parameters: [none material]
  preconditions: [coding or categorization has occurred]
  conclusion_supported: "none — enabling step only; records an emerging interpretive idea, not itself a licensed claim"
  failure_output: "none — memo-writing has no defined failure mode beyond non-production"
  method_owned_semantics: "what is worth memoing is a GT-analyst judgment"
  evidence_basis: "Corbin & Strauss 2015 ch.8 (memos as a required analytic technique); Charmaz 2014 ch.7"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "memos appended verbatim from LLM output at gt_constant_comparison.py:313-322, gt_axial_coding.py:113-119, gt_selective_coding.py:102-108, gt_theory_integration.py:90-95; concatenation is deterministic string-join, not synthesis"
  optional: false
  repeatable: true

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.07
  verb: synthesize
  label: "selective coding: identify the integrating core category"
  workflow_role: integrate
  operation_kind: analytic
  actor_chain: [llm_engine]
  inputs:
    - {slot: categories, type: concept, role: subject, cardinality: many, optional: false}
