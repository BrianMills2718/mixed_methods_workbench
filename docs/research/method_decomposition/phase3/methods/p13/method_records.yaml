    type: finding
    role: result
    cardinality: many
    optional: false
  record_role: cross_method_subprofile_handoff
  handoff:
    to: declared_qualitative_strand_method_profile
    design_parameter: qualitative_strand_method_id
    parameter_source: frozen_convergent_design
