  action: &a {level: execution_action, operation_kind: runtime_delivery, information_origin: [derived], source_authority_or_inferential_role: parent_move_execution_support, applicability_boundary: parent_move_only, refusal_or_qualification: action_failure_blocks_parent_move, performer: appraisal_analysis_system, judgment_owner: none, acceptance_authority: senior_responsible_owner_for_appraisal, recommender: none, value_goal_authority: none, decision_authority: none, implementation_evidence: design_only, collision_participation: level_3_only, guards: {temporal: parent_move_order, access: approved_inputs_only, run_version: receipt_binds_input_and_output_versions}}
phases:
