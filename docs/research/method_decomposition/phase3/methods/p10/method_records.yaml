  - {<<: *m, record_id: p10.move.discover_vulnerability, parent_phase: p10.phase.explore, label: discover conditions associated with unacceptable outcomes, inputs: [strategy_future_performance_database, frozen_xlrpm_frame], output: vulnerability_scenarios_with_interpretable_conditions, information_origin: [derived, simulated, interpreted], method_owned_rule: vulnerabilities_are_decision_relevant_compact_conditions_validated_against_runs, permitted_conclusion: strategies_have_named_failure_regions_in_the_explored_ensemble, source_basis: groves_2019_step3, exact_anchors: [groves_2019_step3]}
  - {<<: *m, record_id: p10.move.compare_robustness, parent_phase: p10.phase.adapt, label: compare robustness and trade-offs under stated values, inputs: [strategy_future_performance_database, vulnerability_scenarios_with_interpretable_conditions, frozen_xlrpm_frame], output: robustness_and_tradeoff_readout, information_origin: [derived, simulated, elicited, interpreted], method_owned_rule: robustness_measures_and_satisficing_thresholds_remain_visible_value_choices, permitted_conclusion: strategies_are_comparatively_robust_or_fragile_under_declared_metrics_and_ensemble, source_basis: lempert_2003_chs_3_6_and_groves_2019_step5, exact_anchors: [lempert_2003_ch3, groves_2019_step5]}
  - {<<: *m, record_id: p10.move.revise_strategy, parent_phase: p10.phase.adapt, label: design hedges adaptations and new tests from vulnerabilities, inputs: [robustness_and_tradeoff_readout, vulnerability_scenarios_with_interpretable_conditions], output: successor_strategies_signposts_and_future_requests, information_origin: [elicited, interpreted, derived], method_owned_rule: revisions_target_named_vulnerabilities_and_preserve_trigger_logic, permitted_conclusion: successor_designs_merit_retest_not_adoption, source_basis: groves_2019_step4, exact_anchors: [groves_2019_step4]}
  - {<<: *m, record_id: p10.move.advise, parent_phase: p10.phase.adapt, label: present conditional robust strategy advice and residual uncertainty, inputs: [robustness_and_tradeoff_readout, successor_strategies_signposts_and_future_requests], output: bounded_rdm_advice, information_origin: [interpreted, derived], method_owned_rule: advice_exposes_tradeoffs_blind_spots_signposts_and_conditions_and_does_not_choose_policy, permitted_conclusion: decision_maker_can_consider_conditional_strategy_advice, source_basis: lempert_2003_ch6, exact_anchors: [lempert_2003_ch6], decision_authority: accountable_decision_maker}
actions:
  - {<<: *a, record_id: p10.action.run_ensemble, parent_move: p10.move.evaluate, label: execute frozen strategy-future model matrix, inputs: [plausible_future_ensemble, candidate_strategies], output: model_run_receipts, method_owned_rule: none, permitted_conclusion: numerical_simulation_outputs_only, source_basis: groves_2019_step2, exact_anchors: [groves_2019_step2]}
  - {<<: *a, record_id: p10.action.cluster_cases, parent_move: p10.move.discover_vulnerability, label: derive candidate vulnerability clusters, operation_kind: analytic, inputs: [strategy_future_performance_database], output: candidate_cluster_statistics, method_owned_rule: analyst_validates_interpretability_and_decision_relevance, permitted_conclusion: candidate_conditions_only, source_basis: groves_2019_step3, exact_anchors: [groves_2019_step3]}
