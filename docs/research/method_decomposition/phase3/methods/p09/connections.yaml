schema_version: phase3-connections-0.1
method_id: p09
revision_notes:
  - date: 2026-10-08
    review: lane_receipts/reviews/2026-10-08-P3-RESEARCH-B.json
    changes: >-
      Every connection now names from_output and to_input slots (a control gate or invocation uses to_input
      none_gate_only). p09.c04, p09.c05 and p09.c12 fire only on defect or structural failure, so they are
      optional cycles. Added the required replication-adequacy cycle (compare -> execute) and the required
      sensitivity-run cycle (sensitivity -> execute -> sensitivity) so variant runs keep provenance. verified_build
      is now a real output of verify and is bound to ground, design, execute and run_model; verify -> conclude
      carries the verification appraisal. declared_uncertainty_space and structural_variants come from design.
      p09.c11 is an artifact flow. p09.c18 binds to an input slot on compare. p09.c17 had the same from/to as
      the required p09.c15; its invalid operation (reusing calibration targets as independent validation)
      happens inside ground, so it is now a prohibited self-loop on ground. Added p09.c49 (post-result scenario
      selection) as a prohibited edge, parent-to-action invocations, and refusal branches.
