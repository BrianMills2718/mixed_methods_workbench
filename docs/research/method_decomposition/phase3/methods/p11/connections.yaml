- off_is_standard_route_and_mcda_is_conditional_longlist_branch
- shortlist_cba_or_cea_is_mandatory_after_either_longlist_route
- monetized_unmonetized_distributional_and_uncertainty_evidence_join_before_advice
- advice_assurance_decision_and_successor_feedback_remain_separate
topology:
  shape: adaptive
  required_cycles: []
  optional_cycles:
  - cycle: p11.move.decide_feedback -> p11.move.rationale
    condition: monitoring evaluation or material change opens successor appraisal
  prohibited_cycles:
  - cycle: p11.move.mcda -> p11.move.compare_advise
    reason: MCDA cannot bypass shortlist CBA or CEA
  prohibited_edges:
  - p11.c18
  - p11.c19
  entry_points:
  - p11.move.rationale
  terminal_points:
  - step: p11.move.decide_feedback
    state: accountable_decision_and_learning_trigger
  - step: p11.move.compare_advise
    state: honest_stop_no_robust_preference
  - step: p11.move.shortlist
    state: honest_stop_no_viable_option_beyond_bau
