topology:
  shape: cyclic
  entry_points: [p07.move.bound]
  terminal_points: [p07.move.interpret, p07.move.refuse]
  required_cycles:
    - id: p07.cycle.codebook_pilot
      edges: [p07.c23, p07.c24, p07.c25]
      description: pilot coding and intercoder disagreement return to operationalize until the codebook is applied without new ambiguities and agreement meets the threshold frozen in the protocol
      loop_termination: pilot_reliability_appraisal meets the frozen threshold on fresh pilot documents (p07.c26 opens), or the declared revision budget is exhausted and p07.c36 routes to refusal
      termination_authority: human
      source: [GS2013:5.2.1, Krippendorff2018:ch12]
  optional_cycles:
    - id: p07.cycle.validation_failure_successor
      edges: [p07.c07, p07.c23, p07.c24, p07.c25, p07.c02, p07.c03, p07.c15, p07.c05]
      description: held-out validation reveals a construct or codebook failure; a successor label version is built and validated on a fresh holdout
      loop_termination: the successor version passes validation, or the construct lead routes to refusal (p07.c37)
      termination_authority: human
      source: [GS2013:5.2.3]
  prohibited_cycles:
    - id: p07.cycle.construct_tuned_to_model
      edges: [p07.c11, p07.c02, p07.c03, p07.c15]
      reason: redefining the construct to match model predictions makes the target depend on the model it is meant to evaluate
      if_taken: disclosed_deviation; validation results lose their construct-independence and the finding is downgraded to exploratory label reproduction
  prohibited_edges:
    - connection: p07.c11
      from: p07.move.fit
      to: p07.move.operationalize
      reason: model output cannot redefine the construct it is trained to reproduce
      if_taken: disclosed_deviation; successor label version required and prior validation discarded
    - connection: p07.c12
      from: p07.move.interpret
      to: out_of_method:causal_effect_estimation
      reason: a measured corpus prevalence is not a treatment effect or mechanism; passing it to a causal claim crosses the method boundary without an identification design
      if_taken: refuse; p07.c40 routes the request to p07.move.refuse, and any downstream causal use must come from a separate causal method that treats the prevalence only as a measured variable
  out_of_method_nodes:
    - {id: out_of_method:causal_effect_estimation, note: not a p07 record; named only so the prohibited exit has an explicit target}
  parent_action_delegations:
    note: within-move invocation and receipt return; not method cycles
    edges: [p07.c29, p07.c32, p07.c33, p07.c34, p07.c13]
