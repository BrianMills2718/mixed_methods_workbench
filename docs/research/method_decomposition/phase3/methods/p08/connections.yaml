topology:
  shape: cyclic
  entry_points: [p08.move.target]
  terminal_points: [p08.move.issue, p08.move.monitor, p08.move.refuse]
  required_cycles:
    - id: p08.cycle.issue_cadence
      edges: [p08.c27, p08.c26]
      description: each new forecast origin in the declared cadence returns to the information move for a fresh as-of snapshot and issues a new immutable forecast with the selected procedure
      loop_termination: the declared operational period ends, or monitoring retires the procedure (p08.c40 to refusal, or p08.c10 to a successor version)
      termination_authority: human
      source: [FPP3:1.6]
  optional_cycles:
    - id: p08.cycle.drift_successor
      edges: [p08.c10, p08.c14, p08.c16, p08.c06, p08.c21, p08.c24, p08.c09]
      description: material drift triggers a successor model version that is re-evaluated before it issues
      loop_termination: the successor version passes evaluation and replaces the issued procedure, or the task is refused
      termination_authority: human
      source: [FPP3:1.6, FPP3:5.9]
    - id: p08.cycle.respecification
      edges: [p08.c28, p08.c16, p08.c06]
      description: residual or calibration failures in training-fold diagnostics return to fit for a respecified candidate, re-scored on the same frozen folds; every respecification is disclosed in selection_rationale
      distinct_from: p08.c11 (that edge rewrites an issued forecast after its outcome; this loop changes only unissued candidates)
      loop_termination: diagnostics pass for at least one candidate, or the candidate set declared before evaluation is exhausted
      termination_authority: human
      source: [FPP3:1.6, FPP3:5.4]
  prohibited_cycles:
    - id: p08.cycle.loss_redefined_after_results
      edges: [p08.c12, p08.c01, p08.c14, p08.c16, p08.c06, p08.c21, p08.c24]
      reason: redefining target or loss after seeing forecast results lets the evaluation choose its own standard
      if_taken: disclosed_deviation; all scores under the old loss are void and evaluation restarts as a new specification version
    - id: p08.cycle.overwrite_issued_forecast
      edges: [p08.c09, p08.c11]
      reason: an issued forecast rewritten with its realized outcome is no longer a forecast
      if_taken: refuse; the rewritten artifact cannot be scored or released as a forecast
  prohibited_edges:
    - connection: p08.c11
      from: p08.move.monitor
      to: p08.move.issue
      reason: later outcomes score but never rewrite historical forecasts
      if_taken: refuse; restore the immutable artifact and record the attempt
    - connection: p08.c12
      from: p08.move.issue
      to: p08.move.target
      reason: target and loss are frozen before candidate evaluation
      if_taken: disclosed_deviation; new specification version and full re-evaluation required
  parent_action_delegations:
    note: within-move invocation and receipt return; not method cycles
    edges: [p08.c29, p08.c30, p08.c33, p08.c34, p08.c35]
