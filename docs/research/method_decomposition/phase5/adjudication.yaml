  - p13:p13.move.meta_infer
  - p14:p14.move.conclude
  verdict: different_capability
  justification: 'The bucket mixes statistical pooling (''synthesize effects conditionally'', STATO meta analysis, with a
    compatibility gate that refuses a pooled estimate), conclusion writing (''bound and report trial conclusion'', ''issue
    bounded causal conclusion'', ''issue configurational conclusion'', ''issue bounded mechanism conclusion''), case-level
    interpretation (''return solution to cases'' -> memo), Delphi panel feedback (''create controlled anonymous quantitative
    and qualitative feedback''), and mixed-methods integration (''draw bounded meta-inference from integration''), plus a
    handoff to another method (''hand off to declared qualitative strand method''). The permitted conclusions differ in kind,
    not degree: ''randomized_assignment_effect_is_reported_for_trial_population'', ''bounded_necessary_or_sufficient_configurations_are_reported''
    with an explicit ''no_mechanism_or_marginal_effect_claim'', ''one_rival_may_be_better_supported_in_the_bounded_case'',
    and ''panelists_can_reconsider_against_visible_group_response'', which is not a conclusion about the world at all. Under
    §10 this divergence in conclusions rules out a merge. The conclude/interpret steps (p01.report, p02, p03, p04.conclude,
    p14) share a shape of finding -> claim with scope bounds, but each one''s refusal is the opposite of another''s licence
    (p03 licenses an effect, p04 forbids net-effect language, p14 forbids population effects), so even that subset is at most
    a thin claim-record shell that would need its own signature group.'
  what_breaks_if_merged: A single synthesizer would let net-effect language through into fsQCA conclusions, let a process-tracing
    mechanism claim become a population effect, and treat Delphi round feedback (which must not persuade, and is not a claim)
    as an evidential synthesis. It would also merge p01's random-effects or non-pooling decision under a frozen compatibility
    gate with p13's meta-inference, which must not go beyond the quality of each strand. That means the 'no pooled estimate
    when compatibility gate fails' and 'withhold or bound meta-inference' refusals would no longer be enforced by the method
    that owns them.
