topology_assertions:
- qualitative_and_quantitative_strands_are_independently_warranted
- integration_readiness_can_return_only_the_affected_strand
- joint_display_preserves_both_strand_lineages_and_explicit_nonalignment
- divergence_may_return_to_alignment_or_either_strand_and_may_remain_unresolved
- meta_inference_requires_both_strands_joint_display_and_divergence_disposition
topology:
  shape: adaptive
  required_cycles: []
  optional_cycles:
  - cycle: p13.move.fit -> p13.move.align -> p13.move.joint_display -> p13.move.fit
    condition: apparent discordance may be alignment error
  - cycle: p13.move.fit -> p13.move.qual_warrant
    condition: qualitative reanalysis or evidence is justified
  - cycle: p13.move.fit -> p13.move.quant_warrant
    condition: quantitative reanalysis or evidence is justified
  prohibited_cycles:
  - cycle: p13.move.fit -> p13.move.design
    reason: observed fit cannot rewrite frozen convergent design in place
  prohibited_edges:
  - p13.c23
  - p13.c24
  - p13.c25
  entry_points:
  - p13.move.design
  terminal_points:
  - step: p13.move.meta_infer
    state: bounded_meta_inference
  - step: p13.move.fit
    state: honest_stop_unresolved_divergence_or_noncommensurability
  - step: p13.move.check_readiness
    state: honest_stop_one_or_both_strands_invalid
