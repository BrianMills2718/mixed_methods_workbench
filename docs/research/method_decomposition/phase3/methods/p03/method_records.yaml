  judgment_owner: causal_inference_lead
  acceptance_authority: independent_evaluation_reviewer
  recommender: none
  value_goal_authority: evaluation_commissioner
  decision_authority: none
  implementation_evidence: methodology_reference_only
  collision_participation: level_2_only
  guards: {temporal: design_precedes_post_outcome_analysis, access: declared_evaluation_data, run_version: immutable_design_dataset_and_analysis_versions}

action_defaults: &action
