# Phase 0 step ledger — independent candidate, rev 5.1
# status: independent_candidate (not yet compared against ac27ab2)
# Produced without inspecting ac27ab2's rows/edges/findings (rev 5.1 §0.1).
# See sources.md for frozen methodology sources and pilot_frame-equivalent
# variant freezes (embedded per-method below as `variant`/`use_case`/
# `excluded_variants` header blocks, since §8.2 requires this freeze for
# every Phase 0 workflow, not only the Phase 1 pilot set).
#
# Field notes:
# - operation_kind frozen from sources BEFORE code inspection where an
#   ideal existed (qc_grounded_theory, pt_core_rival_explanation,
#   pt_source_acquisition, theory_forge_cpt_choices13k,
#   mist_trail_policy_appraisal). theory_forge_compile_apply has no
#   authoritative source (see sources.md §4); every operation there is
#   runtime_delivery by that absence, not by reclassification after
#   mapping. No operation_kind was changed after mapping to code in any
#   method (§5.0a guard 3: pre/post-mapping share is identical).
# - evidence_basis cites the frozen source (sources.md) for analytic /
#   methodological_support rows; runtime_delivery rows note "not
#   method-specified; engineering".
# - Two code realizations of the SAME ideal operation are recorded as
#   separate rows only where their execution_status genuinely diverges
#   (pt_source_acquisition screen/admit); this is flagged explicitly in
#   reality_check.md rather than silently double-counted in the abort gate.

methods_frozen:
  - method_id: qc_grounded_theory
    variant: >-
      Fixed-corpus grounded theory blending Straussian systematic coding
      (open/axial/selective coding via the conditions-actions/interactions-
      consequences paradigm) with Charmaz-style constructivist memo-writing
      and constant comparison, as implemented in QC's "Super Qualitative
      Analysis" fixed-corpus mode.
    use_case: >-
      The Open Science fixed-corpus grounded-theory workflow referenced in
      QC's own "Current adoption boundary" (docs/METHODS_AND_THEORY.md) and
      the P5 public-demo example threaded through process_tracing_handoff
      and the theory-test-return fixture.
    excluded_variants:
      - classic Glaserian grounded theory with true theoretical sampling
        (new-data collection guided by the emerging theory) — QC is
        fixed-corpus and cannot fetch new data
      - full multi-project neutral-theory-carrier representation (repo's
        own docs mark this experimental, not part of the fixed-corpus mode)

  - method_id: pt_core_rival_explanation
    variant: >-
      Single-case rival-explanation process tracing: Van Evera-style
      diagnostic-test labeling over an explicit Bayesian core in the
      narrative/likelihoodist tradition (Fairfield & Charman), within-case
      only.
    use_case: >-
      The repository's shipped single-case pipeline (pt/pipeline.py
      _run_core_passes). Exact case identity not independently confirmed by
      the inspecting agent in this pass — recorded as a material
      uncertainty in reality_check.md.
    excluded_variants:
      - cross-case / formal-model bridge (pt/pass_binarize.py, pt/cq_bridge.py,
        pt/multi_pipeline.py — CausalQueries integration) — out of scope;
        rev 5.1 §8 names only the single-case core workflow
      - Beach & Pedersen-style process tracing — not cited or implemented
        in this repository

  - method_id: pt_source_acquisition
    variant: >-
      Interactive, single-case-companion targeted source retrieval,
      screening, and admission loop (pt/acquisition_session.py and
      siblings) feeding the single-case core workflow.
    use_case: >-
      The "targeted source evaluation" loop described in PT's own
      docs/METHODOLOGY.md: freeze hypotheses -> retrieve for a declared
      evidence need -> review -> admit -> reassess.
    excluded_variants:
      - the separate bulk comparative-case-study "revolution" corpus
        pipeline (pt/revolution_*.py) — structurally distinct, LLM-judged
        screening with independent review; noted in the ledger as an
        alternate implementation of the same ideal operation, but excluded
        from this workflow's denominator because rev 5.1 §8 names the
        single-case companion specifically

  - method_id: theory_forge_compile_apply
    variant: >-
      Generic paper -> schema (v14, additively v15) -> agent-driven
      codegen -> pytest-gated verification -> staged run pipeline.
    use_case: "Any of the ~66 Phase-1 theory schemas compiled by this pipeline."
    excluded_variants:
      - none — this workflow is not compared against a methodology ideal at
        all per rev 5.1 §8 and sources.md §4

  - method_id: theory_forge_cpt_choices13k
    variant: >-
      Cumulative Prospect Theory (Tversky & Kahneman 1992 rank-dependent
      formulation) applied with fixed literature population parameters,
      scored as binary majority-choice classification accuracy (not
      individual-level probability prediction) against expected value on a
      pinned Choices13k subset.
    use_case: >-
      The 1,049-row declared filter subset / 1,009-row both-scored subset
      from the pinned jcpeterson/choices13k commit 821ae7e8..., per
      evidence/cpt_choices13k/.
    excluded_variants:
      - individual-level parameter fitting / calibration to Choices13k —
        explicitly out of scope per Plan #109's own acceptance criteria
      - the original 1979 (non-cumulative, separable-weight) Prospect
        Theory formulation — explicitly retired/disclaimed in-repo as
        source-lineage-confused

  - method_id: mist_trail_policy_appraisal
    variant: >-
      Deliberative policy-option appraisal borrowing MCA/evidence-to-
      decision transparency structure without implementing additive MCDA
      scoring, formal GRADE certainty rating, or Robust Decision Making.
    use_case: >-
      Yosemite National Park Mist Trail Corridor Rehabilitation Draft
      Environmental Assessment — Alternatives A (no action), B (vehicle
      bridge), C (pedestrian footbridge, NPS-preferred).
    excluded_variants:
      - a real NPS decision, legal/NEPA analysis, or formal public comment
        — explicitly disclaimed by the vertical's own design doc

steps:

# =========================================================================
# METHOD 1 — qc_grounded_theory  (11 distinct ideal ops; 15 ledger rows)
# =========================================================================

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.01
  verb: segment
  label: segment corpus into source units
  workflow_role: represent
  operation_kind: runtime_delivery
  actor_chain: [deterministic_engine]
  inputs:
    - {slot: corpus, type: source_document, role: subject, cardinality: many, optional: false}
  outputs:
    - {slot: segments, type: segment, role: result, cardinality: many, optional: false}
  parameters: [segmentation granularity/window config]
  preconditions: [corpus documents ingested]
  conclusion_supported: "none — enabling step only"
  failure_output: precondition unmet
  method_owned_semantics: "none — this is QC engineering, not a GT-specified operation"
  evidence_basis: "not method-specified; engineering precondition for grounding"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "qualitative_coding qc_clean/core/segmentation.py:92-152 (deterministic, SHA-256-derived segment IDs)"
  optional: false
  repeatable: true

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.02
  verb: code
  label: "open coding: identify incidents and initial codes"
  workflow_role: analyze
  operation_kind: analytic
  actor_chain: [llm_engine, deterministic_validator]
  inputs:
    - {slot: segment, type: segment, role: subject, cardinality: one, optional: false}
    - {slot: codebook, type: code_system, role: context, cardinality: one, optional: false}
  outputs:
    - {slot: codes, type: code, role: result, cardinality: many, optional: false}
  parameters: [model/prompt config, new_code_policy]
  preconditions: [segment exists and is source-anchored]
  conclusion_supported: "segment S exhibits concept/code C, grounded to an exact source span"
  failure_output: "insufficient evidence; ambiguous span discarded, not silently kept"
  method_owned_semantics: "which incidents count as theoretically relevant is a GT-analyst judgment; software enforces only that any asserted code is uniquely, verifiably grounded"
  evidence_basis: "Corbin & Strauss 2015 ch.5 (open coding)"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "qc_clean/core/pipeline/stages/gt_constant_comparison.py:213-341 (LLM call, docstring cites Strauss & Corbin); qc_clean/core/grounding.py:114-158,479-519 (deterministic unique-match grounding gate)"
  optional: false
  repeatable: true

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.03
  verb: compare
  label: "constant comparison of new incidents against the evolving codebook"
  workflow_role: analyze
  operation_kind: analytic
  actor_chain: [llm_engine, deterministic_engine]
  inputs:
    - {slot: new_codes, type: code, role: subject, cardinality: many, optional: false}
    - {slot: existing_codebook, type: code_system, role: context, cardinality: one, optional: false}
  outputs:
    - {slot: merged_codebook, type: code_system, role: result, cardinality: one, optional: false}
  parameters: [merge/name-normalization rules]
  preconditions: [at least one prior coded segment exists]
  conclusion_supported: "code C is/is not the same phenomenon as an existing code, across segments"
  failure_output: "unresolved comparison — left as a distinct code pending later review"
  method_owned_semantics: "judging conceptual sameness across incidents is the core GT analytic act"
  evidence_basis: "Corbin & Strauss 2015 (constant comparative method); Charmaz 2014 ch.3"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "qc_clean/core/pipeline/stages/gt_constant_comparison.py:422-506 (_merge_segment_results). NOTE: the comparison judgment itself is bundled inside the same per-segment LLM call as step .02 (one code path realizes two ideal operations); _merge_segment_results performs only deterministic name-normalization/span-resolution bookkeeping on top of that judgment, not the comparison itself."
  optional: false
  repeatable: true

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.04
  verb: conceptualize
  label: "develop categories with properties and dimensions"
  workflow_role: conceptualize
  operation_kind: analytic
  actor_chain: [llm_engine, deterministic_validator]
  inputs:
    - {slot: codes, type: code, role: subject, cardinality: many, optional: false}
  outputs:
    - {slot: categories, type: concept, role: result, cardinality: many, optional: false}
  parameters: [model/prompt config]
  preconditions: [codebook has sufficient codes to group]
  conclusion_supported: "category C has properties P varying along dimensions D, instantiated by evidence E"
  failure_output: "category adequacy insufficient — see .10"
  method_owned_semantics: "which properties/dimensions matter is a GT-analyst judgment"
  evidence_basis: "Corbin & Strauss 2015 ch.7 (categories, properties, dimensions)"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "populated via scripts/run_public_grounded_theory_development.py (LLM call, ~line 190/204) into the typed model in qc_clean/core/grounded_theory_development.py (validator/projector only, zero LLM calls in that file itself). NOTE: this is a one-off script path, not the default `qc_cli.py project run` pipeline invocation — lower confidence than steps .02-.03 that this executes on every default run."
  optional: false
  repeatable: true

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.05
  verb: derive
  label: "axial coding: relate categories via conditions / actions-interactions / consequences"
  workflow_role: analyze
  operation_kind: analytic
  actor_chain: [llm_engine]
  inputs:
    - {slot: categories, type: concept, role: subject, cardinality: many, optional: false}
  outputs:
    - {slot: relations, type: proposition, role: result, cardinality: many, optional: false}
  parameters: [model/prompt config]
  preconditions: [categories exist]
  conclusion_supported: "condition X leads to action/interaction Y producing consequence Z, per corpus evidence"
  failure_output: "unresolved comparison — relation left unclaimed"
  method_owned_semantics: "the paradigm-model relation itself is GT-analyst/method judgment"
  evidence_basis: "Corbin & Strauss 2015 ch.9 (paradigm/conditional matrix)"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "qc_clean/core/pipeline/stages/gt_axial_coding.py:46-132 (LLM call, prompt explicitly invokes Strauss/Corbin paradigm model); evidence spans bound deterministically"
  optional: false
  repeatable: true

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.06
  verb: annotate
  label: "write theoretical memos"
  workflow_role: analyze
  operation_kind: methodological_support
  actor_chain: [llm_engine]
