  - {<<: *m, record_id: p10.move.generate_futures, parent_phase: p10.phase.explore, label: generate a diverse ensemble of plausible futures, inputs: [frozen_xlrpm_frame], output: plausible_future_ensemble, information_origin: [derived, simulated, elicited], method_owned_rule: ensemble_explores_disputed_uncertainties_without_assigning_one_predictive_probability, permitted_conclusion: strategies_can_be_stressed_across_declared_possibilities, source_basis: lempert_2003_chs_2_3, exact_anchors: [lempert_2003_ch2, groves_2019_step2]}
