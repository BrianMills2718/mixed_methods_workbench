[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-methods-workbench"
version = "0.1.0"
description = "Typed integration contracts for a text-centered mixed-methods workbench."
requires-python = ">=3.12"
dependencies = ["data_contracts==0.1.0", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["agentic-engineering-system", "mypy>=1.10", "pytest>=8.0", "PyYAML>=6.0", "ruff>=0.8"]

[project.scripts]
mmw-demo = "mixed_methods_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rfE"
markers = ["req(capability_scenario): behavior specification covered by this test"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mixed_methods_workbench"]
mypy_path = "src"

# llm_client ships no py.typed and is imported lazily only by the two live-run
# modules; it is not a dependency of this package (issue #46).
[[tool.mypy.overrides]]
module = ["llm_client", "llm_client.*"]
ignore_missing_imports = true

# data_contracts is not on PyPI; it resolves from the local checkout (README "Install").
[tool.lockstep]
source = ["src", "scripts"]
tests = ["tests"]

[tool.uv.sources]
agentic-engineering-system = { git = "https://github.com/BrianMills2718/agentic-engineering-system-canonical.git", rev = "05ee80c1a9cc77f692954b6de09a81ab0d9bdb0a" }
data-contracts = { path = "/home/brian/code2/data-contracts", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100
