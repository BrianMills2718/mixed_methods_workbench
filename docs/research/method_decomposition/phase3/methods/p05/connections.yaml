topology_assertions:
- theoretical_sampling_feedback_loop_is_required
- reflexive_position_is_retained_through_integration
- adequacy_gates_integration_and_may_return_to_sampling
topology:
  shape: adaptive
  required_cycles:
  - cycle: p05.move.theoretical_sample -> p05.move.refine -> p05.move.adequacy -> p05.move.theoretical_sample
    termination: adequacy supported or access exhausted
    termination_authority: human
  optional_cycles:
  - cycle: p05.move.initial_code -> p05.move.compare_memo -> p05.move.focus_categories -> p05.move.theoretical_sample
    condition: successor material enters another coding cycle
  prohibited_cycles:
  - cycle: p05.move.integrate -> p05.move.gather
    reason: final theory cannot silently reopen and rewrite prior corpus history
  prohibited_edges:
  - p05.c16
  - p05.c17
  entry_points:
  - p05.move.orient
  terminal_points:
  - step: p05.move.integrate
    state: bounded_theory_or_partial_account
  - step: p05.move.adequacy
    state: honest_stop_access_exhausted_or_categories_inadequate
