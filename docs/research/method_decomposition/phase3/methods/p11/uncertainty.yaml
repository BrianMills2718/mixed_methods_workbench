schema_version: phase3-method-uncertainty-1.0
method_id: P11
items:
  - {id: p11.u01, status: known, subject: valuation, statement: "Some material social impacts cannot be defensibly monetized.", downstream_effect: "Keep them explicit beside CBA or use CEA where benefits are unmonetizable."}
  - {id: p11.u02, status: known, subject: mcda_branch, statement: "MCDA is conditional and facilitation-dependent, not a default shortlist method.", downstream_effect: "A control gate selects OFF or bounded MCDA and records why."}
  - {id: p11.u03, status: contested, subject: option_ratings, statement: "OFF and MCDA judgments embed evidence, assumptions, expertise, and values.", downstream_effect: "Preserve rationales, dissent, and authority rather than calling ratings facts."}
  - {id: p11.u04, status: known, subject: decision, statement: "Appraisal advice does not bind the accountable decision-maker.", downstream_effect: "Recommendation, assurance, and decision remain separate records."}
  - {id: p11.u05, status: unknown, subject: evidence_availability, statement: "Before appraisal, it is unknown whether every material option impact can be estimated or characterized adequately.", downstream_effect: "Missing impacts remain explicit and can force qualification or no robust preference."}
  - {id: p11.u06, status: source_limited, subject: local_governance, statement: "The Green Book fixes appraisal principles but organization-specific approval and assurance roles vary.", downstream_effect: "The frame names functional authorities and requires each application to bind them to accountable local offices."}
