schema_version: phase3-uncertainty-0.1
method_id: p06
items:
  - {id: p06.u01, status: known, topic: sampling_variance, account: estimated under the actual probability design, downstream_effect: accompanies_every_prevalence_estimate}
  - {id: p06.u02, status: source_limited, topic: coverage_error, account: known frame gaps can be assessed but excluded or duplicate units may remain unknown, downstream_effect: limits_target_population_inference}
  - {id: p06.u03, status: contested, topic: nonresponse_adjustment, account: weighting depends on auxiliary information and response assumptions that data cannot prove, downstream_effect: may_require_qualification_or_refusal}
  - {id: p06.u04, status: source_limited, topic: measurement_error, account: pretesting and quality checks reduce but do not identify every response bias, downstream_effect: confidence_interval_is_not_total_error}
  - {id: p06.u05, status: known, topic: causal_scope, account: cross-sectional prevalence does not identify a policy effect, downstream_effect: causal_transition_is_prohibited}
stopping_rule: stop or explicitly qualify when design metadata cannot reconstruct selection/variance or material coverage, nonresponse, or measurement error is unbounded
