schema_version: phase1-revision-connections-0.2
status: exploratory_not_adopted
connection_types: [artifact_flow, retained_context, control_gate, feedback, prohibited_transition]
artifact_flow_defaults:
  transfer_semantics: preserving
  rule: >-
    Every artifact_flow below inherits preserving unless the edge explicitly
    declares transforming or lossy and names method_owner and change_or_loss.
note: >-
  All Level 2 moves and Level 3 actions are graph-addressable. Artifact flows
  name matching producer outputs and consumer inputs; other connections name
  their context, gate, feedback request, or invalidating event explicitly.

connections:
  - {id: gt.c01, method_id: grounded_theory, from: gt.move.gather, to: gt.move.segment, connection_type: artifact_flow, carries: source_material, from_output: source_material, to_input: source_material}
  - {id: gt.c02, method_id: grounded_theory, from: gt.move.segment, to: gt.move.initial_code, connection_type: artifact_flow, carries: anchored_incidents, from_output: anchored_incidents, to_input: anchored_incidents}
  - {id: gt.c03, method_id: grounded_theory, from: gt.move.initial_code, to: gt.move.compare, connection_type: artifact_flow, carries: initial_codes, from_output: initial_codes, to_input: initial_codes}
  - {id: gt.c04, method_id: grounded_theory, from: gt.move.segment, to: gt.move.compare, connection_type: retained_context, carries: anchored_incidents, from_output: anchored_incidents, to_input: anchored_incidents}
  - {id: gt.c05, method_id: grounded_theory, from: gt.move.compare, to: gt.move.memo, connection_type: artifact_flow, carries: comparison_record, from_output: comparison_record, to_input: comparison_record}
  - {id: gt.c06, method_id: grounded_theory, from: gt.move.initial_code, to: gt.move.memo, connection_type: retained_context, carries: initial_codes, from_output: initial_codes, to_input: initial_codes}
  - {id: gt.c07, method_id: grounded_theory, from: gt.move.memo, to: gt.move.focus, connection_type: artifact_flow, carries: versioned_memos, from_output: versioned_memos, to_input: versioned_memos}
  - {id: gt.c08, method_id: grounded_theory, from: gt.move.compare, to: gt.move.focus, connection_type: retained_context, carries: comparison_record, from_output: comparison_record, to_input: comparison_record}
  - {id: gt.c09, method_id: grounded_theory, from: gt.move.focus, to: gt.move.sample, connection_type: artifact_flow, carries: provisional_categories, from_output: provisional_categories, to_input: provisional_categories}
  - {id: gt.c10, method_id: grounded_theory, from: gt.move.sample, to: gt.move.refine, connection_type: artifact_flow, carries: targeted_source_increment, from_output: targeted_source_increment, to_input: targeted_source_increment}
  - {id: gt.c11, method_id: grounded_theory, from: gt.move.refine, to: gt.move.adequacy, connection_type: artifact_flow, carries: revised_analysis_bundle, from_output: revised_analysis_bundle, to_input: revised_analysis_bundle}
  - {id: gt.c12, method_id: grounded_theory, from: gt.move.adequacy, to: gt.move.sample, connection_type: feedback, carries: category_development_request, condition: inadequate_and_access_possible, creates_successor_version: true}
  - {id: gt.c13, method_id: grounded_theory, from: gt.move.adequacy, to: gt.move.integrate, connection_type: control_gate, carries: adequacy_acceptance, condition: adequate_for_bounded_account}
