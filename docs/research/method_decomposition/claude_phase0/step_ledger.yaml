  preconditions: [multiple categories with relations exist]
  conclusion_supported: "category C is the integrating core category explaining the central phenomenon in the corpus"
  failure_output: "unresolved comparison — no single integrating category identified"
  method_owned_semantics: "core-category selection is the single most judgment-laden GT step; software performs no scoring/ranking of candidates"
  evidence_basis: "Corbin & Strauss 2015 ch.10 (selective coding / core category)"
  execution_status: software_executable
  representation_status: implemented_artifact
  implementation_ref: "qc_clean/core/pipeline/stages/gt_selective_coding.py:39-127 (LLM call producing CoreCategoriesResponse with justification; no software-side scoring)"
  optional: false
  repeatable: false

- method_id: qc_grounded_theory
  step_id: qc_grounded_theory.08
  verb: construct
  label: "theoretical integration: build the explanatory framework / propositions"
