schema_version: phase3-method-uncertainty-1.0
method_id: P05
items:
  - {id: p05.u01, status: source_limited, subject: exact_page_anchors, statement: "The publisher exposes chapter topology but not book pages.", downstream_effect: "Use chapter-level anchors; independent review must not infer unseen wording."}
  - {id: p05.u02, status: contested, subject: category_adequacy, statement: "Saturation terminology and standards vary across grounded-theory traditions.", downstream_effect: "Record the selected constructivist adequacy rationale and permit a bounded partial account."}
  - {id: p05.u03, status: known, subject: theoretical_sampling, statement: "Sampling direction depends on emerging category gaps and cannot be fully prespecified.", downstream_effect: "Preserve a feedback loop and human judgment authority."}
  - {id: p05.u04, status: known, subject: reflexivity, statement: "Researcher position contributes to interpretation.", downstream_effect: "Memos and final theory retain positional and interpretive decisions."}
  - {id: p05.u05, status: unknown, subject: successor_material, statement: "It is not known whether accessible future material would materially revise the emerging categories.", downstream_effect: "Adequacy remains conditional on the sampling attempts and access limits actually recorded."}
  - {id: p05.u06, status: known, subject: loop_structure, statement: "Successor material from theoretical sampling re-enters initial coding, comparison and focused coding before categories are revised; refine is narrowed to revising categories and outputs categories (concept), not a memo.", downstream_effect: "Each later sampling pass is aimed at the revised categories (p05.c12/p05.c21), and adequacy and integration consume categories with the revision memo as context."}
  - {id: p05.u07, status: known, subject: prior_category_reentry, statement: "On each successor pass the category version that directed theoretical sampling (provisional from focus_categories on the sampling cycle, revised from refine when adequacy returns for more data) re-enters compare_memo, focus_categories and refine through the typed slot prior_category_version (p05.c27-p05.c29). It is routed through theoretical_sample's directing_category_version rather than straight from refine because the required sampling cycle can return before refine has run, so refine alone would leave that cycle's categories without a path back.", downstream_effect: "Successor codes are compared against the existing categories rather than categorized from the new increment alone; each refine pass supersedes and carries forward the prior version, so integrate (p05.c14) receives the cumulative category set, and superseded versions stay in the version history."}
