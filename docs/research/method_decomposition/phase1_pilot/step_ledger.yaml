schema_version: phase1-pilot-0.1
status: unresolved_granularity_candidate
scope_note: >-
  Source-derived ideal operations, not implemented workbench capabilities and
  not a universal schema. The original transient blind reports claimed 90
  operations but were not preserved. Detailed audit reruns produced 87 operations
  after an earlier concise recovery produced 85;
  this compact 70-row integration candidate retains unresolved compression and
  information loss recorded in integration_findings.md, structural_gaps.yaml,
  and blind_reruns/reconciliation.yaml. It is not ready for collision or
  promotion. Defaults below apply to every row unless overridden.

ideal_defaults: &ideal
  actor_chain: [human_analyst]
  execution_status: not_implemented
  representation_status: methodology_reference_only
  implementation_ref: null
  optional: false
  repeatable: false

steps:
  # Systematic review of randomized intervention effects
  - {<<: *ideal, method_id: systematic_review, step_id: sr.01, verb: define, label: frame review question and scope, workflow_role: frame, operation_kind: analytic,
     inputs: [{slot: policy_uncertainty, type: gap, role: subject, cardinality: one, optional: false}], outputs: [{slot: review_question, type: claim, role: result, cardinality: one, optional: false}],
     parameters: [PICO elements], preconditions: [decision-relevant uncertainty exists], conclusion_supported: "the review will answer this bounded intervention-effect question", failure_output: out_of_scope, method_owned_semantics: "scope determines which effect claim the synthesis may answer", evidence_basis: "Cochrane Handbook 6.5.1 chs.1-2"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.02, verb: construct, label: register review protocol, workflow_role: design, operation_kind: methodological_support,
     inputs: [{slot: review_question, type: claim, role: subject, cardinality: one, optional: false}], outputs: [{slot: protocol, type: review_protocol, role: result, cardinality: one, optional: false}],
     parameters: [planned outcomes, synthesis plan], preconditions: [question frozen], conclusion_supported: "methods were declared before results were known", failure_output: disclosed_deviation, method_owned_semantics: "protocol changes require dated rationale", evidence_basis: "Cochrane ch.1; PRISMA items 24a-24c"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.03, verb: define, label: specify eligibility and synthesis groups, workflow_role: design, operation_kind: analytic,
     inputs: [{slot: protocol, type: review_protocol, role: context, cardinality: one, optional: false}], outputs: [{slot: eligibility_criteria, type: criterion, role: result, cardinality: many, optional: false}],
     parameters: [population, intervention, comparator, outcome, design], preconditions: [protocol exists], conclusion_supported: "a study is eligible under prespecified rules", failure_output: human_review_required, method_owned_semantics: "substantive comparability and grouping for synthesis", evidence_basis: "Cochrane ch.3; PRISMA item 5"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.04, verb: search, label: execute reproducible searches, workflow_role: acquire, operation_kind: methodological_support,
     inputs: [{slot: eligibility_criteria, type: criterion, role: criteria, cardinality: many, optional: false}], outputs: [{slot: search_results, type: source_document, role: result, cardinality: many, optional: false}],
     parameters: [databases, registers, queries, dates], preconditions: [search strategy peer reviewed where feasible], conclusion_supported: "these records were retrieved by the declared search", failure_output: insufficient_source_coverage, method_owned_semantics: "search sensitivity relative to eligible evidence universe", evidence_basis: "Cochrane ch.4; PRISMA items 6-7"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.05, verb: screen, label: screen records and full texts, workflow_role: appraise, operation_kind: analytic,
     inputs: [{slot: records, type: source_document, role: subject, cardinality: many, optional: false}, {slot: criteria, type: criterion, role: criteria, cardinality: many, optional: false}], outputs: [{slot: decisions, type: screening_decision, role: result, cardinality: many, optional: false}],
     parameters: [independent reviewers, conflict procedure], preconditions: [deduplicated records], conclusion_supported: "included reports meet declared eligibility criteria", failure_output: unresolved_comparison, method_owned_semantics: "borderline eligibility and report-to-study linkage", evidence_basis: "Cochrane ch.4; PRISMA item 8"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.06, verb: extract, label: collect study data, workflow_role: represent, operation_kind: methodological_support,
     inputs: [{slot: included_reports, type: source_document, role: subject, cardinality: many, optional: false}], outputs: [{slot: study_dataset, type: dataset, role: result, cardinality: one, optional: false}],
     parameters: [data items, duplicate extraction], preconditions: [included studies identified], conclusion_supported: "the structured study data reproduce the included reports", failure_output: insufficient_evidence, method_owned_semantics: "resolve multiple reports and incompatible outcome definitions", evidence_basis: "Cochrane ch.5; PRISMA items 9-10"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.07, verb: appraise_source, label: assess study risk of bias, workflow_role: appraise, operation_kind: analytic,
     inputs: [{slot: studies, type: dataset, role: subject, cardinality: one, optional: false}], outputs: [{slot: bias_judgments, type: appraisal, role: result, cardinality: many, optional: false}],
     parameters: [risk-of-bias domain rules], preconditions: [study methods available], conclusion_supported: "this result has these study-level bias concerns", failure_output: insufficient_reporting, method_owned_semantics: "domain-level bias judgment is not reducible to reporting completeness", evidence_basis: "Cochrane chs.7-8; PRISMA item 11"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.08, verb: construct, label: prepare effect estimates, workflow_role: analyze, operation_kind: analytic,
     inputs: [{slot: study_dataset, type: dataset, role: subject, cardinality: one, optional: false}], outputs: [{slot: estimates, type: estimate, role: result, cardinality: many, optional: false}],
     parameters: [effect measure, unit-of-analysis corrections], preconditions: [compatible outcome data], conclusion_supported: "each study contributes a comparable effect estimate", failure_output: incompatible_measurement, method_owned_semantics: "effect measure and handling of complex designs", evidence_basis: "Cochrane chs.6 and 9"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.09, verb: synthesize, label: synthesize comparable effects, workflow_role: integrate, operation_kind: analytic,
     inputs: [{slot: estimates, type: estimate, role: subject, cardinality: many, optional: false}, {slot: bias_judgments, type: appraisal, role: context, cardinality: many, optional: false}], outputs: [{slot: pooled_estimate, type: estimate, role: result, cardinality: one, optional: true}],
     parameters: [fixed-or-random model, heterogeneity plan], preconditions: [clinical and methodological comparability], conclusion_supported: "the average intervention effect under the declared synthesis model is X", failure_output: refuse_inappropriate_pooling, method_owned_semantics: "whether pooling is meaningful and how heterogeneity changes interpretation", evidence_basis: "Cochrane ch.10"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.10, verb: perturb, label: run sensitivity and subgroup analyses, workflow_role: appraise, operation_kind: analytic,
     inputs: [{slot: synthesis, type: estimate, role: subject, cardinality: one, optional: true}], outputs: [{slot: robustness_findings, type: finding, role: result, cardinality: many, optional: false}],
     parameters: [prespecified exclusions, subgroup definitions], preconditions: [primary synthesis or structured non-pooling result exists], conclusion_supported: "the conclusion changes or persists under declared alternatives", failure_output: model_conditional_only, method_owned_semantics: "distinguish prespecified exploration from data-driven subgroup claims", evidence_basis: "Cochrane ch.10; PRISMA items 13e-13f"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.11, verb: appraise_source, label: assess certainty and missing-result bias, workflow_role: appraise, operation_kind: analytic,
     inputs: [{slot: body_of_evidence, type: finding, role: subject, cardinality: many, optional: false}], outputs: [{slot: certainty, type: appraisal, role: result, cardinality: one, optional: false}],
     parameters: [certainty framework], preconditions: [synthesis and bias assessments complete], conclusion_supported: "confidence in the body-of-evidence conclusion is bounded by these concerns", failure_output: unresolved_evidence, method_owned_semantics: "body-level certainty and risk of unavailable results", evidence_basis: "Cochrane chs.13-14; PRISMA items 14-15"}
  - {<<: *ideal, method_id: systematic_review, step_id: sr.12, verb: synthesize, label: report bounded review finding, workflow_role: communicate, operation_kind: analytic,
     inputs: [{slot: synthesis, type: finding, role: subject, cardinality: many, optional: false}], outputs: [{slot: review_finding, type: finding, role: result, cardinality: one, optional: false}],
     parameters: [PRISMA reporting], preconditions: [study flow and deviations recorded], conclusion_supported: "the review supports this bounded effect conclusion and these limits", failure_output: refuse_overclaim, method_owned_semantics: "separate no evidence from evidence of no effect", evidence_basis: "PRISMA 2020 checklist; Cochrane ch.15"}

  # Constructivist grounded theory
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.01, verb: define, label: frame sensitizing inquiry, workflow_role: frame, operation_kind: analytic, inputs: [{slot: phenomenon, type: gap, role: subject, cardinality: one, optional: false}], outputs: [{slot: initial_question, type: claim, role: result, cardinality: one, optional: false}], parameters: [sensitizing concepts], preconditions: [open-ended phenomenon], conclusion_supported: "this inquiry orients data gathering without fixing categories", failure_output: deductive_frame_too_closed, method_owned_semantics: "maintain openness while acknowledging prior positioning", evidence_basis: "Charmaz 3e chs.1-2"}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.02, verb: acquire, label: gather rich initial data, workflow_role: acquire, operation_kind: analytic, inputs: [{slot: initial_question, type: claim, role: context, cardinality: one, optional: false}], outputs: [{slot: source_material, type: source_document, role: result, cardinality: many, optional: false}], parameters: [initial sampling, interview or observation approach], preconditions: [access and relevant participants or settings], conclusion_supported: "the corpus contains detailed accounts of the focal process", failure_output: thin_data, method_owned_semantics: "what counts as rich and relevant data", evidence_basis: "Charmaz 3e chs.2-4"}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.03, verb: code, label: conduct initial coding, workflow_role: analyze, operation_kind: analytic, inputs: [{slot: data, type: segment, role: subject, cardinality: many, optional: false}], outputs: [{slot: initial_codes, type: code, role: result, cardinality: many, optional: false}], parameters: [line-by-line or incident coding], preconditions: [source material available], conclusion_supported: "these provisional action-oriented codes characterize incidents", failure_output: ambiguous_segment, method_owned_semantics: "codes remain provisional and close to data", evidence_basis: "Charmaz 3e ch.5", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.04, verb: compare, label: compare incidents codes and cases, workflow_role: analyze, operation_kind: analytic, inputs: [{slot: incidents, type: segment, role: subject, cardinality: many, optional: false}, {slot: codes, type: code, role: context, cardinality: many, optional: false}], outputs: [{slot: comparisons, type: finding, role: result, cardinality: many, optional: false}], parameters: [comparison targets], preconditions: [at least two incidents or a prior code exists], conclusion_supported: "these similarities differences and variations refine the emerging analysis", failure_output: unresolved_comparison, method_owned_semantics: "comparison is generative rather than a fixed equality test", evidence_basis: "Charmaz 3e chs.5-6", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.05, verb: code, label: conduct focused coding, workflow_role: analyze, operation_kind: analytic, inputs: [{slot: initial_codes, type: code, role: subject, cardinality: many, optional: false}], outputs: [{slot: focused_codes, type: code_system, role: result, cardinality: one, optional: false}], parameters: [analytic significance and frequency], preconditions: [initial coding and comparisons], conclusion_supported: "these focused codes best organize substantial portions of the data", failure_output: premature_closure, method_owned_semantics: "significance is conceptual not merely frequency", evidence_basis: "Charmaz 3e ch.6", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.06, verb: annotate, label: write analytic memos, workflow_role: represent, operation_kind: analytic, inputs: [{slot: codes_and_comparisons, type: finding, role: subject, cardinality: many, optional: false}], outputs: [{slot: memos, type: memo, role: result, cardinality: many, optional: false}], parameters: [memo prompts], preconditions: [analytic question or comparison exists], conclusion_supported: "this memo records the developing category rationale and open questions", failure_output: rationale_unrecorded, method_owned_semantics: "memoing advances analysis rather than merely documenting it", evidence_basis: "Charmaz 3e ch.7", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.07, verb: conceptualize, label: develop theoretical categories, workflow_role: conceptualize, operation_kind: analytic, inputs: [{slot: focused_codes, type: code_system, role: subject, cardinality: one, optional: false}, {slot: memos, type: memo, role: context, cardinality: many, optional: false}], outputs: [{slot: categories, type: concept, role: result, cardinality: many, optional: false}], parameters: [properties and dimensions], preconditions: [focused codes have analytic reach], conclusion_supported: "these categories explain patterned variation in the process", failure_output: weak_category, method_owned_semantics: "raising codes to categories while retaining empirical grounding", evidence_basis: "Charmaz 3e chs.6-7", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.08, verb: identify, label: identify theoretical sampling needs, workflow_role: design, operation_kind: analytic, inputs: [{slot: categories, type: concept, role: subject, cardinality: many, optional: false}], outputs: [{slot: sampling_gaps, type: gap, role: result, cardinality: many, optional: false}], parameters: [category properties needing development], preconditions: [emergent categories exist], conclusion_supported: "these next data are needed to develop or challenge a category", failure_output: no_accessible_sampling_path, method_owned_semantics: "sampling follows theoretical need not representativeness", evidence_basis: "Charmaz 3e ch.8; Charmaz 2020", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.09, verb: acquire, label: conduct theoretical sampling, workflow_role: acquire, operation_kind: analytic, inputs: [{slot: sampling_gaps, type: gap, role: criteria, cardinality: many, optional: false}], outputs: [{slot: targeted_data, type: source_document, role: result, cardinality: many, optional: false}], parameters: [target participants settings incidents], preconditions: [new data collection possible], conclusion_supported: "new data were selected to develop or challenge named categories", failure_output: evidence_unavailable, method_owned_semantics: "distinguish theoretical sampling from convenience follow-up", evidence_basis: "Charmaz 3e ch.8; Charmaz 2020", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.10, verb: review, label: assess category adequacy, workflow_role: appraise, operation_kind: analytic, inputs: [{slot: categories, type: concept, role: subject, cardinality: many, optional: false}, {slot: comparisons, type: finding, role: context, cardinality: many, optional: false}], outputs: [{slot: adequacy_appraisal, type: appraisal, role: result, cardinality: one, optional: false}], parameters: [properties variation negative cases], preconditions: [theoretical sampling cycles attempted], conclusion_supported: "categories are sufficiently developed for this bounded theory or remain incomplete", failure_output: unresolved_adequacy, method_owned_semantics: "adequacy is argued; saturation is not a count threshold", evidence_basis: "Charmaz 3e ch.8", repeatable: true}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.11, verb: construct, label: integrate categories into theory, workflow_role: integrate, operation_kind: analytic, inputs: [{slot: categories, type: concept, role: subject, cardinality: many, optional: false}, {slot: memos, type: memo, role: context, cardinality: many, optional: false}], outputs: [{slot: grounded_theory, type: theory, role: result, cardinality: one, optional: false}], parameters: [sorting diagramming integration], preconditions: [adequacy appraisal supports integration], conclusion_supported: "this interpretive theory explains the studied process within its scope", failure_output: refuse_premature_theory, method_owned_semantics: "integration and theorizing remain interpretive constructions", evidence_basis: "Charmaz 3e chs.8-9"}
  - {<<: *ideal, method_id: grounded_theory, step_id: gt.12, verb: review, label: scrutinize theory and reflexivity, workflow_role: appraise, operation_kind: analytic, inputs: [{slot: grounded_theory, type: theory, role: subject, cardinality: one, optional: false}], outputs: [{slot: bounded_finding, type: finding, role: result, cardinality: one, optional: false}, {slot: reflexive_memo, type: memo, role: trace, cardinality: one, optional: false}], parameters: [alternative readings, researcher positioning], preconditions: [integrated account exists], conclusion_supported: "the theory is grounded and bounded in these ways with these alternatives", failure_output: refuse_overclaim, method_owned_semantics: "reflexivity is continuing analytic practice not a checkbox", evidence_basis: "Charmaz 3e chs.9 and 12"}

  # Theory-testing process tracing
  - {<<: *ideal, method_id: process_tracing, step_id: pt.01, verb: define, label: bound case and outcome, workflow_role: frame, operation_kind: analytic, inputs: [{slot: case_problem, type: case, role: subject, cardinality: one, optional: false}], outputs: [{slot: bounded_case, type: case, role: result, cardinality: one, optional: false}], parameters: [time interval, outcome definition], preconditions: [within-case causal question], conclusion_supported: "this case outcome and temporal scope are the object of explanation", failure_output: out_of_scope, method_owned_semantics: "case boundary controls admissible causal-process claims", evidence_basis: "Beach & Pedersen 2019 theory-testing variant"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.02, verb: construct, label: specify rival explanations, workflow_role: design, operation_kind: analytic, inputs: [{slot: bounded_case, type: case, role: subject, cardinality: one, optional: false}], outputs: [{slot: rivals, type: rival_explanation, role: result, cardinality: many, optional: false}], parameters: [scope and mutual distinctions], preconditions: [plausible literature or case alternatives], conclusion_supported: "these rivals define the comparative explanation space", failure_output: inadequate_rivals, method_owned_semantics: "rivals must be plausible and discriminable rather than straw alternatives", evidence_basis: "Beach & Pedersen 2019; Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.03, verb: construct, label: articulate causal mechanisms, workflow_role: conceptualize, operation_kind: analytic, inputs: [{slot: rivals, type: rival_explanation, role: subject, cardinality: many, optional: false}], outputs: [{slot: mechanisms, type: theory, role: result, cardinality: many, optional: false}], parameters: [entities activities sequencing], preconditions: [rivals frozen], conclusion_supported: "each rival implies this causal process linking conditions to outcome", failure_output: mechanism_underspecified, method_owned_semantics: "mechanism is not a variable list or generic causal arrow", evidence_basis: "Beach & Pedersen 2019"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.04, verb: derive, label: derive predicted within-case evidence, workflow_role: design, operation_kind: analytic, inputs: [{slot: mechanisms, type: theory, role: subject, cardinality: many, optional: false}], outputs: [{slot: predictions, type: diagnostic_item, role: result, cardinality: many, optional: false}], parameters: [expected and absent evidence], preconditions: [mechanism steps explicit], conclusion_supported: "this evidence would be more or less expected under each rival", failure_output: nondiscriminating_predictions, method_owned_semantics: "prediction diagnosticity depends on comparative expectations", evidence_basis: "Beach & Pedersen 2019; Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.05, verb: identify, label: plan diagnostic source search, workflow_role: design, operation_kind: methodological_support, inputs: [{slot: predictions, type: diagnostic_item, role: subject, cardinality: many, optional: false}], outputs: [{slot: evidence_needs, type: gap, role: result, cardinality: many, optional: false}], parameters: [source opportunity, exposure risk], preconditions: [predictions frozen], conclusion_supported: "these sources offer opportunities to observe discriminating evidence", failure_output: no_source_opportunity, method_owned_semantics: "absence matters only where observation was reasonably possible", evidence_basis: "Beach & Pedersen 2019 evidence search; Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.06, verb: acquire, label: collect case evidence, workflow_role: acquire, operation_kind: methodological_support, inputs: [{slot: evidence_needs, type: gap, role: criteria, cardinality: many, optional: false}], outputs: [{slot: case_sources, type: source_document, role: result, cardinality: many, optional: false}], parameters: [source strategy and stopping rationale], preconditions: [source access], conclusion_supported: "the collected corpus addresses declared evidence needs", failure_output: insufficient_source_fitness, method_owned_semantics: "search must not select only confirming traces", evidence_basis: "Beach & Pedersen 2019"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.07, verb: appraise_source, label: assess source reliability and exposure, workflow_role: appraise, operation_kind: analytic, inputs: [{slot: case_sources, type: source_document, role: subject, cardinality: many, optional: false}], outputs: [{slot: source_appraisals, type: appraisal, role: result, cardinality: many, optional: false}], parameters: [authenticity, independence, access to facts], preconditions: [source provenance known], conclusion_supported: "this item may bear this evidential weight subject to source limits", failure_output: inadmissible_source, method_owned_semantics: "source reliability is separate from evidence diagnosticity", evidence_basis: "Beach & Pedersen 2019; Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.08, verb: test, label: evaluate evidence under all rivals, workflow_role: analyze, operation_kind: analytic, inputs: [{slot: evidence, type: evidence_item, role: subject, cardinality: many, optional: false}, {slot: rivals, type: rival_explanation, role: context, cardinality: many, optional: false}], outputs: [{slot: likelihood_appraisals, type: appraisal, role: result, cardinality: many, optional: false}], parameters: [qualitative or explicit likelihood ratios], preconditions: [evidence and source appraisal available], conclusion_supported: "this evidence favors or disfavors rivals by this bounded amount", failure_output: unresolved_comparison, method_owned_semantics: "comparative likelihood judgment and dependence between items", evidence_basis: "Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.09, verb: estimate, label: update comparative plausibility, workflow_role: integrate, operation_kind: analytic, inputs: [{slot: likelihood_appraisals, type: appraisal, role: subject, cardinality: many, optional: false}], outputs: [{slot: comparative_result, type: estimate, role: result, cardinality: many, optional: false}], parameters: [prior odds, dependence handling], preconditions: [rivals collectively appraised], conclusion_supported: "the evidence changes relative plausibility of the rivals in this case", failure_output: model_conditional_only, method_owned_semantics: "priors and dependence must remain visible; result is not population frequency", evidence_basis: "Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.10, verb: perturb, label: challenge assumptions and evidence dependence, workflow_role: appraise, operation_kind: analytic, inputs: [{slot: comparative_result, type: estimate, role: subject, cardinality: many, optional: false}], outputs: [{slot: sensitivity_findings, type: finding, role: result, cardinality: many, optional: false}], parameters: [alternative priors, likelihoods, dependence], preconditions: [comparative result exists], conclusion_supported: "the ranking is or is not robust to plausible judgments", failure_output: fragile_result, method_owned_semantics: "sensitivity ranges must be substantively plausible", evidence_basis: "Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.11, verb: synthesize, label: write calibrated case explanation, workflow_role: communicate, operation_kind: analytic, inputs: [{slot: comparative_result, type: estimate, role: subject, cardinality: many, optional: false}, {slot: sensitivity, type: finding, role: context, cardinality: many, optional: false}], outputs: [{slot: case_finding, type: finding, role: result, cardinality: one, optional: false}], parameters: [calibration language], preconditions: [rival comparison complete], conclusion_supported: "this rival currently best explains the bounded outcome for these reasons", failure_output: unresolved_rivals, method_owned_semantics: "explanation must retain mechanism and rival-specific evidence", evidence_basis: "Beach & Pedersen 2019; Fairfield & Charman 2022"}
  - {<<: *ideal, method_id: process_tracing, step_id: pt.12, verb: refuse, label: refuse unsupported causal resolution, workflow_role: appraise, operation_kind: analytic, inputs: [{slot: case_finding, type: finding, role: subject, cardinality: one, optional: false}], outputs: [{slot: unresolved_finding, type: finding, role: result, cardinality: one, optional: false}, {slot: evidence_gaps, type: gap, role: byproduct, cardinality: many, optional: false}], parameters: [minimum discriminating evidence], preconditions: [rivals remain insufficiently distinguished], conclusion_supported: "the case does not currently distinguish these explanations", failure_output: none_terminal_refusal, method_owned_semantics: "inconclusive is a valid terminal result", evidence_basis: "Beach & Pedersen 2019; Fairfield & Charman 2022", optional: true}

  # Individually randomized two-arm superiority trial
  - {<<: *ideal, method_id: causal_effect_estimation_rct, step_id: rct.01, verb: define, label: define objective and estimand, workflow_role: frame, operation_kind: analytic, inputs: [{slot: policy_question, type: claim, role: subject, cardinality: one, optional: false}], outputs: [{slot: estimand, type: estimand, role: result, cardinality: one, optional: false}], parameters: [population, treatments, outcome, intercurrent events, summary], preconditions: [causal intervention question], conclusion_supported: "this is the treatment effect the trial is designed to estimate", failure_output: ill_defined_estimand, method_owned_semantics: "estimand aligns question design analysis and interpretation", evidence_basis: "ICH E9(R1)"}
  - {<<: *ideal, method_id: causal_effect_estimation_rct, step_id: rct.02, verb: construct, label: prespecify protocol and analysis, workflow_role: design, operation_kind: methodological_support, inputs: [{slot: estimand, type: estimand, role: subject, cardinality: one, optional: false}], outputs: [{slot: protocol, type: analysis_plan, role: result, cardinality: one, optional: false}], parameters: [primary outcome, analysis model, missing data, multiplicity], preconditions: [estimand frozen], conclusion_supported: "primary design and analysis choices predate outcome inspection", failure_output: disclosed_deviation, method_owned_semantics: "post-outcome changes alter confirmatory status", evidence_basis: "ICH E9; CONSORT 2025 items 2-4 and 24"}
  - {<<: *ideal, method_id: causal_effect_estimation_rct, step_id: rct.03, verb: define, label: set eligibility and recruitment, workflow_role: design, operation_kind: analytic, inputs: [{slot: target_population, type: case_set, role: subject, cardinality: many, optional: false}], outputs: [{slot: eligibility_criteria, type: criterion, role: result, cardinality: many, optional: false}], parameters: [inclusion exclusion settings], preconditions: [target population specified], conclusion_supported: "the enrolled sample is drawn under these declared rules", failure_output: recruitment_infeasible, method_owned_semantics: "eligibility changes target-population interpretation", evidence_basis: "ICH E9; CONSORT 2025 items 8-9"}
