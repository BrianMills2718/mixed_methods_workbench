topology_assertions:
- exactly_three_rounds_are_preserved
- each_later_round_receives_controlled_anonymous_feedback_and_preserves_prior_history
- stable_disagreement_and_attrition_are_reportable_outputs
- consensus_never_transitions_directly_to_truth_or_policy_decision
topology:
  shape: dag
  required_cycles: []
  optional_cycles: []
  prohibited_cycles:
  - cycle: p12.move.feedback1 -> p12.move.round1
    reason: later feedback cannot rewrite independent round one
  - cycle: p12.move.interpret -> p12.move.design
    reason: results cannot rewrite prespecified protocol
  prohibited_edges:
  - p12.c17
  - p12.c18
  - p12.c19
  entry_points:
  - p12.move.design
  terminal_points:
  - step: p12.move.report
    state: consensus_dissensus_or_insufficient_panel_evidence
  - step: p12.move.interpret
    state: honest_stop_attrition_or_missingness_precludes_interpretation
