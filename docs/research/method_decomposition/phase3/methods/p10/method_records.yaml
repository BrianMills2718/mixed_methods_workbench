schema_version: phase3-method-records-1.0
method_id: P10
variant: rand_robust_decision_making_deep_uncertainty
defaults:
  move:
    level: analytical_move
    operation_kind: analytic
    source_authority_or_inferential_role: frozen_rdm_sources_and_declared_decision_inputs
    applicability_boundary: selected_rdm_variant_and_declared_decision_scope
    refusal_or_qualification: conditional_result_with_unexplored_uncertainty
    performer: rdm_analysis_team
    judgment_owner: rdm_analysis_lead
    acceptance_authority: independent_model_and_method_reviewer
    recommender: strategy_sponsor_or_design_team
    value_goal_authority: accountable_decision_makers_and_affected_stakeholders
    decision_authority: accountable_decision_maker
    implementation_evidence: methodology_reference_only
    collision_participation: level_2_only
    guards: &id001
      temporal: preserve_framing_ensemble_and_iteration_order
      access: declared_models_data_and_stakeholder_inputs
      run_version: immutable_experiment_batch_and_successor_strategy_versions
  action:
    level: execution_action
    operation_kind: runtime_delivery
    information_origin: &id002
    - derived
    - simulated
    source_authority_or_inferential_role: parent_move_execution_support
    applicability_boundary: parent_move_only
    refusal_or_qualification: failed_execution_blocks_parent_move
    performer: deterministic_model_runner
    judgment_owner: none
    acceptance_authority: rdm_analysis_lead
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: design_only
    collision_participation: level_3_only
    guards: &id003
      temporal: execute_only_frozen_batch
      access: approved_models_and_inputs_only
      run_version: receipt_binds_code_model_inputs_outputs
phases:
- record_id: p10.phase.frame
  level: method_phase
  label: frame the decision and uncertainty
  operation_kinds:
  - analytic
  collision_participation: none
- record_id: p10.phase.explore
  level: method_phase
  label: evaluate strategies and discover vulnerabilities
  operation_kinds:
  - analytic
  - runtime_delivery
  collision_participation: none
- record_id: p10.phase.adapt
  level: method_phase
  label: compare revise and advise
  operation_kinds:
  - analytic
  collision_participation: none
