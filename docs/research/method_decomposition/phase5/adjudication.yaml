  - p07:p07.move.refuse
  - p08:p08.move.refuse
  - p09:p09.move.refuse
  verdict: shared_shell
  justification: 'All four are refusal terminals (''this_record_is_the_refusal_terminal'') with nearly the same signature:
    appraisal plus optional uncertainty_note and optional claim, returning a finding. All are single-pass and none is in a
    required cycle, and all four conclusions are the same kind of statement: ''no population prevalence is licensed for this
    survey version, for the named reasons'', ''the named claim is not licensed for this measurement version'', ''no forecast
    is licensed for this task and origin'', ''the named claim is not licensed by this model version''. The methods are materially
    different (probability survey, supervised text measurement, probabilistic forecasting, agent-based simulation), so this
    clears the three-method threshold. However, the decision rules are method-owned and are not interchangeable parameters:
    p06 refuses on unbounded coverage, nonresponse or variance; p07 on unreliable coding or a contaminated holdout; p08 on
    leakage, miscalibration or regime shift; p09 on missing verification or decisive sensitivity. That makes this a shared
    shell with a method-owned interior, not one capability.'
  shell_does: Emit a terminal refusal finding naming the specific claim refused, the version or scope it applies to (survey
    version, measurement version, task and origin, model version), and the reasons, each linked to the appraisal or uncertainty_note
