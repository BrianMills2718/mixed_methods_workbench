  information_origin:
  - observed
  - reported
  - interpreted
  method_owned_rule: selected_qualitative_method_owns_sampling_analysis_reflexivity_and_claim_scope
  permitted_conclusion: qualitative_strand_findings_with_anchors_and_limits
  source_basis: strand_specific_method_plus_nih_2011
  exact_anchors:
  - nih_2011_both_data_forms
