schema_version: phase3-method-records-0.1
method_id: p09
variant: ODD-described agent-based policy simulation experiment
revision_notes:
  - date: 2026-10-08
    review: lane_receipts/reviews/2026-10-08-P3-RESEARCH-B.json
    changes: >-
      Records converted from flow style to block style so that named, typed slots (spec section 5.1) stay
      readable; field names are unchanged. Added controlled verbs (spec section 6). Split
      verification_findings_and_verified_build into an appraisal slot and a model slot, and the implementation
      output into the executable model plus its correspondence map. design now outputs the declared
      uncertainty space and structural variants that sensitivity consumes. conclude's output is split into
      typed slots with their own information origins so observed evidence and simulated findings stay
      distinguishable. p09.move.implement is methodological_support (spec 5.0a rule 4). Added a refuse record.
      Experiment design is now anchored in Kleijnen 2015 and R&G section 8.3 rather than R&G ch. 8 as a whole
      (see frame.yaml post_freeze_corrections).
  - slot_note: >-
      Inputs that receive an execution receipt from a child action use role `context`; spec section 5.1 offers
      `trace` only as an output role. Inputs with `external_origin` come from outside the method and state their
      origin; every other input is bound by a connection in connections.yaml. Output slots that need it carry
      their own information_origin; the record-level information_origin is the union.
phases:
  - {phase_id: p09.phase.concept, level: method_phase, label: purpose specify implement, operation_kinds: [analytic, methodological_support], collision_participation: none}
  - {phase_id: p09.phase.appraise, level: method_phase, label: verify ground and design, operation_kinds: [analytic, methodological_support], collision_participation: none}
  - {phase_id: p09.phase.experiment, level: method_phase, label: execute compare stress conclude or refuse, operation_kinds: [analytic, methodological_support, runtime_delivery], collision_participation: none}
moves:
  - record_id: p09.move.purpose
    level: analytical_move
    parent_phase: p09.phase.concept
    label: freeze policy question purpose abstraction and target patterns
    verb: define
    operation_kind: analytic
    inputs:
      - {slot: policy_problem, type: concept, role: subject, cardinality: one, optional: false, external_origin: interpreted (sponsor question)}
      - {slot: domain_evidence, type: evidence_item, role: context, cardinality: many, optional: false, external_origin: observed and reported (domain literature and data)}
      - {slot: intended_use, type: value_judgment, role: context, cardinality: one, optional: false, external_origin: interpreted (sponsor's declared use)}
    outputs:
      - {slot: frozen_model_purpose_and_boundary, type: design_parameters, role: result, cardinality: one, optional: false}
    information_origin: [observed, reported, interpreted]
    source_authority_or_inferential_role: purpose_specific_modeling_frame
    applicability_boundary: intended_question_system_and_excluded_phenomena
    method_owned_rule: abstraction_is_judged_against_purpose_and_omissions_bound_inference
    permitted_conclusion: this_model_is_intended_to_explore_these_patterns_only
    refusal_or_qualification: unsuitable_method_or_unbounded_purpose
    performer: modeler_and_domain_experts
    judgment_owner: simulation_method_lead
    acceptance_authority: model_review_authority
    recommender: none
    value_goal_authority: policy_sponsor
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Grimm_2020_ODD_purpose_and_patterns;Railsback_Grimm_2019_ch3
    exact_anchors: [ODD2020:purpose_and_patterns, RG2019:ch3]
    guards: {temporal: freeze_before_model_results, access: declared_domain_evidence_only, run_version: purpose_version_is_immutable_for_experiment}
  - record_id: p09.move.specify
    level: analytical_move
    parent_phase: p09.phase.concept
    label: specify entities states scales processes schedule initialization inputs and submodels
    verb: conceptualize
    operation_kind: analytic
    inputs:
      - {slot: mechanism_and_parameter_evidence, type: evidence_item, role: subject, cardinality: many, optional: false, external_origin: observed, reported or elicited (empirical, theoretical and expert sources, each labelled)}
      - {slot: frozen_model_purpose_and_boundary, type: design_parameters, role: criteria, cardinality: one, optional: false}
      - {slot: specification_defect, type: appraisal, role: prior, cardinality: optional_one, optional: true}
      - {slot: structural_revision_request, type: appraisal, role: prior, cardinality: optional_one, optional: true}
    outputs:
      - {slot: complete_odd_model_specification, type: model, role: result, cardinality: one, optional: false}
    information_origin: [observed, reported, interpreted, derived]
    source_authority_or_inferential_role: ODD_model_description
    applicability_boundary: declared_model_structure_and_mechanisms
    method_owned_rule: empirical_theoretical_and_hypothetical_rules_are_labeled_and_complete_enough_to_reimplement
    permitted_conclusion: conceptual_model_and_assumptions_are_inspectable
    refusal_or_qualification: underspecified_dynamics_block_implementation_acceptance
    performer: agent_based_modeler
    judgment_owner: simulation_method_lead
    acceptance_authority: model_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Grimm_2020_ODD_sections_3_4
    exact_anchors: [ODD2020:overview, ODD2020:design_concepts, ODD2020:details]
    guards: {temporal: specification_precedes_verification_baseline, access: input_provenance_controls, run_version: specification_digest_and_successor_policy}
  - record_id: p09.move.implement
    level: analytical_move
    parent_phase: p09.phase.concept
    label: implement executable model and map code to specification
    verb: construct
    operation_kind: methodological_support
    operation_kind_note: reclassified from runtime_delivery on 2026-10-08; R&G chs. 4 and 6 specify implementing from the ODD description and documenting the code-to-specification correspondence, so spec 5.0a rule 4 makes it methodological_support (it licenses no claim of its own)
    inputs:
      - {slot: complete_odd_model_specification, type: model, role: subject, cardinality: one, optional: false}
      - {slot: implementation_defect, type: appraisal, role: prior, cardinality: optional_one, optional: true}
    outputs:
      - {slot: versioned_executable_model, type: model, role: result, cardinality: one, optional: false}
      - {slot: code_correspondence_map, type: evidence_item, role: byproduct, cardinality: many, optional: false}
    information_origin: [derived]
    source_authority_or_inferential_role: implementation_realizes_but_does_not_replace_conceptual_model
    applicability_boundary: exact_build_dependencies_and_runtime
    method_owned_rule: implementation_choices_cannot_silently_change_the_declared_conceptual_model
    permitted_conclusion: an_executable_candidate_realizes_the_specification
    refusal_or_qualification: documentation_without_executable_correspondence_is_incomplete
    performer: model_developer
    judgment_owner: simulation_method_lead
    acceptance_authority: software_and_model_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: design_only
    source_basis: Railsback_Grimm_2019_chapters_4_6
    exact_anchors: [RG2019:4.2, RG2019:4.3, RG2019:6.4]
    guards: {temporal: build_after_specification_version, access: governed_source_and_dependencies, run_version: build_digest_binds_specification_code_and_environment}
  - record_id: p09.move.verify
    level: analytical_move
    parent_phase: p09.phase.appraise
    label: verify computerized model against specification
    verb: test
    operation_kind: methodological_support
    inputs:
      - {slot: versioned_executable_model, type: model, role: subject, cardinality: one, optional: false}
      - {slot: complete_odd_model_specification, type: model, role: criteria, cardinality: one, optional: false}
      - {slot: code_correspondence_map, type: evidence_item, role: context, cardinality: many, optional: false}
      - {slot: verification_receipts, type: evidence_item, role: context, cardinality: many, optional: false}
    outputs:
      - {slot: verification_appraisal, type: appraisal, role: result, cardinality: one, optional: false}
      - {slot: verified_build, type: model, role: result, cardinality: optional_one, optional: true}
    information_origin: [derived]
    source_authority_or_inferential_role: computerized_model_verification
    applicability_boundary: tested_invariants_extremes_traces_and_build
    method_owned_rule: verification_asks_whether_code_matches_specification_not_whether_model_is_true
    permitted_conclusion: tested_build_behaves_as_specified_or_defects_are_known
    refusal_or_qualification: failed_verification_returns_to_implementation_or_specification
    performer: model_test_team
    judgment_owner: simulation_method_lead
    acceptance_authority: software_and_model_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Railsback_Grimm_2019_ch6;Sargent_2013_verification
    exact_anchors: [RG2019:ch6, Sargent2013:computerized_model_verification]
    guards: {temporal: verification_before_experiment_release, access: exact_build_and_oracles, run_version: findings_bind_build_spec_tests_and_environment}
  - record_id: p09.move.ground
    level: analytical_move
    parent_phase: p09.phase.appraise
    label: parameterize calibrate and assess empirical fitness
    verb: calibrate
    operation_kind: analytic
    inputs:
      - {slot: verified_build, type: model, role: subject, cardinality: one, optional: false}
      - {slot: empirical_patterns_and_inputs, type: dataset, role: criteria, cardinality: many, optional: false, external_origin: observed, reported or elicited (calibration and validation targets, roles declared before fitting)}
    outputs:
      - {slot: parameterized_model, type: parameter_set, role: result, cardinality: one, optional: false, information_origin: [derived]}
      - {slot: empirical_fitness_record, type: appraisal, role: result, cardinality: one, optional: false, information_origin: [observed, derived, simulated]}
    information_origin: [observed, reported, elicited, derived, simulated]
    source_authority_or_inferential_role: conceptual_operational_and_data_validity_evidence
    applicability_boundary: patterns_tolerances_calibration_data_and_validation_data
    method_owned_rule: calibration_fit_does_not_validate_every_mechanism_and_reused_targets_are_not_independent_validation
    permitted_conclusion: model_matches_or_fails_named_patterns_for_this_use
    refusal_or_qualification: empirical_fitness_gap_is_retained_and_may_block_extrapolation
    performer: modeler_and_domain_experts
    judgment_owner: simulation_method_lead
    acceptance_authority: model_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Sargent_2013_conceptual_operational_data_validity;Railsback_Grimm_2019_ch20
    exact_anchors: [Sargent2013:validity_types, RG2019:20.3, RG2019:20.4]
    guards: {temporal: calibration_and_validation_roles_declared_before_fit, access: empirical_data_scope_enforced, run_version: parameter_set_binds_data_algorithm_and_model}
  - record_id: p09.move.design
    level: analytical_move
    parent_phase: p09.phase.appraise
    label: freeze configurations contrasts estimands replications seeds and uncertainty space
    verb: construct
    operation_kind: analytic
    inputs:
      - {slot: parameterized_model, type: parameter_set, role: subject, cardinality: one, optional: false}
      - {slot: frozen_model_purpose_and_boundary, type: design_parameters, role: criteria, cardinality: one, optional: false}
      - {slot: verified_build, type: model, role: context, cardinality: one, optional: false}
      - {slot: empirical_fitness_record, type: appraisal, role: context, cardinality: one, optional: false}
    outputs:
      - {slot: frozen_simulation_experiment_plan, type: design_parameters, role: result, cardinality: one, optional: false}
      - {slot: declared_uncertainty_space, type: parameter_set, role: result, cardinality: many, optional: false}
      - {slot: structural_variants, type: configuration, role: result, cardinality: many, optional: false}
    information_origin: [interpreted, derived]
    source_authority_or_inferential_role: simulation_design_of_experiments_beyond_ODD
    applicability_boundary: declared_configuration_factor_range_estimand_and_precision
    method_owned_rule: scenario contrasts match the policy question, factors and levels are declared before runs, and the number of replications is set from a frozen Monte Carlo precision target
    permitted_conclusion: declared_runs_form_a_valid_computational_comparison
    refusal_or_qualification: post_result_scenario_selection_or_undefined_precision_invalidates_confirmatory_status
    performer: simulation_experimenter
    judgment_owner: simulation_method_lead
    acceptance_authority: experiment_review_authority
    recommender: none
    value_goal_authority: policy_sponsor
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Kleijnen_2015_ch2_ch3;Railsback_Grimm_2019_8.3
    exact_anchors: [Kleijnen2015:ch2, Kleijnen2015:ch3, RG2019:8.3]
    guards: {temporal: freeze_before_ensemble_execution, access: no_experiment_results_before_plan_acceptance, run_version: plan_digest_binds_build_parameters_factors_estimands_and_replications}
  - record_id: p09.move.execute
    level: analytical_move
    parent_phase: p09.phase.experiment
    label: execute and retain replicated stochastic ensemble
    verb: simulate
    operation_kind: analytic
    inputs:
      - {slot: verified_build, type: model, role: subject, cardinality: one, optional: false}
      - {slot: frozen_simulation_experiment_plan, type: design_parameters, role: config_data, cardinality: one, optional: false}
      - {slot: parameterized_model, type: parameter_set, role: config_data, cardinality: one, optional: false}
      - {slot: replication_request, type: appraisal, role: prior, cardinality: optional_one, optional: true}
      - {slot: variant_run_requests, type: configuration, role: prior, cardinality: optional_many, optional: true}
      - {slot: run_receipts, type: model_run, role: context, cardinality: many, optional: false}
    outputs:
      - {slot: provenance_bound_simulation_runs, type: model_run, role: result, cardinality: many, optional: false, information_origin: [simulated]}
    information_origin: [simulated]
    source_authority_or_inferential_role: generated_model_behavior_under_declared_configurations
    applicability_boundary: exact_model_configuration_seed_and_environment
    method_owned_rule: each_trajectory_is_generated_evidence_not_observed_world_evidence
    permitted_conclusion: model_generated_these_trajectories_under_these_conditions
    refusal_or_qualification: missing_seed_configuration_or_failure_state_blocks_use
    performer: deterministic_simulation_runtime
    judgment_owner: simulation_method_lead
    acceptance_authority: experiment_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: design_only
    source_basis: Railsback_Grimm_2019_8.3;Kleijnen_2015_ch3
    exact_anchors: [RG2019:8.3, Kleijnen2015:ch3]
    guards: {temporal: after_plan_freeze, access: frozen_model_and_configuration_only, run_version: every_run_binds_build_config_seed_environment_and_outputs}
  - record_id: p09.move.compare
    level: analytical_move
    parent_phase: p09.phase.experiment
    label: estimate model-conditional contrasts and inspect traces
    verb: estimate
    operation_kind: analytic
    inputs:
      - {slot: provenance_bound_simulation_runs, type: model_run, role: subject, cardinality: many, optional: false}
      - {slot: frozen_simulation_experiment_plan, type: design_parameters, role: criteria, cardinality: one, optional: false}
      - {slot: run_receipts, type: model_run, role: context, cardinality: many, optional: false}
    outputs:
      - {slot: simulated_contrasts_and_trace_explanations, type: estimate, role: result, cardinality: many, optional: false, information_origin: [simulated, derived, interpreted]}
      - {slot: monte_carlo_precision, type: uncertainty_note, role: result, cardinality: one, optional: false}
      - {slot: replication_request, type: appraisal, role: byproduct, cardinality: optional_one, optional: true}
    information_origin: [simulated, derived, interpreted]
    source_authority_or_inferential_role: experiment_estimands_over_generated_ensemble
    applicability_boundary: declared_model_and_configuration_space
    method_owned_rule: Monte_Carlo_precision_is_separate_from_model_and_structural_uncertainty
    permitted_conclusion: within_this_model_configurations_differ_by_these_generated_amounts_and_paths
    refusal_or_qualification: unstable_replication_or_failed_runs_block_contrast
    performer: simulation_analyst
    judgment_owner: simulation_method_lead
    acceptance_authority: experiment_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Kleijnen_2015_ch3;Railsback_Grimm_2019_8.3_ch22
    exact_anchors: [Kleijnen2015:ch3, RG2019:8.3, RG2019:22.4]
    guards: {temporal: after_required_replications, access: run_artifacts_and_plan_only, run_version: contrast_binds_exact_run_set_and_estimator}
  - record_id: p09.move.sensitivity
    level: analytical_move
    parent_phase: p09.phase.experiment
    label: separate parameter input and structural sensitivity
    verb: perturb
    operation_kind: analytic
    inputs:
      - {slot: simulated_contrasts_and_trace_explanations, type: estimate, role: subject, cardinality: many, optional: false}
      - {slot: declared_uncertainty_space, type: parameter_set, role: criteria, cardinality: many, optional: false}
      - {slot: structural_variants, type: configuration, role: context, cardinality: many, optional: false}
      - {slot: variant_run_sets, type: model_run, role: context, cardinality: many, optional: false}
    outputs:
      - {slot: sensitivity_robustness_and_failure_boundaries, type: appraisal, role: result, cardinality: one, optional: false}
      - {slot: variant_run_requests, type: configuration, role: byproduct, cardinality: many, optional: false}
      - {slot: structural_revision_request, type: appraisal, role: byproduct, cardinality: optional_one, optional: true}
    information_origin: [simulated, derived, interpreted]
    source_authority_or_inferential_role: policy_model_uncertainty_and_sensitivity_analysis
    applicability_boundary: declared_ranges_distributions_and_structural_alternatives
    method_owned_rule: structural_uncertainty_cannot_be_collapsed_into_random_seed_or_parameter_noise
    permitted_conclusion: influential_assumptions_and_robust_regions_are_identified
    refusal_or_qualification: nonrobust_or_unexplored_decisive_assumptions_require_qualification_or_refusal
    performer: simulation_analyst
    judgment_owner: simulation_method_lead
    acceptance_authority: model_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Azzini_2020_chapters_2_4;Railsback_Grimm_2019_23.2_23.4
    exact_anchors: [JRC2020:ch2, JRC2020:ch3, JRC2020:ch4, RG2019:23.2, RG2019:23.3, RG2019:23.4]
    guards: {temporal: uncertainty_design_precedes_interpretation, access: declared_variant_space, run_version: sensitivity_binds_run_sets_ranges_methods_and_structures}
  - record_id: p09.move.conclude
    level: analytical_move
    parent_phase: p09.phase.experiment
    label: apply adequacy gate and state model-conditional finding
    verb: review
    operation_kind: methodological_support
    inputs:
      - {slot: simulated_contrasts_and_trace_explanations, type: estimate, role: subject, cardinality: many, optional: false}
      - {slot: frozen_model_purpose_and_boundary, type: design_parameters, role: criteria, cardinality: one, optional: false}
      - {slot: verification_appraisal, type: appraisal, role: context, cardinality: one, optional: false}
      - {slot: empirical_fitness_record, type: appraisal, role: context, cardinality: one, optional: false}
      - {slot: monte_carlo_precision, type: uncertainty_note, role: context, cardinality: one, optional: false}
      - {slot: sensitivity_robustness_and_failure_boundaries, type: appraisal, role: context, cardinality: one, optional: false}
    outputs:
      - slot: model_conditional_finding
        type: finding
        role: result
        cardinality: one
        optional: false
        information_origin: [simulated, derived, interpreted]
        origin_note: the finding's origin stays simulated whatever observed data parameterized or calibrated the model (p09.u05)
      - slot: empirical_fitness_appraisal
        type: appraisal
        role: result
        cardinality: one
        optional: false
        information_origin: [observed, derived]
        origin_note: references the observed calibration and validation targets and states which were reused for calibration
      - slot: replication_package
        type: evidence_item
        role: trace
        cardinality: many
        optional: false
        information_origin: [derived, simulated]
    information_origin: [observed, derived, simulated, interpreted]
    information_origin_note: the union of the output slots' origins; observed applies only to empirical_fitness_appraisal
    source_authority_or_inferential_role: integrated_fitness_for_purpose_review
    applicability_boundary: exact_purpose_model_build_experiment_evidence_and_sensitivity
    method_owned_rule: model_cannot_validate_its_own_assumptions_or_license_unconditional_real_world_effect
    permitted_conclusion: if_declared_model_assumptions_are_useful_approximations_these_configurations_generate_these_patterns
    refusal_or_qualification: route_real_world_prediction_or_policy_effect_requests_to_p09.move.refuse
    performer: simulation_method_lead
    judgment_owner: simulation_method_lead
    acceptance_authority: model_review_authority
    recommender: policy_analyst_if_separately_authorized
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: Grimm_2020;Sargent_2013;Azzini_2020
    exact_anchors: [ODD2020:scope, Sargent2013:recommended_procedure, JRC2020:communication]
    guards: {temporal: after_verification_fitness_experiment_and_sensitivity, access: review_package_preserves_source_controls, run_version: finding_binds_all_exact_upstream_versions}
  - record_id: p09.move.refuse
    level: analytical_move
    parent_phase: p09.phase.experiment
    label: refuse real-world or unsupported simulation claim
    verb: refuse
    operation_kind: analytic
    inputs:
      - {slot: failed_appraisal, type: appraisal, role: subject, cardinality: optional_many, optional: true}
      - {slot: precision_failure, type: uncertainty_note, role: context, cardinality: optional_one, optional: true}
      - {slot: requested_claim, type: claim, role: context, cardinality: optional_one, optional: true, external_origin: interpreted (a real-world prediction or policy-effect claim requested by a consumer)}
    outputs:
      - {slot: refusal_record, type: finding, role: result, cardinality: one, optional: false}
    information_origin: [derived, interpreted]
    source_authority_or_inferential_role: uncertainty_stopping_rule
    applicability_boundary: the_exact_model_build_experiment_and_claim_that_failed
    method_owned_rule: no policy-world effect or prediction is stated when verification, empirical fitness, experiment provenance, replication precision, or decisive sensitivity evidence is absent
    permitted_conclusion: the named claim is not licensed by this model version, for the named reasons
    refusal_or_qualification: this_record_is_the_refusal_terminal
    performer: simulation_method_lead
    judgment_owner: simulation_method_lead
    acceptance_authority: model_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: methodology_reference_only
    source_basis: uncertainty.yaml_stopping_rule;Sargent_2013;Azzini_2020
    exact_anchors: [uncertainty:p09:stopping_rule, Sargent2013:recommended_procedure, JRC2020:communication]
    guards: {temporal: replaces_finding_for_this_version, access: refusal_reasons_released_with_review_package, run_version: refusal_binds_failed_appraisal_versions}
actions:
  - record_id: p09.action.run_model
    level: execution_action
    parent_move: p09.move.execute
    label: schedule model runs and retain seeds traces and failures
    verb: simulate
    operation_kind: runtime_delivery
    inputs:
      - {slot: verified_build, type: model, role: subject, cardinality: one, optional: false}
      - {slot: frozen_simulation_experiment_plan, type: design_parameters, role: config_data, cardinality: one, optional: false}
    outputs:
      - {slot: run_receipts, type: model_run, role: trace, cardinality: many, optional: false, information_origin: [simulated]}
    information_origin: [simulated]
    source_authority_or_inferential_role: parent_move_execution_and_custody
    applicability_boundary: frozen_experiment
    method_owned_rule: none
    permitted_conclusion: no_real_world_conclusion
    refusal_or_qualification: incomplete_receipt_blocks_run_use
    performer: simulation_runtime
    judgment_owner: none
    acceptance_authority: experiment_review_authority
    recommender: none
    value_goal_authority: none
    decision_authority: none
    implementation_evidence: design_only
    source_basis: Railsback_Grimm_2019_8.3
    exact_anchors: [RG2019:8.3]
    guards: {temporal: after_plan_freeze, access: exact_build_and_configs, run_version: append_only_run_identity}
  - record_id: p09.action.verify_invariants
    level: execution_action
    parent_move: p09.move.verify
    label: execute invariant extreme-case and trace checks
    verb: test
    operation_kind: methodological_support
    inputs:
      - {slot: versioned_executable_model, type: model, role: subject, cardinality: one, optional: false}
    outputs:
      - {slot: verification_receipts, type: evidence_item, role: trace, cardinality: many, optional: false}
    information_origin: [derived]
    source_authority_or_inferential_role: parent_move_verification_execution
    applicability_boundary: tested_build_and_oracles
    method_owned_rule: none
    permitted_conclusion: check_results_only
    refusal_or_qualification: failed_check_blocks_verified_status
    performer: deterministic_test_runner
    judgment_owner: none
