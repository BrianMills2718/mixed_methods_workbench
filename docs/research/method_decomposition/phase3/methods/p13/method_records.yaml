    type: theory
    role: context
    cardinality: one
    optional: false
  - slot: stakeholder_goals
    type: value_judgment
    role: criteria
    cardinality: many
    optional: false
  - slot: feasible_data_sources
    type: source_document
    role: context
    cardinality: many
    optional: false
  outputs:
  - slot: frozen_convergent_design
    type: design_parameters
    role: result
    cardinality: one
    optional: false
